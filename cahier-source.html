<title>Cahier — Global BBA</title>
<style>
  /* ============================================================
     CAHIER — direction visuelle
     Grammaire d'interaction empruntée aux applications mobiles :
     onglets en bas, geste de création central, rangée de pastilles.
     Identité propre : sombre d'abord, couleur porteuse d'information
     (une teinte par matière), interface en sans-serif et contenu de
     cours en serif — l'outil est une application, ce qu'il contient
     reste un cahier.
     ============================================================ */
  :root{
    color-scheme: dark light;

    --fond:#0B0F0E;          /* nuit, biais vert-ardoise plutôt que noir pur */
    --surface:#141A18;
    --surface-2:#1B2320;
    --surface-3:#242E2A;
    --trait:#2A3531;
    --trait-fort:#3A4741;

    --texte:#ECF1EE;
    --texte-2:#9AA7A1;
    --texte-3:#6B7873;

    --accent:#4DD6A8;        /* action : jade lumineux, lisible sur les deux fonds */
    --accent-doux:#12312A;
    --sur-accent:#04140F;

    --ok:#5FD39A; --ok-doux:#12291F;
    --attention:#E0A650; --attention-doux:#2C2213;
    --alerte:#F0806B; --alerte-doux:#311914;
    --neutre-doux:#212B27;

    --ombre:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
    --r:14px; --r-s:10px;

    --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --lecture:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
    --chiffres:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

    --barre:58px;            /* hauteur de la barre d'onglets */
    --sûr-bas:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root{
      --fond:#FAFAF8; --surface:#FFFFFF; --surface-2:#F3F5F2; --surface-3:#E9EDE9;
      --trait:#E0E5E0; --trait-fort:#C9D1CB;
      --texte:#131916; --texte-2:#5A6661; --texte-3:#8B9791;
      --accent:#0E9E74; --accent-doux:#E2F5EE; --sur-accent:#FFFFFF;
      --ok:#1B8459; --ok-doux:#E3F3EA;
      --attention:#9A6A12; --attention-doux:#F7EEDC;
      --alerte:#C0472F; --alerte-doux:#FAE6E1;
      --neutre-doux:#EDF0EC;
      --ombre:0 1px 2px rgba(19,25,22,.05), 0 12px 32px -22px rgba(19,25,22,.4);
    }
  }
  :root[data-theme="light"]{
    --fond:#FAFAF8; --surface:#FFFFFF; --surface-2:#F3F5F2; --surface-3:#E9EDE9;
    --trait:#E0E5E0; --trait-fort:#C9D1CB;
    --texte:#131916; --texte-2:#5A6661; --texte-3:#8B9791;
    --accent:#0E9E74; --accent-doux:#E2F5EE; --sur-accent:#FFFFFF;
    --ok:#1B8459; --ok-doux:#E3F3EA;
    --attention:#9A6A12; --attention-doux:#F7EEDC;
    --alerte:#C0472F; --alerte-doux:#FAE6E1;
    --neutre-doux:#EDF0EC;
    --ombre:0 1px 2px rgba(19,25,22,.05), 0 12px 32px -22px rgba(19,25,22,.4);
  }
  :root[data-theme="dark"]{
    --fond:#0B0F0E; --surface:#141A18; --surface-2:#1B2320; --surface-3:#242E2A;
    --trait:#2A3531; --trait-fort:#3A4741;
    --texte:#ECF1EE; --texte-2:#9AA7A1; --texte-3:#6B7873;
    --accent:#4DD6A8; --accent-doux:#12312A; --sur-accent:#04140F;
    --ok:#5FD39A; --ok-doux:#12291F;
    --attention:#E0A650; --attention-doux:#2C2213;
    --alerte:#F0806B; --alerte-doux:#311914;
    --neutre-doux:#212B27;
    --ombre:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:none}
  body{
    margin:0;background:var(--fond);color:var(--texte);
    font-family:var(--ui);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:650}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  ::placeholder{color:var(--texte-3)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hide{display:none !important}

  /* ---------- ossature ---------- */
  .app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .scene{flex:1;padding-bottom:calc(var(--barre) + var(--sûr-bas) + 12px)}
  .colonne{max-width:680px;margin:0 auto;padding:0 16px}

  /* ---------- barre supérieure ---------- */
  .entete{
    position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--fond) 88%,transparent);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--trait);
  }
  .entete-ligne{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:680px;margin:0 auto}
  .marque{font-family:var(--lecture);font-size:21px;font-weight:600;letter-spacing:-.02em;flex:1}
  .retour{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--texte);font-weight:500}
  .icone-btn{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    font-size:17px;color:var(--texte);transition:background .12s
  }
  .icone-btn:hover{background:var(--surface-2)}
  .titre-vue{font-size:16px;font-weight:650;flex:1;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- rangée de matières ---------- */
  .rangee{display:flex;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none;
    border-bottom:1px solid var(--trait)}
  .rangee::-webkit-scrollbar{display:none}
  .rangee-int{display:flex;gap:14px;padding:0 16px;margin:0 auto;min-width:min-content}
  .pastille{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none}
  .anneau{
    position:relative;width:60px;height:60px;border-radius:50%;padding:2.5px;display:grid;place-items:center;
    transition:transform .14s
  }
  .anneau .badge{
    position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
    background:var(--alerte);color:#fff;font-size:11px;font-weight:700;font-style:normal;
    display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--fond);font-variant-numeric:tabular-nums
  }
  .pastille:active .anneau{transform:scale(.94)}
  .anneau i{
    width:100%;height:100%;border-radius:50%;background:var(--surface);
    display:grid;place-items:center;font-family:var(--lecture);font-size:20px;font-weight:600;
    font-style:normal;color:var(--texte)
  }
  .pastille span{
    font-size:11.5px;color:var(--texte-2);text-align:center;line-height:1.25;
    max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .pastille[aria-current="true"] span{color:var(--texte);font-weight:600}
  .pastille.ajout .anneau i{color:var(--texte-3);font-size:26px;font-weight:300}

  /* ---------- cartes du fil ---------- */
  .fil{display:flex;flex-direction:column;gap:12px;padding:14px 0 24px}
  .carte{
    background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);
    overflow:hidden;transition:border-color .14s,transform .1s
  }
  .carte-cliquable{width:100%;text-align:left;display:block}
  .carte-cliquable:active{transform:scale(.992)}
  .carte-cliquable:hover{border-color:var(--trait-fort)}
  .carte-tete{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .jeton{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:var(--lecture);font-size:13px;font-weight:600;color:#fff}
  .carte-tete .qui{flex:1;min-width:0}
  .carte-tete .qui b{display:block;font-size:13.5px;font-weight:650;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .carte-tete .qui em{display:block;font-style:normal;font-size:11.5px;color:var(--texte-3)}
  .carte-corps{padding:0 14px 14px}
  .carte-corps h3{font-family:var(--lecture);font-size:18px;line-height:1.25;margin-bottom:6px}
  .carte-extrait{font-size:13.5px;color:var(--texte-2);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .carte-pied{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--trait);
    flex-wrap:wrap}

  /* ---------- section ---------- */
  .titre-section{display:flex;align-items:baseline;gap:8px;padding:18px 0 2px}
  .titre-section h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-3);font-weight:650}
  .titre-section span{font-family:var(--chiffres);font-size:11.5px;color:var(--texte-3);font-variant-numeric:tabular-nums}

  /* ---------- pastilles d'état ---------- */
  .etiq{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;
    border-radius:99px;font-weight:600;white-space:nowrap}
  .etiq.nouveau{background:var(--neutre-doux);color:var(--texte-2)}
  .etiq.encours{background:var(--attention-doux);color:var(--attention)}
  .etiq.arevoir{background:var(--alerte-doux);color:var(--alerte)}
  .etiq.maitrise{background:var(--ok-doux);color:var(--ok)}
  .etiq.type{background:var(--surface-2);color:var(--texte-2);font-family:var(--chiffres);
    font-size:10.5px;font-weight:500;letter-spacing:.02em}
  .etiq.manque{background:var(--alerte-doux);color:var(--alerte)}
  .etiq.ia{background:var(--accent-doux);color:var(--accent)}

  /* ---------- chapitres ---------- */
  .chap{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;
    background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);text-align:left}
  .chap:active{transform:scale(.992)}
  .chap:hover{border-color:var(--trait-fort)}
  .chap .num{font-family:var(--chiffres);font-size:12px;color:var(--texte-3);
    background:var(--surface-2);border-radius:8px;padding:5px 7px;font-variant-numeric:tabular-nums;flex:none}
  .chap .txt{flex:1;min-width:0}
  .chap .txt h3{font-family:var(--lecture);font-size:16.5px;line-height:1.3;margin-bottom:5px}
  .chap .meta{display:flex;flex-wrap:wrap;gap:5px}
  .chevron{color:var(--texte-3);flex:none;font-size:18px}

  /* ---------- documents ---------- */
  .doc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
  .doc-tete{width:100%;display:flex;align-items:center;gap:9px;padding:12px 14px;text-align:left}
  .doc-tete h4{flex:1;min-width:0;font-size:14px;font-weight:650;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-date{font-family:var(--chiffres);font-size:10.5px;color:var(--texte-3);font-variant-numeric:tabular-nums}
  .doc-corps{padding:0 14px 14px;border-top:1px solid var(--trait);padding-top:12px}

  /* ---------- prose : le cours reste un livre ---------- */
  .prose{font-family:var(--lecture);font-size:16px;line-height:1.62;color:var(--texte)}
  .prose>*:first-child{margin-top:0}
  .prose>*:last-child{margin-bottom:0}
  .prose h1,.prose h2,.prose h3{font-family:var(--ui);font-weight:700;margin:1.3em 0 .45em;line-height:1.28}
  .prose h1{font-size:18px}.prose h2{font-size:16.5px}.prose h3{font-size:15px}
  .prose p{margin:.6em 0}
  .prose ul,.prose ol{margin:.55em 0;padding-left:1.3em}
  .prose li{margin:.28em 0}
  .prose code{font-family:var(--chiffres);font-size:.85em;background:var(--surface-3);
    padding:1px 5px;border-radius:5px}
  .prose pre{background:var(--surface-3);padding:11px 13px;border-radius:10px;overflow-x:auto;margin:.75em 0}
  .prose pre code{background:none;padding:0}
  .prose blockquote{margin:.75em 0;padding:2px 0 2px 13px;border-left:2px solid var(--trait-fort);color:var(--texte-2)}
  .prose hr{border:none;border-top:1px solid var(--trait);margin:1.2em 0}
  .prose mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;
    padding:0 3px;border-radius:3px}
  .prose table{border-collapse:collapse;font-family:var(--ui);font-size:13.5px;margin:.75em 0}
  .prose th,.prose td{border:1px solid var(--trait);padding:6px 10px;text-align:left}
  .prose th{background:var(--surface-3);font-weight:650}
  .tablewrap{overflow-x:auto}

  /* ---------- boutons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 15px;border-radius:11px;border:1px solid var(--trait-fort);
    background:var(--surface-2);font-size:14px;font-weight:600;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--surface-3)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.fantome{border-color:transparent;background:transparent;color:var(--texte-2)}
  .btn.fantome:hover{background:var(--surface-2);color:var(--texte)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.large{width:100%;padding:13px}
  .btn.danger:hover{border-color:var(--alerte);color:var(--alerte)}

  .field{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--trait-fort);
    background:var(--surface);font-size:15px}
  .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
  textarea.field{resize:vertical;line-height:1.55}
  label.lab{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--texte-3);font-weight:650;margin-bottom:6px}

  /* ---------- barre d'onglets ---------- */
  .onglets{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    height:calc(var(--barre) + var(--sûr-bas));padding-bottom:var(--sûr-bas);
    background:color-mix(in srgb,var(--fond) 92%,transparent);
    backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--trait);
  }
  .onglet{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    height:100%;color:var(--texte-3);font-size:10px;font-weight:600;transition:color .12s}
  .onglet svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .onglet[aria-current="true"]{color:var(--texte)}
  .onglet.creer{color:var(--sur-accent)}
  .onglet.creer i{width:46px;height:32px;border-radius:11px;background:var(--accent);
    display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:400;
    color:var(--sur-accent);transition:transform .12s}
  .onglet.creer:active i{transform:scale(.92)}
  .pastille-alerte{position:absolute;top:9px;left:50%;margin-left:7px;width:7px;height:7px;
    border-radius:50%;background:var(--alerte);box-shadow:0 0 0 2px var(--fond)}

  /* ---------- feuille modale ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,8,7,.62);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;
    border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--trait);border-bottom:none;
    animation:monte .24s cubic-bezier(.22,1,.36,1)}
  @keyframes monte{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .modal.wide{max-width:820px}
  .modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;
    border-bottom:1px solid var(--trait);position:relative}
  .modal-head::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:2px;background:var(--trait-fort)}
  .modal-head h2{font-size:17px;font-weight:700;flex:1}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;align-items:center;
    padding:12px 18px calc(12px + var(--sûr-bas));border-top:1px solid var(--trait);background:var(--surface-2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stack{display:flex;flex-direction:column;gap:15px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{padding:7px 13px;border-radius:99px;border:1px solid var(--trait-fort);
    font-size:13px;font-weight:600;color:var(--texte-2)}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}

  .card{background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--r);
    padding:14px;margin-bottom:11px}
  .card h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--texte-3);
    font-weight:650;margin-bottom:9px}
  .note{font-size:13px;color:var(--texte-2);line-height:1.5}
  .avertit{background:var(--attention-doux);color:var(--attention);border:1px solid var(--attention);
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px;font-weight:500}
  .prose a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .etiq.apercu{background:var(--attention-doux);color:var(--attention)}

  /* menu de création */
  .creation-liste{display:flex;flex-direction:column;gap:8px}
  .creation{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:14px;border-radius:var(--r);border:1px solid var(--trait);background:var(--surface-2)}
  .creation:hover{border-color:var(--accent);background:var(--surface-3)}
  .creation:active{transform:scale(.99)}
  .creation-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--accent-doux);
    color:var(--accent);display:grid;place-items:center;font-size:20px}
  .creation span:nth-child(2){flex:1;min-width:0}
  .creation b{display:block;font-size:15.5px;font-weight:650}
  .creation em{display:block;font-style:normal;font-size:13px;color:var(--texte-2);margin-top:2px}

  /* marques relevées sur les pages manuscrites */
  .vu-marque{display:inline-block;font-size:.72em;font-family:var(--ui);font-weight:650;
    letter-spacing:.02em;text-transform:lowercase;padding:1px 7px;border-radius:99px;
    background:var(--accent-doux);color:var(--accent);vertical-align:.12em;margin:0 2px}
  .vu-doute{color:var(--attention);border-bottom:1.5px dotted var(--attention);cursor:help}
  .vu-schema{display:block;margin:.6em 0;padding:9px 12px;border-left:3px solid var(--accent);
    background:var(--surface-2);border-radius:0 8px 8px 0;font-family:var(--ui);
    font-size:.85em;color:var(--texte-2)}
  .vu-schema b{color:var(--accent);text-transform:uppercase;font-size:.85em;letter-spacing:.05em;
    display:block;margin-bottom:2px}
  .vu-lien{display:inline-block;font-family:var(--ui);font-size:.8em;color:var(--texte-2);
    background:var(--surface-2);padding:1px 8px;border-radius:6px}

  /* plan de rangement */
  .prop{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;margin-bottom:8px;
    background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--r);cursor:pointer}
  .prop:hover{border-color:var(--trait-fort)}
  .prop input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
  .prop span{flex:1;min-width:0}
  .prop b{display:block;font-size:14.5px;font-weight:650}
  .prop em{display:block;font-style:normal;font-size:13px;color:var(--texte-2);margin-top:3px}
  .prop .note{display:block;margin-top:5px;font-size:12.5px}

  /* barre d'outils de saisie */
  .barre-saisie{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .barre-saisie .note{flex:1;min-width:120px}

  .drop{border:1.5px dashed var(--trait-fort);border-radius:16px;padding:30px 20px;text-align:center;
    background:var(--surface-2);transition:border-color .15s,background .15s}
  .drop.hot{border-color:var(--accent);background:var(--accent-doux)}
  .thumbs{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
  .thumb{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;
    border:1px solid var(--trait-fort);background:var(--surface-3)}
  .thumb img{width:100%;height:100%;object-fit:cover}

/* =========================================================
   2. MARKDOWN (rendu minimal, sûr)
   ========================================================= */
function md(src){
  if(!src) return "";
  const lines = String(src).replace(/\r/g,"").split("\n");
  let out = [], i = 0, listType = null;

  const inline = t => esc(t)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (m,txt,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+txt+"</a>")
    // Marques relevées sur une page manuscrite : elles doivent se distinguer
    // du texte du cours, sinon l'information qu'elles portent se perd.
    .replace(/\[(sch[ée]ma|figure|graphique)\s*:\s*([^\]]+)\]/gi,
      (m,quoi,desc)=>'<span class="vu-schema"><b>'+quoi+'</b> '+desc+"</span>")
    .replace(/\[(fl[èe]che\s*:\s*[^\]]+)\]/gi, (m,x)=>'<span class="vu-lien">'+x+"</span>")
    .replace(/\[(encadr[ée]|entour[ée]|soulign[ée]|signal[ée]|surlign[ée][^\]]*|[ée]crit en [^\]]+|marge)\]/gi,
      (m,x)=>'<span class="vu-marque">'+x+"</span>")
    .replace(/\[illisible\]/gi, '<span class="vu-doute">illisible</span>')
    .replace(/(\S+)\[\?\]/g, (m,mot)=>'<span class="vu-doute" title="lecture incertaine">'+mot+"</span>")
    .replace(/\$\$([^$]+)\$\$/g, (m,x)=>"<code>"+x.trim()+"</code>")
    .replace(/\$([^$\n]+)\$/g, (m,x)=>"<code>"+x.trim()+"</code>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/==([^=]+)==/g, "<mark>$1</mark>");

  const closeList = ()=>{ if(listType){ out.push("</"+listType+">"); listType=null; } };

  while(i < lines.length){
    const l = lines[i];

    if(/^```/.test(l)){
      closeList(); const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(l); i += 2;
      let html = '<div class="tablewrap"><table><thead><tr>'+head.map(h=>"<th>"+inline(h)+"</th>").join("")+"</tr></thead><tbody>";
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        html += "<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++;
      }
      out.push(html+"</tbody></table></div>"); continue;
    }
    let m;
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); const n = Math.min(m[1].length+1, 4);
      out.push("<h"+n+">"+inline(m[2])+"</h"+n+">"); i++; continue;
    }
    if(/^\s*([-*_])\s*\1\s*\1[\s-*_]*$/.test(l)){ closeList(); out.push("<hr>"); i++; continue; }
    if((m = l.match(/^\s*>\s?(.*)$/))){ closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); i++; continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)$/))){
      if(listType!=="ul"){ closeList(); out.push("<ul>"); listType="ul"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(listType!=="ol"){ closeList(); out.push("<ol>"); listType="ol"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if(!l.trim()){ closeList(); i++; continue; }
    closeList();
    const buf=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(\s*[-*•\d>#`]|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>"+inline(buf.join(" "))+"</p>");
  }
  closeList();
  return out.join("\n");
}
/* =========================================================
   5. COUCHE IA — deux moteurs, une seule interface
   -----------------------------------------------------
   mode "artifact" : page ouverte depuis Claude → capacité `sample`.
                     Pas d'accès réseau (CSP) ; images selon la vue.
   mode "api"      : page hébergée ou servie en local → appel direct
                     à l'API Anthropic avec la clé de l'étudiant.
                     Vision disponible : l'OCR tourne dans l'outil.
   ========================================================= */
const FOURNISSEURS = {
  anthropic: {
    nom: "Claude (Anthropic)",
    modeleDefaut: "claude-opus-5",
    note: "Qualité de référence. Payant à l'usage, pas de palier gratuit.",
    lienCle: "console.anthropic.com → API Keys"
  },
  gemini: {
    nom: "Gemini (Google)",
    modeleDefaut: "gemini-2.5-flash",
    note: "Palier gratuit disponible. Sur ce palier, Google peut utiliser les contenus envoyés pour améliorer ses services.",
    lienCle: "aistudio.google.com → Get API key"
  }
};

const IA = {
  mode: "off",            // "artifact" | "api" | "off"
  fournisseur: "gemini",  // "anthropic" | "gemini"
  modele: "",
  vision: false,          // l'OCR photo est-il réellement disponible ?
  cles: { anthropic:"", gemini:"" },
  detail: ""
};

const S_FOURN = LS_KEY + "-fournisseur", S_MODELE = LS_KEY + "-modele";
const S_CLE = { anthropic: LS_KEY + "-key", gemini: LS_KEY + "-key-gemini" };

function cleActive(){ return IA.cles[IA.fournisseur] || ""; }

/* Qualité d'envoi des photos : « fine » préserve les traits ténus au prix
   de quelques jetons de plus. Utile sur du crayon pâle ou une écriture serrée. */
const S_QUALITE = LS_KEY + "-qualite-photo";
function qualiteFine(){
  try{ return localStorage.getItem(S_QUALITE) === "fine"; }catch(e){ return false; }
}
function reglerQualite(v){
  try{ localStorage.setItem(S_QUALITE, v); }catch(e){}
}

function chargerConfig(){
  try{
    IA.fournisseur = localStorage.getItem(S_FOURN) || "gemini";
    if(!FOURNISSEURS[IA.fournisseur]) IA.fournisseur = "gemini";
    IA.modele = localStorage.getItem(S_MODELE) || "";
    IA.cles.anthropic = localStorage.getItem(S_CLE.anthropic) || "";
    IA.cles.gemini    = localStorage.getItem(S_CLE.gemini) || "";
  }catch(e){}
  if(!IA.modele) IA.modele = FOURNISSEURS[IA.fournisseur].modeleDefaut;
}

function enregistrerConfig({ fournisseur, cle, modele }){
  try{
    if(fournisseur && FOURNISSEURS[fournisseur]){
      IA.fournisseur = fournisseur;
      localStorage.setItem(S_FOURN, fournisseur);
      if(modele === undefined){ IA.modele = FOURNISSEURS[fournisseur].modeleDefaut; localStorage.setItem(S_MODELE, IA.modele); }
    }
    if(cle !== undefined){
      IA.cles[IA.fournisseur] = (cle||"").trim();
      const k = S_CLE[IA.fournisseur];
      IA.cles[IA.fournisseur] ? localStorage.setItem(k, IA.cles[IA.fournisseur]) : localStorage.removeItem(k);
    }
    if(modele !== undefined && modele){
      IA.modele = modele; localStorage.setItem(S_MODELE, modele);
      reintegrerModele(modele);   // un choix explicite lève une exclusion passée
    }
  }catch(e){}
  majMode();
}

/* La page peut-elle joindre le réseau ? Un artifact publié ne le peut pas. */
const RESEAU_POSSIBLE = !(typeof claude !== "undefined" && claude && claude.use);

function majMode(){
  if(RESEAU_POSSIBLE && cleActive()){
    IA.mode = "api"; IA.vision = true;
    IA.detail = "l'outil parle directement à " + FOURNISSEURS[IA.fournisseur].nom + " ("+IA.modele+") avec ta clé. Tout tourne ici, OCR compris.";
  }else if(aiOn){
    IA.mode = "artifact"; IA.vision = !!imgLim && !imagesKO;
    IA.detail = IA.vision ? "l'assistant de Claude répond et lit les images."
      : "l'assistant de Claude répond, mais cette vue ne lui transmet pas les images. Pour l'OCR, ouvre la version hébergée du fichier avec ta clé API.";
  }else if(RESEAU_POSSIBLE){
    IA.mode = "off"; IA.vision = false;
    IA.detail = "aucune clé API enregistrée. Le classeur fonctionne ; l'IA et l'OCR sont éteints.";
  }else{
    IA.mode = "off"; IA.vision = false;
    IA.detail = "assistant indisponible dans cette vue.";
  }
}

/* ---------- préparation des images ----------
   Sur une page manuscrite, ce sont les traits fins — une accolade, un
   soulignement, la limite d'un surlignage pâle — qui disparaissent en
   premier. On préserve donc la définition et on compresse peu : le coût
   d'un jeton de plus est sans commune mesure avec celui d'une notion
   perdue. Le lissage du navigateur est désactivé pour ne pas noyer les
   traits d'un stylo fin. */
const MAX_COTE_STD  = 2400;   // suffisant pour une page A4 dense
const MAX_COTE_FIN  = 3000;   // écriture serrée, crayon pâle, annotations fines
const QUALITE_STD   = 0.92;
const QUALITE_FINE  = 0.96;

function imageEnBase64(file, opts){
  opts = opts || {};
  const cote = opts.fin ? MAX_COTE_FIN : MAX_COTE_STD;
  const qualite = opts.fin ? QUALITE_FINE : QUALITE_STD;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      // On n'agrandit jamais : une photo déjà petite ne gagne rien à être étirée.
      const ratio = Math.min(1, cote / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width  = Math.max(1, Math.round(img.width  * ratio));
      c.height = Math.max(1, Math.round(img.height * ratio));
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = ratio < 1;
      if(ratio < 1) g.imageSmoothingQuality = "high";
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL("image/jpeg", qualite);
      resolve({ media: "image/jpeg", b64: data.slice(data.indexOf(",")+1) });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("image illisible")); };
    img.src = url;
  });
}

/* =========================================================
   LECTURE D'UNE PAGE MANUSCRITE
   Une page de cours n'est pas du texte : c'est du texte annoté. Ce qui
   est encadré, souligné trois fois ou écrit en rouge porte l'information
   la plus dense de la page — c'est ce que le professeur a jugé décisif.
   Transcrire en oubliant ces marques revient à jeter le tri déjà fait.
   Ces consignes demandent donc de restituer le sens de chaque marque,
   pas seulement les mots.
   ========================================================= */
function consigneVision(contexte){
  return "Tu lis une page de cours d'un étudiant : notes manuscrites, polycopié annoté, "
    + "photo d'un tableau ou d'une diapositive.\n"
    + (contexte ? contexte + "\n" : "")
    + "\nRESTITUE LE TEXTE\n"
    + "Transcris intégralement, sans rien résumer ni réorganiser. Respecte l'ordre de lecture réel : "
    + "colonnes lues l'une après l'autre, encadré traité à l'endroit où il s'insère, note de bas de page à sa place. "
    + "Conserve la numérotation du cours (I, A, 1., a)). Formules en LaTeX entre $…$, tableaux en markdown.\n"
    + "\nRESTITUE LES ANNOTATIONS — c'est le plus important\n"
    + "Une marque manuscrite est un jugement du professeur ou de l'étudiant sur l'importance. Rends-la :\n"
    + "- surligné → ==texte surligné== ; précise la couleur si plusieurs sont utilisées : ==texte== [surligné en jaune]\n"
    + "- encadré, entouré, souligné plusieurs fois, précédé d'une étoile ou d'une flèche → **texte** suivi de "
    + "[encadré], [entouré], [souligné], [signalé] selon le cas\n"
    + "- écrit dans une couleur différente du corps du texte → **texte** [écrit en rouge]\n"
    + "- ajout dans la marge, entre les lignes, ou d'une autre main → sur sa propre ligne, en citation : "
    + "> [marge] contenu de l'annotation\n"
    + "- flèche reliant deux éléments → une phrase explicite : [flèche : « intérêts » renvoie à « charges financières »]\n"
    + "- « à savoir », « tombe à l'examen », « attention », « ex. » → conserve ces mentions telles quelles, elles sont capitales\n"
    + "\nSCHÉMAS ET DESSINS\n"
    + "Décris chaque schéma entre crochets, en une à trois phrases, en nommant les éléments et leurs relations : "
    + "[schéma : un axe horizontal du temps, cinq annuités décroissantes, la valeur résiduelle en pointillés à droite]. "
    + "Transcris tout texte figurant dans le schéma.\n"
    + "\nHONNÊTETÉ\n"
    + "N'invente jamais un mot pour combler un trou. Un mot douteux s'écrit mot[?], un passage illisible [illisible]. "
    + "Un mot rendu incertain par l'écriture vaut mieux qu'un mot inventé qui sera révisé comme vrai.\n"
    + "\nRENDU\n"
    + "Réponds uniquement par le contenu de la page en markdown, prêt à s'insérer dans un cours. "
    + "Aucune introduction, aucun commentaire, aucune conclusion de ta part.";
}

/* ---------- découverte des modèles : ne jamais dépendre d'un nom figé ---------- */
async function listerModeles(cle){
  cle = cle || cleActive();
  if(IA.fournisseur === "gemini"){
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models", { headers:{ "x-goog-api-key": cle } });
    if(!r.ok){
      let msg = ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
      throw Object.assign(new Error(msg || ("HTTP "+r.status)),
        { code: (r.status===403||r.status===400) ? "cle_invalide" : "api_error" });
    }
    const j = await r.json();
    return (j.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).indexOf("generateContent") >= 0)
      .map(m=>String(m.name).replace(/^models\//,""));
  }
  const r = await fetch("https://api.anthropic.com/v1/models?limit=100", {
    headers:{ "x-api-key": cle, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" } });
  if(!r.ok) throw Object.assign(new Error("HTTP "+r.status), { code: r.status===401?"cle_invalide":"api_error" });
  const j = await r.json();
  return (j.data||[]).map(m=>m.id);
}

/* Modèles écartés parce qu'ils ont réellement échoué à l'usage — le catalogue
   d'un fournisseur annonce parfois des modèles qui refusent ensuite l'appel. */
const S_EXCLUS = LS_KEY + "-modeles-exclus";
function lireExclus(){
  try{ return new Set(JSON.parse(localStorage.getItem(S_EXCLUS) || "[]")); }catch(e){ return new Set(); }
}
function exclureModele(n){
  if(!n) return;
  const s = lireExclus(); s.add(n);
  try{ localStorage.setItem(S_EXCLUS, JSON.stringify([...s])); }catch(e){}
}
function reintegrerModele(n){
  const s = lireExclus(); if(!s.delete(n)) return;
  try{ localStorage.setItem(S_EXCLUS, JSON.stringify([...s])); }catch(e){}
}

/* Classe les modèles disponibles : rapide, multimodal, récent — en écartant
   ceux qui se sont déjà montrés inutilisables. Renvoie la liste ordonnée. */
function classerModeles(noms){
  const exclus = lireExclus();
  // « deep-research » et consorts sont des modèles à API dédiée : ils figurent au
  // catalogue mais refusent l'appel standard. Écartés d'emblée.
  const horsSujet = /embed|aqa|imagen|veo|tts|audio|live|-image|gemma|deep-research|robotics|computer-use|guard/i;
  const utiles = (noms||[]).filter(n=>!horsSujet.test(n) && !exclus.has(n));
  if(!utiles.length) return [];
  // « gemini-3-flash » → 3 ; « gemini-2.5-flash » → 2.5 ; « claude-opus-4-8 » → 4.8
  // Les suffixes de date (« -12-2025 ») sont retirés avant lecture : sans ça un
  // modèle daté passait pour une version 12 et raflait la première place.
  const version = n=>{
    const sansDate = n.replace(/[-_](?:0?[1-9]|1[0-2])[-_]20\d\d\b/g, "").replace(/[-_]20\d{2,6}\b/g, "");
    const m = sansDate.match(/(\d+)(?:[.\-](\d+))?/);
    if(!m) return 0;
    const maj = parseInt(m[1], 10);
    if(maj > 30) return 0;                                  // encore une date déguisée
    const min = (m[2] && m[2].length <= 2) ? m[2] : "0";
    return parseFloat(maj + "." + min);
  };
  const score = n=>{
    let s = version(n) * 10;
    if(/flash/i.test(n)) s += 30;          // rapide et économique : idéal pour l'OCR au quotidien
    else if(/sonnet|pro/i.test(n)) s += 20;
    if(/opus/i.test(n)) s += 25;
    if(/lite/i.test(n)) s -= 15;
    if(/preview|exp|latest/i.test(n)) s -= 5;   // on préfère les versions stables
    return s;
  };
  return utiles.slice().sort((a,b)=>score(b)-score(a));
}
function choisirModele(noms){ return classerModeles(noms)[0] || ""; }

/* Réparation quand le modèle enregistré n'existe pas, ou refuse cette API :
   on écarte le fautif et on prend le suivant du classement. */
async function reparerModele(){
  try{
    exclureModele(IA.modele);
    const choix = choisirModele(await listerModeles());
    if(!choix || choix === IA.modele) return false;
    enregistrerConfig({ modele: choix });
    return true;
  }catch(e){ return false; }
}

/* Rapport de diagnostic partageable. Ne contient jamais la clé : seulement
   sa longueur, pour distinguer « absente » de « tronquée à la copie ». */
async function diagnostic(progres){
  const L = [], dire = t=>{ L.push(t); if(progres) progres(L.join("\n")); };
  const cle = cleActive();

  dire("=== Diagnostic — Cahier BBA ===");
  dire("Fournisseur : " + FOURNISSEURS[IA.fournisseur].nom);
  dire("Clé : " + (cle ? "présente, " + cle.length + " caractères" : "ABSENTE"));
  dire("Modèle enregistré : " + (IA.modele || "aucun"));
  const ex = [...lireExclus()];
  dire("Modèles déjà écartés : " + (ex.length ? ex.join(", ") : "aucun"));
  dire("");

  if(!cle){ dire("→ Rien à tester sans clé."); return L.join("\n"); }

  let noms = [];
  try{
    noms = await listerModeles();
    dire("Catalogue : " + noms.length + " modèle(s) annoncés compatibles.");
  }catch(e){
    dire("Catalogue : ÉCHEC — " + (e.message || e.code));
    dire("");
    dire("→ La clé est refusée avant même le choix d'un modèle.");
    return L.join("\n");
  }

  const candidats = classerModeles(noms).slice(0, 6);
  dire("Essais réels (le catalogue ne suffit pas) :");
  let bon = "";
  for(const n of candidats){
    const avant = IA.modele;
    IA.modele = n;
    try{
      // Budget large : les modèles qui réfléchissent avant d'écrire épuisent un
      // petit quota en réflexion et rendraient une réponse vide à tort.
      await appelAPI({ messages:[{ role:"user", content:"Réponds exactement : OK" }], maxTokens:1024, effort:"low" }, true);
      dire("  [OK] " + n + " — répond");
      if(!bon) bon = n;
    }catch(e){
      dire("  [X] " + n + " — " + (e.message || e.code));
    }
    IA.modele = avant;
  }
  dire("");

  if(!bon){ dire("→ Aucun modèle ne répond avec cette clé."); return L.join("\n"); }

  const avant = IA.modele;
  IA.modele = bon;
  try{
    const c = document.createElement("canvas");
    c.width = 420; c.height = 140;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
    g.fillStyle = "#000"; g.font = "bold 64px Georgia, serif";
    g.fillText("ESSEC 2026", 20, 92);
    const d = c.toDataURL("image/jpeg", 0.9);
    const t = await appelAPI({
      messages:[{ role:"user", content:"Quel texte est écrit sur cette image ? Réponds uniquement par ce texte." }],
      images:[{ media:"image/jpeg", b64: d.slice(d.indexOf(",")+1) }],
      maxTokens:200, effort:"low"
    }, true);
    dire(/ESSEC/i.test(t) ? "Lecture d'image : [OK] réussie (« " + t.trim().slice(0,40) + " »)"
                          : "Lecture d'image : réponse inattendue — « " + t.trim().slice(0,80) + " »");
    dire("");
    dire("→ Modèle opérationnel : " + bon);
    enregistrerConfig({ modele: bon });
  }catch(e){
    dire("Lecture d'image : ÉCHEC — " + (e.message || e.code));
    dire("");
    dire("→ Le texte fonctionne, mais pas les images sur ce modèle.");
    IA.modele = avant;
  }
  return L.join("\n");
}

/* Page d'épreuve : une note annotée fabriquée de toutes pièces, dont on
   connaît le contenu exact. Elle sert à mesurer ce que le modèle rend
   vraiment des surlignages, des entourages et de la couleur — plutôt que
   de l'espérer. */
function pageEpreuve(){
  const c = document.createElement("canvas");
  c.width = 1000; c.height = 700;
  const g = c.getContext("2d");
  g.fillStyle = "#fffdf5"; g.fillRect(0,0,c.width,c.height);

  // lignes de cahier
  g.strokeStyle = "#dfe6ef"; g.lineWidth = 1;
  for(let y=90; y<c.height; y+=42){ g.beginPath(); g.moveTo(60,y); g.lineTo(960,y); g.stroke(); }
  g.strokeStyle = "#f0c3c3"; g.beginPath(); g.moveTo(120,20); g.lineTo(120,680); g.stroke();

  const plume = "600 30px 'Bradley Hand','Segoe Script','Comic Sans MS',cursive";
  g.font = plume; g.fillStyle = "#1b2a4a";

  g.fillText("Chapitre 2 - Les amortissements", 140, 80);

  // surlignage jaune derrière une notion
  g.fillStyle = "rgba(255,232,64,.75)";
  g.fillRect(138, 108, 372, 34);
  g.fillStyle = "#1b2a4a"; g.font = plume;
  g.fillText("La base amortissable", 140, 134);
  g.fillText("est la valeur d'origine moins", 520, 134);
  g.fillText("la valeur residuelle estimee.", 140, 176);

  // mot entoure en rouge
  g.fillStyle = "#c0392b";
  g.fillText("annuite", 140, 260);
  g.strokeStyle = "#c0392b"; g.lineWidth = 3.5;
  g.beginPath(); g.ellipse(212, 250, 92, 30, 0, 0, Math.PI*2); g.stroke();

  g.fillStyle = "#1b2a4a";
  g.fillText("= base / duree d'usage", 330, 260);

  // note de marge, autre couleur
  g.fillStyle = "#1d7a4c"; g.font = "600 23px 'Bradley Hand','Segoe Script',cursive";
  g.fillText("tombe a l'examen !", 620, 320);
  g.strokeStyle = "#1d7a4c"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(610, 310); g.lineTo(500, 268); g.stroke();

  // souligne trois fois
  g.fillStyle = "#1b2a4a"; g.font = plume;
  g.fillText("methode lineaire", 140, 400);
  g.strokeStyle = "#1b2a4a"; g.lineWidth = 2;
  [410, 417, 424].forEach(y=>{ g.beginPath(); g.moveTo(140,y); g.lineTo(400,y); g.stroke(); });

  // petit schema
  g.strokeStyle = "#1b2a4a"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(160, 620); g.lineTo(820, 620); g.stroke();
  g.beginPath(); g.moveTo(820, 620); g.lineTo(806, 612); g.lineTo(806, 628); g.fill();
  for(let k=0;k<5;k++){
    const x = 200 + k*120, h = 130 - k*20;
    g.strokeRect(x, 620-h, 70, h);
  }
  g.font = "500 20px 'Bradley Hand',cursive";
  g.fillText("t", 830, 626);
  g.fillText("annuites decroissantes", 300, 665);

  return c;
}

async function epreuveVision(progres){
  const c = pageEpreuve();
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.96));
  const texte = await iaTexte({
    system: NIVEAU,
    messages: [{ role:"user", content: consigneVision("Page de test.") }],
    images: [blob], fin: true, effort: "medium", maxTokens: 4000,
    onText: progres
  });

  const t = texte.toLowerCase();
  const criteres = [
    { nom:"texte manuscrit lu",        ok: /base amortissable/.test(t) && /valeur r[ée]siduelle/.test(t) },
    { nom:"surlignage signalé",        ok: /==/.test(texte) || /surlign/.test(t) },
    { nom:"mot entouré repéré",        ok: /entour|encadr|cercl/.test(t) },
    { nom:"couleur restituée",         ok: /rouge|vert/.test(t) },
    { nom:"note de marge captée",      ok: /examen/.test(t) },
    { nom:"soulignement relevé",       ok: /soulign/.test(t) },
    { nom:"schéma décrit",             ok: /sch[ée]ma|figure|barres|annuit[ée]s/.test(t) }
  ];
  return { texte, criteres, reussis: criteres.filter(x=>x.ok).length };
}

/* Vérifie par l'usage qu'un modèle répond vraiment — le catalogue ne suffit pas. */
async function validerModele(nom){
  const avant = IA.modele;
  IA.modele = nom;
  try{
    await appelAPI({ messages:[{ role:"user", content:"Réponds exactement : OK" }], maxTokens: 1024, effort:"low" }, true);
    return true;
  }catch(e){
    // Refus franc de l'API : le modèle est inutilisable, on le retient.
    if(e && (e.code === "modele_inconnu" || e.code === "invalid_request")){ exclureModele(nom); return false; }
    // Réponse vide : signal trop faible pour condamner un modèle définitivement —
    // on passe au suivant sans l'écarter pour toujours.
    if(e && e.code === "empty_completion"){ IA.modele = avant; return false; }
    IA.modele = avant; throw e;   // clé invalide, quota… : ce n'est pas le modèle
  }
}

/* ---------- Gemini : conversion du schéma JSON vers le format Google ---------- */
function versSchemaGemini(s){
  if(!s || typeof s !== "object") return s;
  const g = {};
  if(s.type) g.type = String(s.type).toUpperCase();
  if(s.description) g.description = s.description;
  if(s.enum) g.enum = s.enum;
  if(s.items) g.items = versSchemaGemini(s.items);
  if(s.properties){
    g.properties = {};
    for(const k of Object.keys(s.properties)) g.properties[k] = versSchemaGemini(s.properties[k]);
    g.propertyOrdering = Object.keys(s.properties);
  }
  if(s.required) g.required = s.required;
  return g;   // `additionalProperties` n'existe pas côté Gemini : volontairement omis
}

/* ---------- appel Gemini, en flux ---------- */
async function appelGemini(o, essais){
  essais = essais || 0;
  try{
    return await appelGeminiBrut(o);
  }catch(brut){
    const e = normErreur(brut);
    if(e && e.code === "pensee_obligatoire" && !o.sansPensee){
      return appelGemini({ ...o, sansPensee:true }, essais);
    }
    if(e && e.code === "modele_inconnu" && essais < 4 && await reparerModele()){
      return appelGemini(o, essais + 1);
    }
    throw e;
  }
}

async function appelGeminiBrut({ system, messages, images, maxTokens, schema, onText, signal, recherche, sources, effort, sansPensee }){
  const parts = [];
  for(const im of (images||[])) parts.push({ inline_data:{ mime_type: im.media, data: im.b64 } });

  const contents = messages.map((m, i)=>{
    const p = [{ text: m.content }];
    // les images accompagnent le dernier tour utilisateur
    if(i === messages.length - 1 && parts.length) return { role:"user", parts: parts.concat(p) };
    return { role: m.role === "assistant" ? "model" : "user", parts: p };
  });

  const body = {
    contents,
    generationConfig: { maxOutputTokens: maxTokens || 8192 }
  };
  // Les modèles Gemini récents réfléchissent avant d'écrire, et cette phase
  // est invisible : l'écran reste vide longtemps. Pour une extraction, elle
  // n'apporte rien — on la coupe et la réponse arrive tout de suite.
  if(effort === "low" && !sansPensee) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  if(system) body.systemInstruction = { parts:[{ text: system }] };
  // La recherche web et le schéma JSON s'excluent chez Google : quand on
  // veut des sources, on accepte du texte libre et on cite en fin de réponse.
  if(recherche) body.tools = [{ google_search: {} }];
  else if(schema){
    body.generationConfig.responseMimeType = "application/json";
    body.generationConfig.responseSchema = versSchemaGemini(schema);
  }

  const url = "https://generativelanguage.googleapis.com/v1beta/models/"
            + encodeURIComponent(IA.modele) + ":streamGenerateContent?alt=sse";

  const res = await fetch(url, {
    method:"POST", signal,
    headers:{ "content-type":"application/json", "x-goog-api-key": cleActive() },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    if(/denied access|CONSUMER_INVALID|PERMISSION_DENIED/i.test(msg))
      msg += " — le compte Google lui-même est bloqué, pas la clé. Causes habituelles : compte scolaire ou professionnel dont l'administrateur interdit AI Studio, "
           + "ou compte personnel sans date de naissance renseignée / déclaré mineur. Réessaie avec un compte Gmail personnel majeur, "
           + "ou bascule sur Claude ci-dessus.";
    else if(/API key not valid|API_KEY_INVALID/i.test(msg)) msg += " — clé mal copiée, ou copiée en partie.";
    else if(/has not been used|is disabled|SERVICE_DISABLED/i.test(msg)) msg += " — l'API Generative Language n'est pas activée sur ce projet Google.";
    else if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(msg)) msg += " — la clé est restreinte à certains sites ; retire la restriction, ou autorise wyngo-create.github.io.";
    const err = new Error(msg || ("HTTP "+res.status));
    // « only supports Interactions API », « not supported for generateContent » :
    // le catalogue annonce le modèle, mais il refuse cette API. C'est un problème
    // de modèle, pas de clé — on l'écarte et on prend le suivant.
    // Refus portant sur l'outil de recherche, pas sur le modèle : on le
    // distingue pour pouvoir réessayer sans ancrage au lieu d'abandonner.
    if(recherche && /tool|google_?search|grounding|function/i.test(msg)){
      const e2 = new Error(msg || ("HTTP "+res.status));
      e2.code = "recherche_refusee"; throw e2;
    }
    // Certains modèles refusent qu'on coupe leur réflexion : on la rétablit.
    if(!sansPensee && /thinking|thought|budget/i.test(msg)){
      const e2 = new Error(msg || ("HTTP "+res.status));
      e2.code = "pensee_obligatoire"; throw e2;
    }
    const modeleRefuse = /only supports|not supported for|is not supported|does not support/i.test(msg);
    err.code = res.status === 404 || modeleRefuse ? "modele_inconnu"
             : res.status === 400 && /API key/i.test(msg) ? "cle_invalide"
             : res.status === 403 ? "cle_invalide"
             : res.status === 429 ? "rate_limited"
             : res.status >= 500 ? "upstream_error" : "api_error";
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", fin = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut) continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      const cand = ev.candidates && ev.candidates[0];
      if(!cand) continue;
      if(cand.finishReason) fin = cand.finishReason;
      const ps = (cand.content && cand.content.parts) || [];
      for(const p of ps) if(typeof p.text === "string"){ texte += p.text; if(onText) onText(texte); }
      // Sources d'ancrage : ce qui rend la réponse contrôlable.
      const gm = cand.groundingMetadata;
      if(sources && gm && gm.groundingChunks){
        for(const g of gm.groundingChunks){
          const w = g && g.web;
          if(w && w.uri && !sources.some(s=>s.url === w.uri)) sources.push({ url:w.uri, titre:w.title || w.uri });
        }
      }
    }
  }

  if(fin === "SAFETY" || fin === "PROHIBITED_CONTENT"){ const e=new Error("refus"); e.code="refused"; throw e; }
  if(!texte.trim()){ const e=new Error("réponse vide"); e.code="empty_completion"; throw e; }
  if(fin === "MAX_TOKENS") texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]";
  return texte;
}

/* ---------- appel Anthropic, en flux ---------- */
/* `sansReparation` : utilisé par validerModele(), qui teste un modèle précis et
   doit voir l'échec brut — sinon la réparation automatique basculerait sur un
   autre modèle et la validation croirait avoir réussi. */
async function appelAPI(o, sansReparation){
  if(IA.fournisseur === "gemini") return appelGemini(o, sansReparation ? 99 : 0);
  // La recherche web n'est pas encore câblée côté Anthropic : on génère sans
  // ancrage plutôt que d'échouer, et l'interface le dit franchement.
  if(o && o.recherche) o = { ...o, recherche:false };
  try{
    return await appelAnthropic(o);
  }catch(brut){
    const e = normErreur(brut);
    if(e && e.code === "modele_inconnu" && !sansReparation && await reparerModele()){
      return appelAPI(o, true);
    }
    throw e;
  }
}

async function appelAnthropic({ system, messages, images, effort, maxTokens, schema, onText, signal }){
  const contenu = [];
  for(const im of (images||[])) contenu.push({ type:"image", source:{ type:"base64", media_type: im.media, data: im.b64 } });

  const msgs = messages.map(m=>({ role:m.role, content:m.content }));
  if(contenu.length){
    const dernier = msgs[msgs.length-1];
    dernier.content = contenu.concat([{ type:"text", text: dernier.content }]);
  }

  const body = {
    model: IA.modele,
    max_tokens: maxTokens || 16000,
    stream: true,
    messages: msgs,
    output_config: { effort: effort || "medium" }
  };
  if(system) body.system = system;
  if(schema) body.output_config.format = { type:"json_schema", schema };

  const res = await fetch(API_URL, {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cleActive(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    const err = new Error(detail || ("HTTP " + res.status));
    err.code = res.status === 401 ? "cle_invalide"
             : res.status === 404 ? "modele_inconnu"
             : res.status === 429 ? "rate_limited"
             : res.status === 400 && /model/i.test(detail) ? "modele_inconnu"
             : res.status === 400 ? "invalid_request"
             : res.status >= 500 ? "upstream_error" : "api_error";
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", stop = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut || brut === "[DONE]") continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
        texte += ev.delta.text;
        if(onText) onText(texte);
      }else if(ev.type === "message_delta" && ev.delta && ev.delta.stop_reason){
        stop = ev.delta.stop_reason;
      }else if(ev.type === "error"){
        const err = new Error((ev.error && ev.error.message) || "erreur de flux");
        err.code = "upstream_error"; throw err;
      }
    }
  }

  if(stop === "refusal"){ const e = new Error("refus"); e.code = "refused"; throw e; }
  if(!texte.trim()){ const e = new Error("réponse vide"); e.code = "empty_completion"; throw e; }
  if(stop === "max_tokens"){ texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]"; }
  return texte;
}

/* ---------- travail long : délai, annulation, compteur ----------
   Sans délai maximum, une connexion qui reste ouverte sans rien renvoyer
   fige l'écran indéfiniment. On borne, on montre le temps écoulé, et on
   laisse toujours une porte de sortie. */
function chantier(cible, libelle, opts){
  opts = opts || {};
  const ctl = new AbortController(), t0 = Date.now();
  const peindre = ()=>{
    if(!cible || !cible.isConnected) return;
    const s = Math.round((Date.now() - t0) / 1000);
    cible.innerHTML = '<span class="thinking"><i></i>' + esc(libelle) + " — " + s + " s</span> "
      + '<button class="btn sm fantome" data-stop="1">Annuler</button>'
      + (s >= 20 ? '<p class="note" style="margin-top:8px">Le modèle réfléchit avant d\'écrire : '
          + "rien ne s'affiche tant qu'il n'a pas commencé. C'est normal jusqu'à une minute environ.</p>" : "");
    const b = cible.querySelector("[data-stop]");
    if(b) b.onclick = ()=>ctl.abort();
  };
  peindre();
  const battement = setInterval(peindre, 1000);
  const limite = setTimeout(()=>ctl.abort(), opts.delai || 120000);
  return { signal: ctl.signal, fini(){ clearInterval(battement); clearTimeout(limite); } };
}

/* Une interruption ou une coupure réseau doivent se lire comme telles. */
function normErreur(e){
  if(e && (e.name === "AbortError" || e.code === 20)){
    const x = new Error("interrompu ou temps d'attente dépassé"); x.code = "delai_depasse"; return x;
  }
  if(e instanceof TypeError && /fetch|network|load failed|réseau/i.test(e.message || "")){
    const x = new Error("connexion au fournisseur impossible"); x.code = "reseau"; return x;
  }
  return e;
}

/* ---------- reprises sur incident passager ----------
   Une saturation du fournisseur est temporaire : on réessaie tout seul,
   en espaçant, puis on bascule sur le modèle suivant du classement.
   Le modèle saturé n'est jamais mis à l'écart : il refonctionnera. */
const dodo = ms => new Promise(r=>setTimeout(r, ms));
const estPassager = c => c === "upstream_error" || c === "rate_limited";

async function avecReprises(faire){
  const attentes = [0, 2000, 5000];
  let derniere;
  for(let i = 0; i < attentes.length; i++){
    if(attentes[i]){
      toast("Service saturé — nouvelle tentative dans " + (attentes[i]/1000) + " s", attentes[i]);
      await dodo(attentes[i]);
    }
    try{ return await faire(); }
    catch(brut){
      const e = normErreur(brut);
      derniere = e;
      if(!estPassager(e && e.code)) throw e;   // une annulation ne se réessaie jamais
    }
  }
  // Toujours saturé : un autre modèle est peut-être disponible.
  try{
    const suivant = classerModeles(await listerModeles()).find(n => n !== IA.modele);
    if(suivant){
      const avant = IA.modele;
      toast("Bascule sur " + suivant, 3000);
      enregistrerConfig({ modele: suivant });
      try{ return await faire(); }
      catch(e2){ enregistrerConfig({ modele: avant }); }
    }
  }catch(e3){ /* on retombe sur l'erreur d'origine, plus parlante */ }
  throw derniere;
}

/* ---------- interface unique utilisée par tout le reste de l'app ---------- */
/* Les deux moteurs exigent que l'échange commence par un tour "user". */
function normaliser(messages){
  const m = (messages||[]).slice();
  while(m.length && m[0].role !== "user") m.shift();
  return m.length ? m : [{ role:"user", content:"(pas de message)" }];
}

async function iaTexte(opts){
  const { system, images, effort, maxTokens, onText, recherche, sources, signal } = opts;
  const messages = normaliser(opts.messages);
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (images||[])) imgs.push(await imageEnBase64(f, { fin: opts.fin || qualiteFine() }));
    return avecReprises(()=>appelAPI({ system, messages, images:imgs, effort, maxTokens, onText, recherche, sources, signal }));
  }
  if(IA.mode === "artifact"){
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : (effort === "high" ? "complex" : "default"), cache:false };
    if(images && images.length) o.images = images;
    if(onText) o.onText = ({text})=>onText(text);
    const r = await sample(entree, o);
    return r.text;
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

async function iaJson(opts){
  opts = { ...opts, messages: normaliser(opts.messages) };
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (opts.images||[])) imgs.push(await imageEnBase64(f, { fin: opts.fin || qualiteFine() }));
    const t = await avecReprises(()=>appelAPI({ ...opts, images:imgs }));
    try{ return JSON.parse(t); }
    catch(e){
      const m = t.match(/[\{\[][\s\S]*[\}\]]/);
      if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
      const err = new Error("JSON illisible"); err.code = "invalid_json"; err.text = t; throw err;
    }
  }
  if(IA.mode === "artifact"){
    const { system, messages, images, effort } = opts;
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : "complex", cache:false };
    if(images && images.length) o.images = images;
    return sample.json(entree, o);
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

  const its = itemsOf(c.id), m = matById(c.matiereId);

  const budget = maxChars || 26000, per = Math.max(1200, Math.floor(budget / Math.max(1,its.length)));

function msgErreur(e){
  const c = e && e.code;
  if(c==="cle_invalide") return "Clé refusée par " + FOURNISSEURS[IA.fournisseur].nom
    + (e.message ? ". Réponse exacte du fournisseur : « " + e.message + " »" : ".");
  if(c==="modele_inconnu") return "Aucun modèle utilisable trouvé pour cette clé. Vérifie qu'elle est bien active sur " + FOURNISSEURS[IA.fournisseur].lienCle + ".";
  if(c==="api_error") return "L'API a refusé la requête" + (e.message ? " : "+e.message : ".");
  if(c==="not_granted" || c==="sampling_disabled") return "L'assistant n'est pas configuré — voir ⚙ Réglages.";
  if(c==="rate_limited") return "Trop de demandes d'affilée — réessaie dans quelques minutes.";
  if(c==="prompt_too_large") return "Le chapitre est trop long à envoyer d'un coup. Analyse-le en deux chapitres.";
  if(c==="invalid_json") return "Réponse mal formée. Relance l'analyse.";
  if(c==="image_rejected") return "Image refusée : format non supporté ou fichier trop lourd.";
  if(c==="images_unavailable") return "Cette vue ne peut pas envoyer d'images. Ouvre le classeur depuis l'application Claude, ou colle le texte dans « Écrire un cours ».";
  if(c==="session_expired") return "Session expirée — reconnecte-toi puis réessaie.";
  if(c==="cancelled") return "Interrompu.";
  if(c==="delai_depasse") return "Interrompu — soit par toi, soit après deux minutes sans réponse. "
    + "Si ça se reproduit, essaie avec un texte plus court, ou change de modèle dans les réglages.";
  if(c==="reseau") return "Connexion impossible. Vérifie ta liaison internet, puis réessaie.";
  if(c==="upstream_error") return "Le service a échoué en cours de réponse"
    + (e.message ? " : « "+e.message+" »" : ". Réessaie dans un instant.");
  // Jamais de message muet : si le fournisseur a dit quelque chose, on le montre.
  return "L'assistant n'a pas pu répondre"
    + (e && e.message ? " — réponse du fournisseur : « " + e.message + " »" : ". Réessaie.")
    + (c ? " (code : " + c + ")" : "");
}
function iaError(e){ toast(msgErreur(e), 4200); }
let modalSticky = false;
function modal(html, opts){
  const host = $("#modalHost");
  modalSticky = !!(opts && opts.sticky);
  host.innerHTML = '<div class="scrim"><div class="modal'+((opts&&opts.wide)?" wide":"")+'" role="dialog" aria-modal="true">'+html+"</div></div>";
  const scrim = host.querySelector(".scrim");
  scrim.addEventListener("mousedown", e=>{ if(e.target===scrim && !modalSticky) closeModal(); });
  document.addEventListener("keydown", escClose);
  return host.querySelector(".modal");
}
function escClose(e){
  if(e.key!=="Escape") return;
  if(modalSticky && !confirm("Fermer sans enregistrer ?")) return;
  closeModal();
}
function closeModal(){ modalSticky=false; $("#modalHost").innerHTML=""; document.removeEventListener("keydown", escClose); }

  $(it ? "#eB" : "#eTi").focus();

  /* ----- insertion d'une photo au fil de la frappe -----
     La retranscription se range à l'endroit du curseur, et les photos
     multiples s'enchaînent dans l'ordre choisi : c'est ce qui fait la
     différence entre un cours suivi et des bouts de texte jetés. */
  $("#ePhoto").onclick = ()=>{

    if(!IA.vision){ toast("La lecture des photos n'est pas active — voir Réglages.", 4000); return; }

  $("#ePhotoIn").onchange = async ()=>{

    const ta = $("#eB"), btn = $("#ePhoto"), etat = $("#ePhotoEtat");
    btn.disabled = true;

    // Le point d'insertion est figé maintenant : le curseur ne doit pas
    // sauter si l'étudiant clique ailleurs pendant la lecture.
    let pos = ta.selectionStart != null ? ta.selectionStart : ta.value.length;

    for(let i = 0; i < photos.length; i++){
      const ch = chantier(etat, "Photo " + (i+1) + "/" + photos.length, { delai: 120000 });
      try{
        // La fin de ce qui précède est transmise : elle permet de reconnaître
        // une phrase coupée en bas de page et de reprendre le fil sans doublon.
        const amont = ta.value.slice(Math.max(0, pos - 700), pos).trim();
        const texte = await iaTexte({
          system: NIVEAU,
          messages: [{ role:"user", content: consigneVision(
            (photos.length > 1 ? "Page " + (i+1) + " sur " + photos.length + " d'une même prise de notes." : "")
            + (amont ? "\n\nFin du texte déjà saisi, juste avant cette page — enchaîne sans le répéter :\n« …"
                + amont.slice(-400) + " »" : "")) }],
          images: [photos[i]], fin: true, effort: "medium", maxTokens: 8000, signal: ch.signal
        });
        ch.fini();

        const propre = String(texte).trim();
        if(!propre) continue;

        const avant = ta.value.slice(0, pos), apres = ta.value.slice(pos);
        const sep1 = avant && !avant.endsWith("\n\n") ? (avant.endsWith("\n") ? "\n" : "\n\n") : "";
        const sep2 = apres && !apres.startsWith("\n") ? "\n\n" : "";
        const morceau = sep1 + propre + sep2;

        ta.value = avant + morceau + apres;
        pos += morceau.length;                 // la photo suivante se pose après celle-ci
        ta.selectionStart = ta.selectionEnd = pos;
        ta.focus();
        ta.scrollTop = ta.scrollHeight;
      }catch(e){
        ch.fini();
        etat.innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>";
        btn.disabled = false;
        return;
      }
    }

    etat.textContent = photos.length > 1
      ? photos.length + " photos insérées dans l'ordre"
      : "Photo insérée";
    btn.disabled = false;
  };

  $("#eClean").onclick = async ()=>{

    if(!brut){ toast("Écris d'abord quelque chose"); return; }

          + brut.slice(0,26000) }],
        effort: "medium", maxTokens: 16000

      if(!$("#eTi").value.trim()){
        const h = texte.split("\n").find(l=>/^#{1,3}\s/.test(l));
        if(h) $("#eTi").value = h.replace(/^#+\s*/,"").trim();

      const nc = { id:uid(), matiereId:selM.value, titre:t, numero:num, statut:"encours", note:"" };
      state.chapitres.push(nc); chapId = nc.id; await saveStructure();
    }

      || (TYPES[type] + " — " + maintenant.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" })
          + " à " + maintenant.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }));
    if(it){

      it.maj = maintenant.toISOString();

  };

/* =========================================================
   LECTURE DES PDF
   Un poly de cours porte presque toujours une couche de texte : on
   l'extrait, c'est instantané, gratuit et fidèle au caractère près.
   La lecture d'image, coûteuse, est réservée aux pages réellement
   scannées — celles où l'extraction ne rend rien.
   ========================================================= */
const PDFJS_VERSION = "3.11.174";
const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/";
let pdfjsPromesse = null;

function chargerPDFJS(){
  if(pdfjsPromesse) return pdfjsPromesse;
  pdfjsPromesse = new Promise((ok, ko)=>{
    if(window.pdfjsLib){ ok(window.pdfjsLib); return; }
    const s = document.createElement("script");
    s.src = PDFJS_BASE + "pdf.min.js";
    s.onload = ()=>{
      if(!window.pdfjsLib){ ko(Object.assign(new Error("bibliothèque PDF illisible"), {code:"pdf_indispo"})); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
      ok(window.pdfjsLib);
    };
    s.onerror = ()=>{
      pdfjsPromesse = null;
      ko(Object.assign(new Error("lecteur PDF inaccessible — vérifie ta connexion"), {code:"pdf_indispo"}));
    };
    document.head.appendChild(s);
  });
  return pdfjsPromesse;
}

/* Une page dont l'extraction rend moins de 40 caractères utiles est
   considérée comme scannée : c'est le seuil qui sépare un poly numérique
   d'une photocopie. */
const SEUIL_PAGE_VIDE = 40;
/* Chaque page lue en image est un appel au modèle : on borne pour qu'un poly
   de deux cents pages ne se transforme pas en facture surprise. */
const PLAFOND_PAGES_IMAGE = 40;

/* Une page peut porter du texte ET des annotations manuscrites : un poly
   imprimé qu'on a surligné et entouré. L'extraction de texte seule les
   perd toutes. On repère donc ces pages par deux voies complémentaires. */
const SOUS_TYPES_ANNOTATION = ["Ink","Highlight","Square","Circle","FreeText",
  "Underline","StrikeOut","Squiggly","Polygon","PolyLine","Stamp","Text","Caret"];

/* Voie 1 — annotations déclarées : un PDF annoté dans un lecteur ou sur
   tablette porte des objets d'annotation que pdf.js sait énumérer. */
async function annotationsDeclarees(page){
  try{
    const a = await page.getAnnotations({ intent:"display" });
    return (a||[]).filter(x=>SOUS_TYPES_ANNOTATION.indexOf(x.subtype) >= 0).length;
  }catch(e){ return 0; }
}

/* Voie 2 — encre aplatie : une fois le trait fondu dans l'image de la page,
   aucun objet ne subsiste. Mais un poly imprimé est quasi gris, alors qu'un
   stylo ou un surligneur est très saturé. On compte donc les pixels colorés
   sur un rendu minuscule : quelques millisecondes, aucun appel réseau. */
const SEUIL_COULEUR = 0.004;   // 0,4 % de pixels colorés suffit à trahir un trait

async function tauxCouleur(page){
  try{
    const vp0 = page.getViewport({ scale: 1 });
    const echelle = 180 / Math.max(vp0.width, vp0.height);
    const vp = page.getViewport({ scale: echelle });
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(vp.width));
    c.height = Math.max(1, Math.round(vp.height));
    const g = c.getContext("2d", { willReadFrequently:true });
    g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
    await page.render({ canvasContext:g, viewport:vp }).promise;
    const d = g.getImageData(0,0,c.width,c.height).data;
    let colores = 0, total = 0;
    for(let i = 0; i < d.length; i += 4){
      const r = d[i], v = d[i+1], b = d[i+2];
      const max = Math.max(r,v,b), min = Math.min(r,v,b);
      if(max > 245 && min > 245) continue;          // fond blanc : ignoré
      total++;
      if(max - min > 42) colores++;                  // écart de teinte : de la couleur
    }
    return total ? colores / total : 0;
  }catch(e){ return 0; }
}

async function lirePDF(file, { signal, onEtat, toutAnnote } = {}){
  const lib = await chargerPDFJS();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for(let i = 1; i <= doc.numPages; i++){
    if(signal && signal.aborted) throw Object.assign(new Error("interrompu"), { code:"delai_depasse" });
    if(onEtat) onEtat(i, doc.numPages);
    const page = await doc.getPage(i);
    const contenu = await page.getTextContent();
    const texte = contenu.items.map(x=>x.str).join(" ").replace(/[ \t]+/g, " ").trim();

    if(texte.length < SEUIL_PAGE_VIDE){
      // Aucune couche de texte : page scannée, lecture d'image obligatoire.
      pages.push({ num:i, texte:"", scan:true, annotee:true, page });
      continue;
    }

    const nbAnnot = await annotationsDeclarees(page);
    const couleur = nbAnnot ? 1 : await tauxCouleur(page);
    const annotee = !!toutAnnote || nbAnnot > 0 || couleur > SEUIL_COULEUR;
    pages.push({ num:i, texte, scan:false, annotee, page,
                 motif: nbAnnot ? nbAnnot + " annotation" + (nbAnnot>1?"s":"") + " déclarée" + (nbAnnot>1?"s":"")
                       : (annotee ? Math.round(couleur*1000)/10 + " % de couleur" : "") });
  }
  return { nom: file.name, pages, total: doc.numPages,
           scannees: pages.filter(p=>p.scan).length,
           annotees: pages.filter(p=>p.annotee && !p.scan).length };
}

/* Rendu d'une page scannée en image, puis lecture par l'IA. */
async function ocrPagePDF(page, signal, contexte){
  const vp = page.getViewport({ scale: 2 });
  const c = document.createElement("canvas");
  c.width = Math.min(vp.width, 2000);
  c.height = Math.round(vp.height * (c.width / vp.width));
  await page.render({ canvasContext: c.getContext("2d"),
    viewport: page.getViewport({ scale: 2 * (c.width / vp.width) }) }).promise;
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.85));
  return iaTexte({
    system: NIVEAU,
    messages: [{ role:"user", content: consigneVision(contexte || "Page scannée d'un document de cours.") }],
    images: [blob], effort: "medium", maxTokens: 8000, signal
  });
}

/* Page imprimée annotée à la main : le texte imprimé est déjà connu avec
   certitude par extraction. Inutile de le faire redéchiffrer au modèle —
   on le lui donne comme référence et on lui demande de n'y ajouter que ce
   que l'extraction ne peut pas voir : le trait, le surlignage, la marge. */
async function lirePageAnnotee(page, texteImprime, signal){
  return ocrPagePDF(page, signal,
    "Cette page est un document imprimé sur lequel un étudiant a écrit à la main.\n"
    + "Le texte imprimé a déjà été extrait avec certitude, le voici — reprends-le tel quel, "
    + "sans le retaper de mémoire ni le corriger :\n\n« " + String(texteImprime).slice(0, 6000) + " »\n\n"
    + "Ton travail porte uniquement sur ce que cette extraction ne peut pas voir : les traces manuscrites. "
    + "Rends le texte imprimé en markdown propre, et insère les annotations À LEUR PLACE EXACTE dans ce texte — "
    + "un mot surligné devient ==ce mot==, un passage entouré devient **ce passage** [entouré], "
    + "une note de marge apparaît en citation à la hauteur du paragraphe qu'elle commente. "
    + "Si une page ne porte aucune trace manuscrite, rends simplement le texte imprimé.");
}

/* Découpe un long texte en tranches, sans couper au milieu d'un paragraphe. */
function decouper(texte, taille){
  const morceaux = [];
  let reste = texte;
  while(reste.length > taille){
    let coupe = reste.lastIndexOf("\n\n", taille);
    if(coupe < taille * 0.5) coupe = reste.lastIndexOf("\n", taille);
    if(coupe < taille * 0.5) coupe = taille;
    morceaux.push(reste.slice(0, coupe));
    reste = reste.slice(coupe);
  }
  if(reste.trim()) morceaux.push(reste);
  return morceaux;
}
