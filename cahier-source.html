/* Vérifie par l'usage qu'un modèle répond vraiment — le catalogue ne suffit pas. */
async function validerModele(nom){
  const avant = IA.modele;
  IA.modele = nom;
  try{
    await appelAPI({ messages:[{ role:"user", content:"Réponds exactement : OK" }], maxTokens: 1024, effort:"low" }, true);
    return true;
  }catch(e){
    // Refus franc de l'API : le modèle est inutilisable, on le retient.
    if(e && (e.code === "modele_inconnu" || e.code === "invalid_request")){ exclureModele(nom); return false; }
    // Réponse vide : signal trop faible pour condamner un modèle définitivement —
    // on passe au suivant sans l'écarter pour toujours.
    if(e && e.code === "empty_completion"){ IA.modele = avant; return false; }
    IA.modele = avant; throw e;   // clé invalide, quota… : ce n'est pas le modèle
  }
}

/* ---------- Gemini : conversion du schéma JSON vers le format Google ---------- */
function versSchemaGemini(s){
  if(!s || typeof s !== "object") return s;
  const g = {};
  if(s.type) g.type = String(s.type).toUpperCase();
  if(s.description) g.description = s.description;
  if(s.enum) g.enum = s.enum;
  if(s.items) g.items = versSchemaGemini(s.items);
  if(s.properties){
    g.properties = {};
    for(const k of Object.keys(s.properties)) g.properties[k] = versSchemaGemini(s.properties[k]);
    g.propertyOrdering = Object.keys(s.properties);
  }
  if(s.required) g.required = s.required;
  return g;   // `additionalProperties` n'existe pas côté Gemini : volontairement omis
}

/* ---------- appel Gemini, en flux ---------- */
async function appelGemini(o, essais){
  essais = essais || 0;
  try{
    return await appelGeminiBrut(o);
  }catch(brut){
    const e = normErreur(brut);
    if(e && e.code === "pensee_obligatoire" && !o.sansPensee){
      return appelGemini({ ...o, sansPensee:true }, essais);
    }
    if(e && e.code === "modele_inconnu" && essais < 4 && await reparerModele()){
      return appelGemini(o, essais + 1);
    }
    throw e;
  }
}

async function appelGeminiBrut({ system, messages, images, maxTokens, schema, onText, signal, recherche, sources, effort, sansPensee }){
  const parts = [];
  for(const im of (images||[])) parts.push({ inline_data:{ mime_type: im.media, data: im.b64 } });

  const contents = messages.map((m, i)=>{
    const p = [{ text: m.content }];
    // les images accompagnent le dernier tour utilisateur
    if(i === messages.length - 1 && parts.length) return { role:"user", parts: parts.concat(p) };
    return { role: m.role === "assistant" ? "model" : "user", parts: p };
  });

  const body = {
    contents,
    generationConfig: { maxOutputTokens: maxTokens || 8192 }
  };
  // Les modèles Gemini récents réfléchissent avant d'écrire, et cette phase
  // est invisible : l'écran reste vide longtemps. Pour une extraction, elle
  // n'apporte rien — on la coupe et la réponse arrive tout de suite.
  if(effort === "low" && !sansPensee) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  if(system) body.systemInstruction = { parts:[{ text: system }] };
  // La recherche web et le schéma JSON s'excluent chez Google : quand on
  // veut des sources, on accepte du texte libre et on cite en fin de réponse.
  if(recherche) body.tools = [{ google_search: {} }];
  else if(schema){
    body.generationConfig.responseMimeType = "application/json";
    body.generationConfig.responseSchema = versSchemaGemini(schema);
  }

  const url = "https://generativelanguage.googleapis.com/v1beta/models/"
            + encodeURIComponent(IA.modele) + ":streamGenerateContent?alt=sse";

  const res = await fetch(url, {
    method:"POST", signal,
    headers:{ "content-type":"application/json", "x-goog-api-key": cleActive() },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let msg = "", attente = 0, quotaJour = false;
    try{
      const j = await res.json(); msg = (j.error && j.error.message) || "";
      const details = (j.error && j.error.details) || [];
      const ri = details.find(d=>/RetryInfo/.test((d && d["@type"]) || ""));
      if(ri && ri.retryDelay) attente = parseFloat(ri.retryDelay) || 0;
      quotaJour = /PerDay|per day/i.test(JSON.stringify(details) + " " + msg);
    }catch(e){}
    if(!attente){ const mm = /retry in ([\d.]+)\s*s/i.exec(msg); if(mm) attente = parseFloat(mm[1]) || 0; }
    if(/denied access|CONSUMER_INVALID|PERMISSION_DENIED/i.test(msg))
      msg += " — le compte Google lui-même est bloqué, pas la clé. Causes habituelles : compte scolaire ou professionnel dont l'administrateur interdit AI Studio, "
           + "ou compte personnel sans date de naissance renseignée / déclaré mineur. Réessaie avec un compte Gmail personnel majeur, "
           + "ou bascule sur Claude ci-dessus.";
    else if(/API key not valid|API_KEY_INVALID/i.test(msg)) msg += " — clé mal copiée, ou copiée en partie.";
    else if(/has not been used|is disabled|SERVICE_DISABLED/i.test(msg)) msg += " — l'API Generative Language n'est pas activée sur ce projet Google.";
    else if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(msg)) msg += " — la clé est restreinte à certains sites ; retire la restriction, ou autorise wyngo-create.github.io.";
    const err = new Error(msg || ("HTTP "+res.status));
    // « only supports Interactions API », « not supported for generateContent » :
    // le catalogue annonce le modèle, mais il refuse cette API. C'est un problème
    // de modèle, pas de clé — on l'écarte et on prend le suivant.
    // Refus portant sur l'outil de recherche, pas sur le modèle : on le
    // distingue pour pouvoir réessayer sans ancrage au lieu d'abandonner.
    if(recherche && /tool|google_?search|grounding|function/i.test(msg)){
      const e2 = new Error(msg || ("HTTP "+res.status));
      e2.code = "recherche_refusee"; throw e2;
    }
    // Certains modèles refusent qu'on coupe leur réflexion : on la rétablit.
    if(!sansPensee && /thinking|thought|budget/i.test(msg)){
      const e2 = new Error(msg || ("HTTP "+res.status));
      e2.code = "pensee_obligatoire"; throw e2;
    }
    const modeleRefuse = /only supports|not supported for|is not supported|does not support/i.test(msg);
    err.code = res.status === 404 || modeleRefuse ? "modele_inconnu"
             : res.status === 400 && /API key/i.test(msg) ? "cle_invalide"
             : res.status === 403 ? "cle_invalide"
             : res.status === 429 ? "rate_limited"
             : res.status >= 500 ? "upstream_error" : "api_error";
    err.attente = attente; err.quotaJour = quotaJour;
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", fin = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut) continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      const cand = ev.candidates && ev.candidates[0];
      if(!cand) continue;
      if(cand.finishReason) fin = cand.finishReason;
      const ps = (cand.content && cand.content.parts) || [];
      for(const p of ps) if(typeof p.text === "string"){ texte += p.text; if(onText) onText(texte); }
      // Sources d'ancrage : ce qui rend la réponse contrôlable.
      const gm = cand.groundingMetadata;
      if(sources && gm && gm.groundingChunks){
        for(const g of gm.groundingChunks){
          const w = g && g.web;
          if(w && w.uri && !sources.some(s=>s.url === w.uri)) sources.push({ url:w.uri, titre:w.title || w.uri });
        }
      }
    }
  }

  if(fin === "SAFETY" || fin === "PROHIBITED_CONTENT"){ const e=new Error("refus"); e.code="refused"; throw e; }
  if(!texte.trim()){ const e=new Error("réponse vide"); e.code="empty_completion"; throw e; }
  if(fin === "MAX_TOKENS") texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]";
  return texte;
}

/* ---------- appel Anthropic, en flux ---------- */
/* `sansReparation` : utilisé par validerModele(), qui teste un modèle précis et
   doit voir l'échec brut — sinon la réparation automatique basculerait sur un
   autre modèle et la validation croirait avoir réussi. */
async function appelAPI(o, sansReparation){
  if(IA.fournisseur === "gemini") return appelGemini(o, sansReparation ? 99 : 0);
  // La recherche web n'est pas encore câblée côté Anthropic : on génère sans
  // ancrage plutôt que d'échouer, et l'interface le dit franchement.
  if(o && o.recherche) o = { ...o, recherche:false };
  try{
    return await appelAnthropic(o);
  }catch(brut){
    const e = normErreur(brut);
    if(e && e.code === "modele_inconnu" && !sansReparation && await reparerModele()){
      return appelAPI(o, true);
    }
    throw e;
  }
}

async function appelAnthropic({ system, messages, images, effort, maxTokens, schema, onText, signal }){
  const contenu = [];
  for(const im of (images||[])) contenu.push({ type:"image", source:{ type:"base64", media_type: im.media, data: im.b64 } });

  const msgs = messages.map(m=>({ role:m.role, content:m.content }));
  if(contenu.length){
    const dernier = msgs[msgs.length-1];
    dernier.content = contenu.concat([{ type:"text", text: dernier.content }]);
  }

  const body = {
    model: IA.modele,
    max_tokens: maxTokens || 16000,
    stream: true,
    messages: msgs,
    output_config: { effort: effort || "medium" }
  };
  if(system) body.system = system;
  if(schema) body.output_config.format = { type:"json_schema", schema };

  const res = await fetch(API_URL, {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cleActive(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    const err = new Error(detail || ("HTTP " + res.status));
    err.code = res.status === 401 ? "cle_invalide"
             : res.status === 404 ? "modele_inconnu"
             : res.status === 429 ? "rate_limited"
             : res.status === 400 && /model/i.test(detail) ? "modele_inconnu"
             : res.status === 400 ? "invalid_request"
             : res.status >= 500 ? "upstream_error" : "api_error";
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", stop = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut || brut === "[DONE]") continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
        texte += ev.delta.text;
        if(onText) onText(texte);
      }else if(ev.type === "message_delta" && ev.delta && ev.delta.stop_reason){
        stop = ev.delta.stop_reason;
      }else if(ev.type === "error"){
        const err = new Error((ev.error && ev.error.message) || "erreur de flux");
        err.code = "upstream_error"; throw err;
      }
    }
  }

  if(stop === "refusal"){ const e = new Error("refus"); e.code = "refused"; throw e; }
  if(!texte.trim()){ const e = new Error("réponse vide"); e.code = "empty_completion"; throw e; }
  if(stop === "max_tokens"){ texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]"; }
  return texte;
}

/* ---------- travail long : délai, annulation, compteur ----------
   Sans délai maximum, une connexion qui reste ouverte sans rien renvoyer
   fige l'écran indéfiniment. On borne, on montre le temps écoulé, et on
   laisse toujours une porte de sortie. */
function chantier(cible, libelle, opts){
  opts = opts || {};
  const ctl = new AbortController(), t0 = Date.now();
  const peindre = ()=>{
    if(!cible || !cible.isConnected) return;
    const s = Math.round((Date.now() - t0) / 1000);
    cible.innerHTML = '<span class="thinking"><i></i>' + esc(libelle) + " — " + s + " s</span> "
      + '<button class="btn sm fantome" data-stop="1">Annuler</button>'
      + (s >= 20 ? '<p class="note" style="margin-top:8px">Le modèle réfléchit avant d\'écrire : '
          + "rien ne s'affiche tant qu'il n'a pas commencé. C'est normal jusqu'à une minute environ.</p>" : "");
    const b = cible.querySelector("[data-stop]");
    if(b) b.onclick = ()=>ctl.abort();
  };
  peindre();
  const battement = setInterval(peindre, 1000);
  const limite = setTimeout(()=>ctl.abort(), opts.delai || 120000);
  return { signal: ctl.signal, fini(){ clearInterval(battement); clearTimeout(limite); } };
}

/* Une interruption ou une coupure réseau doivent se lire comme telles. */
function normErreur(e){
  if(e && (e.name === "AbortError" || e.code === 20)){
    const x = new Error("interrompu ou temps d'attente dépassé"); x.code = "delai_depasse"; return x;
  }
  if(e instanceof TypeError && /fetch|network|load failed|réseau/i.test(e.message || "")){
    const x = new Error("connexion au fournisseur impossible"); x.code = "reseau"; return x;
  }
  return e;
}

/* ---------- reprises sur incident passager ----------
   Une saturation du fournisseur est temporaire : on réessaie tout seul,
   en espaçant, puis on bascule sur le modèle suivant du classement.
   Le modèle saturé n'est jamais mis à l'écart : il refonctionnera. */
const dodo = ms => new Promise(r=>setTimeout(r, ms));
const estPassager = c => c === "upstream_error" || c === "rate_limited";

async function avecReprises(faire){
  const attentes = [0, 4000, 12000, 30000];
  let derniere;
  for(let i = 0; i < attentes.length; i++){
    if(i){
      // Google indique souvent lui-même combien de temps patienter : on s'y tient.
      const conseil = derniere && derniere.attente ? Math.min(60000, Math.round(derniere.attente * 1000) + 500) : 0;
      const ms = Math.max(attentes[i], conseil);
      toast("Service d'IA saturé (Google, pas ton cahier) — nouvel essai dans " + Math.round(ms/1000) + " s. Ne ferme rien.", ms);
      await dodo(ms);
    }
    try{ return await faire(); }
    catch(brut){
      const e = normErreur(brut);
      derniere = e;
      if(!estPassager(e && e.code)) throw e;   // une annulation ne se réessaie jamais
      if(e.quotaJour) break;                   // quota du jour épuisé : attendre ne sert à rien
    }
  }
  // Toujours saturé : chaque modèle a son propre quota, on essaie les suivants.
  try{
    const avant = IA.modele;
    const autres = classerModeles(await listerModeles()).filter(n => n !== avant).slice(0, 3);
    for(const suivant of autres){
      toast("Modèle saturé — essai avec " + suivant, 3000);
      enregistrerConfig({ modele: suivant });
      try{ return await faire(); }catch(e2){ /* on essaie le suivant */ }
    }
    enregistrerConfig({ modele: avant });
  }catch(e3){ /* on retombe sur l'erreur d'origine, plus parlante */ }
  throw derniere;
}

/* ---------- interface unique utilisée par tout le reste de l'app ---------- */
/* Les deux moteurs exigent que l'échange commence par un tour "user". */
function normaliser(messages){
  const m = (messages||[]).slice();
  while(m.length && m[0].role !== "user") m.shift();
  return m.length ? m : [{ role:"user", content:"(pas de message)" }];
}

async function iaTexte(opts){
  const { system, images, effort, maxTokens, onText, recherche, sources, signal } = opts;
  const messages = normaliser(opts.messages);
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (images||[])) imgs.push(await imageEnBase64(f, { fin: opts.fin || qualiteFine() }));
    return avecReprises(()=>appelAPI({ system, messages, images:imgs, effort, maxTokens, onText, recherche, sources, signal }));
  }
  if(IA.mode === "artifact"){
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : (effort === "high" ? "complex" : "default"), cache:false };
    if(images && images.length) o.images = images;
    if(onText) o.onText = ({text})=>onText(text);
    const r = await sample(entree, o);
    return r.text;
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

async function iaJson(opts){
  opts = { ...opts, messages: normaliser(opts.messages) };
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (opts.images||[])) imgs.push(await imageEnBase64(f, { fin: opts.fin || qualiteFine() }));
    const t = await avecReprises(()=>appelAPI({ ...opts, images:imgs }));
    try{ return JSON.parse(t); }
    catch(e){
      const m = t.match(/[\{\[][\s\S]*[\}\]]/);
      if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
      const err = new Error("JSON illisible"); err.code = "invalid_json"; err.text = t; throw err;
    }
  }
  if(IA.mode === "artifact"){
    const { system, messages, images, effort } = opts;
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : "complex", cache:false };
    if(images && images.length) o.images = images;
    return sample.json(entree, o);
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

function msgErreur(e){
  const c = e && e.code;
  if(c==="cle_invalide") return "Clé refusée par " + FOURNISSEURS[IA.fournisseur].nom
    + (e.message ? ". Réponse exacte du fournisseur : « " + e.message + " »" : ".");
  if(c==="modele_inconnu") return "Aucun modèle utilisable trouvé pour cette clé. Vérifie qu'elle est bien active sur " + FOURNISSEURS[IA.fournisseur].lienCle + ".";
  if(c==="api_error") return "L'API a refusé la requête" + (e.message ? " : "+e.message : ".");
  if(c==="not_granted" || c==="sampling_disabled") return "L'assistant n'est pas configuré — voir ⚙ Réglages.";
  if(c==="rate_limited") return e.quotaJour
    ? "Quota gratuit de Google épuisé pour aujourd'hui sur ce modèle — choisis un autre modèle dans ⚙ Réglages, ou réessaie demain. Ton texte est gardé."
    : "Service d'IA saturé (le problème vient de Google, pas de ton cahier) — réessaie dans une minute. Ton texte est gardé.";
  if(c==="prompt_too_large") return "Le chapitre est trop long à envoyer d'un coup. Analyse-le en deux chapitres.";
  if(c==="invalid_json") return "Réponse mal formée. Relance l'analyse.";
  if(c==="image_rejected") return "Image refusée : format non supporté ou fichier trop lourd.";
  if(c==="images_unavailable") return "Cette vue ne peut pas envoyer d'images. Ouvre le classeur depuis l'application Claude, ou colle le texte dans « Écrire un cours ».";
  if(c==="session_expired") return "Session expirée — reconnecte-toi puis réessaie.";
  if(c==="cancelled") return "Interrompu.";
  if(c==="delai_depasse") return "Interrompu — soit par toi, soit après deux minutes sans réponse. "
    + "Si ça se reproduit, essaie avec un texte plus court, ou change de modèle dans les réglages.";
  if(c==="reseau") return "Connexion impossible. Vérifie ta liaison internet, puis réessaie.";
  if(c==="upstream_error") return "Le service a échoué en cours de réponse"
    + (e.message ? " : « "+e.message+" »" : ". Réessaie dans un instant.");
  // Jamais de message muet : si le fournisseur a dit quelque chose, on le montre.
  return "L'assistant n'a pas pu répondre"
    + (e && e.message ? " — réponse du fournisseur : « " + e.message + " »" : ". Réessaie.")
    + (c ? " (code : " + c + ")" : "");
}

let modalSticky = false;
function modal(html, opts){

  host.innerHTML = '<div class="scrim"><div class="modal'+((opts&&opts.wide)?" wide":"")+'" role="dialog" aria-modal="true">'+html+"</div></div>";
  const scrim = host.querySelector(".scrim");
  scrim.addEventListener("mousedown", e=>{ if(e.target===scrim && !modalSticky) closeModal(); });
  document.addEventListener("keydown", escClose);
  return host.querySelector(".modal");
}
function escClose(e){
  if(e.key!=="Escape") return;
  if(modalSticky && !confirm("Fermer sans enregistrer ?")) return;
  closeModal();
}

    if(c){ c.titre=titre; c.numero=Number($("#cN").value)||0; c.statut=$("#cS").value; c.note=$("#cNote").value.trim(); }
    else{
      const nc = { id:uid(), matiereId:mid, titre, numero:Number($("#cN").value)||0, statut:$("#cS").value, note:$("#cNote").value.trim() };
      state.chapitres.push(nc); state.openChaps.add(nc.id); state.selChap = nc.id;
    }
    await saveStructure(); closeModal(); render(); toast("Chapitre enregistré");
  };
}

async function delChapitre(cid){
  const c = chapById(cid); if(!c) return;
  const n = itemsOf(cid).length;
  if(!confirm("Supprimer « "+c.titre+" »"+(n?" et ses "+n+" document(s)":"")+" ?"
    + (n?"\n\nUne sauvegarde est conservée : Réglages → Récupérer du contenu.":""))) return;
  if(n) await instantane("avant suppression du thème " + c.titre);
  for(const it of itemsOf(cid)) await deleteItem(it.id);
  enterrer("chapitres", cid);
  state.chapitres = state.chapitres.filter(x=>x.id!==cid);
  state.openChaps.delete(cid); if(state.selChap===cid) state.selChap = null;
  await saveStructure(); render(); toast("Chapitre supprimé");
}

/* =========================================================
   LECTURE DES PDF
   Un poly de cours porte presque toujours une couche de texte : on
   l'extrait, c'est instantané, gratuit et fidèle au caractère près.
   La lecture d'image, coûteuse, est réservée aux pages réellement
   scannées — celles où l'extraction ne rend rien.
   ========================================================= */
const PDFJS_VERSION = "3.11.174";
const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/";
let pdfjsPromesse = null;

function chargerPDFJS(){
  if(pdfjsPromesse) return pdfjsPromesse;
  pdfjsPromesse = new Promise((ok, ko)=>{
    if(window.pdfjsLib){ ok(window.pdfjsLib); return; }
    const s = document.createElement("script");
    s.src = PDFJS_BASE + "pdf.min.js";
    s.onload = ()=>{
      if(!window.pdfjsLib){ ko(Object.assign(new Error("bibliothèque PDF illisible"), {code:"pdf_indispo"})); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
      ok(window.pdfjsLib);
    };
    s.onerror = ()=>{
      pdfjsPromesse = null;
      ko(Object.assign(new Error("lecteur PDF inaccessible — vérifie ta connexion"), {code:"pdf_indispo"}));
    };
    document.head.appendChild(s);
  });
  return pdfjsPromesse;
}

/* Une page dont l'extraction rend moins de 40 caractères utiles est
   considérée comme scannée : c'est le seuil qui sépare un poly numérique
   d'une photocopie. */
const SEUIL_PAGE_VIDE = 40;
/* Chaque page lue en image est un appel au modèle : on borne pour qu'un poly
   de deux cents pages ne se transforme pas en facture surprise. Seules les pages
   SANS couche de texte (scans) et les pages annotées passent par là — un poly
   numérique de 300 pages n'en consomme aucune. Réglable : les polys dépassent
   couramment la trentaine de pages. */
const S_PLAFOND = LS_KEY + "-plafond-pages";
const PLAFONDS = [40, 80, 150];
function plafondPages(){
  try{
    const v = Number(localStorage.getItem(S_PLAFOND));
    return PLAFONDS.indexOf(v) >= 0 ? v : 80;
  }catch(e){ return 80; }
}
function reglerPlafond(v){
  try{ localStorage.setItem(S_PLAFOND, String(v)); }catch(e){}
}

/* Une page peut porter du texte ET des annotations manuscrites : un poly
   imprimé qu'on a surligné et entouré. L'extraction de texte seule les
   perd toutes. On repère donc ces pages par deux voies complémentaires. */
const SOUS_TYPES_ANNOTATION = ["Ink","Highlight","Square","Circle","FreeText",
  "Underline","StrikeOut","Squiggly","Polygon","PolyLine","Stamp","Text","Caret"];

/* Voie 1 — annotations déclarées : un PDF annoté dans un lecteur ou sur
   tablette porte des objets d'annotation que pdf.js sait énumérer. */
async function annotationsDeclarees(page){
  try{
    const a = await page.getAnnotations({ intent:"display" });
    return (a||[]).filter(x=>SOUS_TYPES_ANNOTATION.indexOf(x.subtype) >= 0).length;
  }catch(e){ return 0; }
}

/* Voie 2 — encre aplatie : une fois le trait fondu dans l'image de la page,
   aucun objet ne subsiste. Mais un poly imprimé est quasi gris, alors qu'un
   stylo ou un surligneur est très saturé. On compte donc les pixels colorés
   sur un rendu minuscule : quelques millisecondes, aucun appel réseau. */
const SEUIL_COULEUR = 0.004;   // 0,4 % de pixels colorés suffit à trahir un trait

async function tauxCouleur(page){
  try{
    const vp0 = page.getViewport({ scale: 1 });
    const echelle = 180 / Math.max(vp0.width, vp0.height);
    const vp = page.getViewport({ scale: echelle });
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(vp.width));
    c.height = Math.max(1, Math.round(vp.height));
    const g = c.getContext("2d", { willReadFrequently:true });
    g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
    await page.render({ canvasContext:g, viewport:vp }).promise;
    const d = g.getImageData(0,0,c.width,c.height).data;
    let colores = 0, total = 0;
    for(let i = 0; i < d.length; i += 4){
      const r = d[i], v = d[i+1], b = d[i+2];
      const max = Math.max(r,v,b), min = Math.min(r,v,b);
      if(max > 245 && min > 245) continue;          // fond blanc : ignoré
      total++;
      if(max - min > 42) colores++;                  // écart de teinte : de la couleur
    }
    return total ? colores / total : 0;
  }catch(e){ return 0; }
}

async function lirePDF(file, { signal, onEtat, toutAnnote } = {}){
  const lib = await chargerPDFJS();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for(let i = 1; i <= doc.numPages; i++){
    if(signal && signal.aborted) throw Object.assign(new Error("interrompu"), { code:"delai_depasse" });
    if(onEtat) onEtat(i, doc.numPages);
    const page = await doc.getPage(i);
    const contenu = await page.getTextContent();
    const texte = contenu.items.map(x=>x.str).join(" ").replace(/[ \t]+/g, " ").trim();

    if(texte.length < SEUIL_PAGE_VIDE){
      // Aucune couche de texte : page scannée, lecture d'image obligatoire.
      pages.push({ num:i, texte:"", scan:true, annotee:true, page });
      continue;
    }

    const nbAnnot = await annotationsDeclarees(page);
    const couleur = nbAnnot ? 1 : await tauxCouleur(page);
    const annotee = !!toutAnnote || nbAnnot > 0 || couleur > SEUIL_COULEUR;
    pages.push({ num:i, texte, scan:false, annotee, page,
                 motif: nbAnnot ? nbAnnot + " annotation" + (nbAnnot>1?"s":"") + " déclarée" + (nbAnnot>1?"s":"")
                       : (annotee ? Math.round(couleur*1000)/10 + " % de couleur" : "") });
  }
  return { nom: file.name, pages, total: doc.numPages,
           scannees: pages.filter(p=>p.scan).length,
           annotees: pages.filter(p=>p.annotee && !p.scan).length };
}

/* Rendu d'une page scannée en image, puis lecture par l'IA. */
async function ocrPagePDF(page, signal, contexte){
  const vp = page.getViewport({ scale: 2 });
  const c = document.createElement("canvas");
  c.width = Math.min(vp.width, 2000);
  c.height = Math.round(vp.height * (c.width / vp.width));
  await page.render({ canvasContext: c.getContext("2d"),
    viewport: page.getViewport({ scale: 2 * (c.width / vp.width) }) }).promise;
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.85));
  return iaTexte({
    system: NIVEAU,
    messages: [{ role:"user", content: consigneVision(contexte || "Page scannée d'un document de cours.") }],
    images: [blob], effort: "medium", maxTokens: 8000, signal
  });
}

/* Page imprimée annotée à la main : le texte imprimé est déjà connu avec
   certitude par extraction. Inutile de le faire redéchiffrer au modèle —
   on le lui donne comme référence et on lui demande de n'y ajouter que ce
   que l'extraction ne peut pas voir : le trait, le surlignage, la marge. */
async function lirePageAnnotee(page, texteImprime, signal){
  return ocrPagePDF(page, signal,
    "Cette page est un document imprimé sur lequel un étudiant a écrit à la main.\n"
    + "Le texte imprimé a déjà été extrait avec certitude, le voici — reprends-le tel quel, "
    + "sans le retaper de mémoire ni le corriger :\n\n« " + String(texteImprime).slice(0, 6000) + " »\n\n"
    + "Ton travail porte uniquement sur ce que cette extraction ne peut pas voir : les traces manuscrites. "
    + "Rends le texte imprimé en markdown propre, et insère les annotations À LEUR PLACE EXACTE dans ce texte — "
    + "un mot surligné devient ==ce mot==, un passage entouré devient **ce passage** [entouré], "
    + "une note de marge apparaît en citation à la hauteur du paragraphe qu'elle commente. "
    + "Si une page ne porte aucune trace manuscrite, rends simplement le texte imprimé.");
}

/* Découpe un long texte en tranches, sans couper au milieu d'un paragraphe. */
function decouper(texte, taille){
  const morceaux = [];
  let reste = texte;
  while(reste.length > taille){
    let coupe = reste.lastIndexOf("\n\n", taille);
    if(coupe < taille * 0.5) coupe = reste.lastIndexOf("\n", taille);
    if(coupe < taille * 0.5) coupe = taille;
    morceaux.push(reste.slice(0, coupe));
    reste = reste.slice(coupe);
  }
  if(reste.trim()) morceaux.push(reste);
  return morceaux;
}

    + '<div class="thumbs" id="thumbs"></div>'
    + '<div><label class="lab" for="iPaste">Ou colle du texte — poly, PDF copié-collé, transcription</label>'
    +   '<textarea class="field" id="iPaste" rows="7" placeholder="Colle ici le contenu brut. Plusieurs chapitres ou plusieurs documents à la suite : ils seront séparés et classés."></textarea></div>'

    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("hot"); }));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("hot"); }));

const SCHEMA_IMPORT = {
  type:"object",
  properties:{
    documents:{ type:"array", items:{
      type:"object",
      properties:{
        titre:{type:"string"},
        type:{type:"string", enum:["cours","td","exercice","fiche","annale","note"]},
        chapitreId:{type:"string"},
        chapitreTitre:{type:"string"},
        pages:{type:"string"},
        transcription:{type:"string"},
        concepts:{type:"array", items:{type:"string"}},
        incertitudes:{type:"array", items:{type:"string"}}
      },
      required:["titre","type","chapitreId","chapitreTitre","pages","transcription","concepts","incertitudes"],
      additionalProperties:false }}
  },
  required:["documents"],
  additionalProperties:false
};

async function lancerImport(files, mid, hint, maxN, colle, toutAnnote){
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir ⚙ Réglages."); return; }
  const estPDF = f => /\.pdf$/i.test(f.name) || f.type === "application/pdf";
  const imgs = files.filter(f=>f.type.startsWith("image/"));
  const pdfs = files.filter(estPDF);
  const txts = files.filter(f=>!f.type.startsWith("image/") && !estPDF(f));
  if(imgs.length && !IA.vision && !colle && !pdfs.length){
    toast("La lecture des photos n'est pas active ici — voir ⚙ Réglages.", 4500); return;
  }
  if(imgs.length > maxN){ toast("Maximum "+maxN+" images par analyse — retires-en quelques-unes."); return; }

  const btn = $("#iGo"); btn.disabled = true;
  const ch = chantier($("#iState"), "Lecture des documents", { delai: 600000 });

  let annexes = "";
  for(const f of txts){
    if(!TXT_EXT.test(f.name) && !f.type.startsWith("text/")){ toast("Format non lisible : "+f.name); continue; }
    try{ annexes += "\n\n=== FICHIER JOINT : "+f.name+" ===\n" + (await f.text()).slice(0,18000); }catch(e){}
  }

  /* ----- PDF : couche de texte d'abord, lecture d'image en dernier ----- */
  let textePDF = "", bilanPDF = [], restant = 0;
  try{
    for(const f of pdfs){
      const lu = await lirePDF(f, { signal: ch.signal, toutAnnote,
        onEtat: (i,n)=>{ const e=$("#iState"); if(e && e.querySelector(".thinking"))
          e.querySelector(".thinking").innerHTML = "<i></i>" + esc(f.name) + " — page " + i + "/" + n; } });

      // Toute page sans couche de texte, ou portant des traces manuscrites,
      // demande une lecture d'image. Le plafond borne la dépense : au-delà,
      // les pages restantes gardent leur texte imprimé sans les annotations.
      const aLire = lu.pages.filter(p=>p.scan || p.annotee);
      if(aLire.length && IA.vision){
        const plafond = Math.min(aLire.length, plafondPages());
        for(let k = 0; k < plafond; k++){
          const pg = aLire[k], e = $("#iState");
          if(e && e.querySelector(".thinking"))
            e.querySelector(".thinking").innerHTML = "<i></i>" + esc(f.name) + " — page " + pg.num
              + " " + (pg.scan ? "scannée" : "annotée") + " (" + (k+1) + "/" + plafond + ")";
          try{
            pg.texte = pg.scan
              ? await ocrPagePDF(pg.page, ch.signal)
              : await lirePageAnnotee(pg.page, pg.texte, ch.signal);
          }catch(e2){ /* on garde le texte extrait : mieux vaut sans annotations que rien */ }
        }
        if(aLire.length > plafond) restant += aLire.length - plafond;
      }

      const utiles = lu.pages.filter(p=>p.texte);
      textePDF += "\n\n=== DOCUMENT : " + f.name + " ===\n"
        + utiles.map(p=>"\n[page " + p.num + "]\n" + p.texte).join("\n");
      bilanPDF.push(f.name + " : " + lu.total + " page" + (lu.total>1?"s":"")
        + (lu.scannees ? ", " + lu.scannees + " scannée" + (lu.scannees>1?"s":"") : "")
        + (lu.annotees ? ", " + lu.annotees + " annotée" + (lu.annotees>1?"s":"") + " à la main" : "")
        + (!lu.scannees && !lu.annotees ? ", texte pur" : ""));
    }
  }catch(e){
    ch.fini();
    $("#iState").innerHTML = '<b style="color:var(--alerte)">' + esc(
      e && e.code === "pdf_indispo" ? e.message : msgErreur(e)) + "</b>";
    btn.disabled = false;
    return;
  }

  $("#iOut").innerHTML = bilanPDF.length
    ? '<div class="card"><h4>PDF lus</h4><p class="note">' + esc(bilanPDF.join(" · ")) + "</p>"
      + (restant ? '<p class="note" style="color:var(--attention);margin-top:8px">'
          + restant + " page(s) au-delà du plafond de " + plafondPages()
          + " : leur texte imprimé est bien repris, mais pas les annotations manuscrites. "
          + "Relève le plafond dans ⚙ Réglages, ou découpe le PDF.</p>" : "")
      + "</div>"
    : '<div class="card"><p class="note">L\'agent lit chaque page, retranscrit intégralement et identifie de quel chapitre il s\'agit.</p></div>';

  const m = matById(mid), cs = chapsOf(mid);
  const liste = cs.length ? cs.map(c=>'- id "'+c.id+'" · "'+c.titre+'"').join("\n") : "(aucun thème existant)";

  const avecImages = imgs.length > 0 && IA.vision;

  const prompt = "Tu retranscris et classes des documents de cours de la matière « " + (m?m.nom:"?") + " ».\n"
    + (avecImages ? "Les "+imgs.length+" image(s) jointes sont des photos de notes manuscrites, de polycopiés, de tableaux ou de slides, dans l'ordre où elles ont été prises.\n" : "")
    + (hint ? "Précision donnée par l'étudiant : « "+hint+" ».\n" : "")
    + "\n" + REGLE_THEME + "\n"
    + "\nTHÈMES DÉJÀ EXISTANTS dans cette matière — à réutiliser en priorité :\n" + liste + "\n"
    + (colle ? "\nTEXTE FOURNI PAR L'ÉTUDIANT :\n" + colle.slice(0,34000) + "\n" : "")
    + (annexes ? "\nCONTENU DES FICHIERS JOINTS :" + annexes + "\n" : "")
    + "\nTravail à faire :\n"
    + "1. RETRANSCRIS intégralement chaque document, en suivant ces règles de lecture :\n"
    + (avecImages ? consigneVision("").split("RESTITUE LE TEXTE")[1].split("RENDU")[0].trim() + "\n"
                  : "Tout le texte, titres, numérotation, définitions, formules (LaTeX entre $…$), tableaux (markdown). "
                    + "Ne résume pas, ne saute rien, n'invente rien. Marque `[illisible]` là où tu n'es pas sûr.\n")
    + "2. REGROUPE les pages qui se suivent et traitent la même notion en une seule entrée ; SÉPARE en entrées "
    + "distinctes ce qui est de nature différente (cours / exercices / corrigé) ou d'un THÈME différent. "
    + "Une rupture de séance n'est pas une rupture de thème : si la séance 5 poursuit la notion de la séance 4, "
    + "les deux vont ensemble.\n"
    + "3. CLASSE chaque entrée par THÈME : réutilise l'id d'un thème existant dès que le contenu s'y rattache, "
    + "même si le document porte une étiquette de séance différente. Ne crée un thème que pour une notion "
    + "réellement nouvelle.\n"
    + "4. TITRE DU DOCUMENT : court, explicite, et tu peux y garder l'étiquette d'origine "
    + "(« Séance 4 — Exercices sur la propension à consommer ») pour que l'étudiant retrouve son fichier.\n\n"
    + 'Réponds UNIQUEMENT avec ce JSON :\n'
    + '{"documents":[{"titre":"titre court et explicite","type":"cours|td|exercice|fiche|annale|note",'
    + '"chapitreId":"id d\'un thème existant, ou chaîne vide pour un nouveau thème",'
    + '"chapitreTitre":"nom du THÈME (existant ou proposé) — jamais une étiquette de séance",'
    + '"pages":"1-2","transcription":"le document complet en markdown","concepts":["notion 1"],"incertitudes":["passage illisible ou douteux"]}]}';

  const appeler = (withImages, tranche, dejaProposes) => iaJson({
    system: NIVEAU,
    messages: [{ role:"user", content: prompt
      + (tranche ? "\n\nTEXTE EXTRAIT DES PDF (tranche à traiter) :\n" + tranche + "\n" : "")
      + (dejaProposes && dejaProposes.length
          ? "\nChapitres déjà proposés pour les tranches précédentes de ce même document — "
            + "réutilise exactement ces titres quand le contenu s'y rattache, au lieu d'en créer des variantes :\n- "
            + dejaProposes.join("\n- ") + "\n"
          : "") }],
    images: withImages ? imgs : null,
    schema: SCHEMA_IMPORT,
    effort: "medium",
    maxTokens: 32000,
    signal: ch.signal
  });

  try{
    let docs = [];

    if(textePDF.trim()){
      // Un poly de 80 pages dépasse largement ce qu'un seul appel peut lire :
      // on le traite par tranches, en transmettant les chapitres déjà proposés
      // pour que le découpage reste cohérent d'une tranche à l'autre.
      const tranches = decouper(textePDF.trim(), 28000);
      const proposes = [];
      for(let i = 0; i < tranches.length; i++){
        const e = $("#iState");
        if(e) e.innerHTML = '<span class="thinking"><i></i>Classement — tranche ' + (i+1)
          + "/" + tranches.length + "</span>";
        const r = await appeler(i === 0 && avecImages, tranches[i], proposes);
        for(const d of (r && r.documents) || []){
          docs.push(d);
          const t = String(d.chapitreTitre || "").trim();
          if(t && proposes.indexOf(t) < 0) proposes.push(t);
        }
      }
    }else{
      let res;
      try{
        res = await appeler(avecImages);
      }catch(e){
        if(e && e.code === "images_unavailable" && avecImages){
          imagesKO = true; majMode();
          if(colle || annexes){
            $("#iState").innerHTML = '<span class="thinking"><i></i>Photos refusées — reprise sur le texte seul…</span>';
            res = await appeler(false);
          }else{
            throw e;
          }
        }else throw e;
      }
      docs = (res && res.documents) || [];
    }

    ch.fini();
    if(!docs.length){ $("#iState").textContent = "Rien n'a pu être lu."; btn.disabled=false; return; }
    $("#iState").textContent = docs.length + " document(s) reconnu(s)" + (!avecImages && imgs.length ? " — photos ignorées" : "");
    afficherResultats(docs, mid);
  }catch(e){
    ch.fini();
    $("#iState").textContent = msgErreur(e);
    $("#iOut").innerHTML = (e && (e.code === "images_unavailable" || e.code === "not_granted"))
      ? '<div class="card" style="border-color:var(--warn)"><h4 style="color:var(--warn)">Activer la lecture des photos</h4>'
        + '<p class="note">Ouvre ⚙ Réglages et enregistre ta clé API : l\'OCR tourne alors directement dans l\'outil, sans intermédiaire. '
        + 'En attendant, colle le texte dans le champ ci-dessus — le tri et le classement fonctionnent normalement.</p></div>'
      : "";
    btn.disabled = false;
  }
}

function afficherResultats(docs, mid){
  const cs = chapsOf(mid);
  $("#iOut").innerHTML = '<h3 style="font-family:var(--serif);font-size:16px;margin:16px 0 10px">Vérifie avant d\'enregistrer</h3>'
    + docs.map((d,idx)=>{
      const chapOpts = cs.map(c=>'<option value="'+c.id+'"'+(c.id===d.chapitreId?" selected":"")+">Ch. "+esc(c.numero||"?")+" — "+esc(c.titre)+"</option>").join("")
        + '<option value="__new"'+(!d.chapitreId?" selected":"")+">+ Nouveau : "+esc(d.chapitreTitre||"sans titre")+"</option>";
      return '<div class="result" data-r="'+idx+'">'
        + '<div class="result-head"><input value="'+esc(d.titre||"Document")+'" data-f="titre" aria-label="Titre"></div>'
        + '<div class="result-body"><div class="grid2" style="margin-bottom:10px">'
        +   '<div><label class="lab">Chapitre</label><select class="field" data-f="chap">'+chapOpts+"</select></div>"
        +   '<div><label class="lab">Type</label><select class="field" data-f="type">'
        +     Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(d.type===k?" selected":"")+">"+TYPES[k]+"</option>").join("")+"</select></div>"
        + "</div>"
        + '<div class="hide" data-newchap><label class="lab">Titre du nouveau chapitre</label>'
        +   '<input class="field" data-f="newtitre" value="'+esc(d.chapitreTitre||"")+'" style="margin-bottom:10px"></div>'
        + (d.concepts && d.concepts.length ? '<div class="chap-meta" style="margin-bottom:8px">'+d.concepts.slice(0,8).map(c=>'<span class="pill type">'+esc(c)+"</span>").join("")+"</div>" : "")
        + (d.incertitudes && d.incertitudes.length ? '<p class="note" style="color:var(--warn);margin-bottom:8px">À vérifier : '+esc(d.incertitudes.join(" · "))+"</p>" : "")
        + '<label class="lab">Retranscription '+(d.pages?"(pages "+esc(d.pages)+")":"")+"</label>"
        + '<textarea class="field" data-f="contenu" rows="9" style="font-family:var(--mono);font-size:12.5px">'+esc(d.transcription||"")+"</textarea>"
        + '<div class="doc-actions"><button class="btn sm ghost danger" data-drop="'+idx+'">Écarter ce document</button></div>'
        + "</div></div>";
    }).join("")
    + '<button class="btn pri" id="iSave" style="width:100%;justify-content:center;margin-top:6px">Enregistrer dans le classeur</button>';

  const host = $("#iOut");
  function sync(){
    host.querySelectorAll(".result").forEach(r=>{
      const sel = r.querySelector('[data-f="chap"]');
      r.querySelector("[data-newchap]").classList.toggle("hide", sel.value!=="__new");
    });
  }
  host.querySelectorAll('[data-f="chap"]').forEach(s=>s.onchange=sync); sync();
  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{ b.closest(".result").remove(); });

  $("#iSave").onclick = async ()=>{
    const cards = Array.from(host.querySelectorAll(".result"));
    if(!cards.length){ toast("Plus rien à enregistrer"); return; }
    let n = 0;
    for(const r of cards){
      const g = f => r.querySelector('[data-f="'+f+'"]');
      let chapId = g("chap").value;
      if(chapId==="__new"){
        const t = g("newtitre").value.trim() || "Chapitre sans titre";
        const exist = chapsOf(mid).find(c=>c.titre.toLowerCase()===t.toLowerCase());
        if(exist) chapId = exist.id;
        else{
          const num = chapsOf(mid).reduce((x,c)=>Math.max(x,Number(c.numero)||0),0)+1;
          const nc = { id:uid(), matiereId:mid, titre:t, numero:num, statut:"encours", note:"" };
          state.chapitres.push(nc); chapId = nc.id;
        }
      }
      const it = { id:uid(), matiereId:mid, chapitreId:chapId, type:g("type").value,
        titre:g("titre").value.trim()||"Document", contenu:g("contenu").value, source:"photo", date:new Date().toISOString() };
      state.items.push(it); await saveItem(it); state.openChaps.add(chapId); n++;
    }
    await saveStructure();
    state.selMat = mid; closeModal(); render();
    toast(n + " document(s) classé(s)");
  };
}

/* =========================================================
   PROGRAMME — le squelette du semestre
   Le syllabus du prof devient la liste des chapitres. Chaque chapitre
   peut ensuite recevoir un aperçu généré, ancré dans des sources que
   l'étudiant peut ouvrir et vérifier lui-même.
   ========================================================= */
const SCHEMA_PROGRAMME = {
  type:"object",
  properties:{
    chapitres:{ type:"array", items:{
      type:"object",
      properties:{
        numero:{type:"integer"},
        titre:{type:"string"},
        objectifs:{type:"array", items:{type:"string"}},
        notions:{type:"array", items:{type:"string"}},
        periode:{type:"string"}
      },
      required:["numero","titre","objectifs","notions","periode"],
      additionalProperties:false }}
  },
  required:["chapitres"],
  additionalProperties:false
};

function openProgramme(mid){
  mid = mid || state.selMat;
  if(!state.matieres.length){ openMatieresModal(); return; }

  modal('<div class="modal-head"><h2>Programme du semestre</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><div class="stack">'
    + '<div><label class="lab" for="pgM">Matière</label><select class="field" id="pgM">'
    +   state.matieres.map(m=>'<option value="'+m.id+'"'+(m.id===mid?" selected":"")+">"+esc(m.nom)+"</option>").join("")
    + "</select></div>"
    + '<div><label class="lab" for="pgTxt">Colle ici le programme donné par ton prof</label>'
    +   '<textarea class="field" id="pgTxt" rows="10" placeholder="Plan du cours, liste des séances, thèmes, dates… tel que tu l\'as reçu. Le format n\'a pas d\'importance."></textarea>'
    +   '<div style="margin-top:8px"><button class="btn fantome sm" id="pgFichierBtn">Ou déposer le programme (PDF, texte)</button>'
    +   '<input type="file" id="pgFichier" accept=".pdf,.txt,.md,.csv" class="sr"></div>'
    +   '<p class="note" style="margin-top:8px">Chaque élément deviendra un chapitre de ta matière. Tes chapitres existants ne sont pas touchés : '
    +   'si un titre correspond déjà, il est laissé tel quel.</p></div>'
    + '<div id="pgOut"></div>'
    + "</div></div>"
    + '<div class="modal-foot"><span class="note" id="pgEtat"></span><div style="flex:1"></div>'
    + '<button class="btn" data-x>Annuler</button><button class="btn pri" id="pgGo">Structurer</button></div>', {wide:true, sticky:true});

  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  $("#pgTxt").focus();

  // Le programme arrive souvent en PDF plutôt qu'en copier-coller. On en extrait
  // la couche de texte et on la verse dans le champ : l'étudiant voit ce qui a été
  // lu et peut le corriger avant de structurer.
  $("#pgFichierBtn").onclick = ()=> $("#pgFichier").click();
  $("#pgFichier").onchange = async e=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const etat = $("#pgEtat");
    try{
      let txt = "";
      if(/\.pdf$/i.test(f.name) || f.type === "application/pdf"){
        etat.textContent = "Lecture du PDF…";
        const r = await lirePDF(f, { onEtat:(i,n)=>{ etat.textContent = "Lecture du PDF — page "+i+"/"+n; } });
        txt = r.pages.map(p=>p.texte || "").join("\n").trim();
        if(!txt){
          etat.textContent = "";
          toast("Ce PDF est scanné : aucun texte à extraire. Passe par « Importer » pour le faire lire en image.", 6000);
          return;
        }
        if(r.scannees) toast(r.scannees + " page(s) sans texte ont été ignorées.", 4500);
      }else{
        txt = (await f.text()).trim();
      }
      const champ = $("#pgTxt");
      champ.value = (champ.value.trim() ? champ.value.trim() + "\n\n" : "") + txt;
      etat.textContent = "";
      toast("Programme chargé depuis « " + f.name + " » — relis-le avant de structurer.", 5000);
    }catch(err){
      etat.textContent = "";
      toast("Lecture impossible : " + (err && err.message ? err.message : "erreur"), 5000);
    }
  };

  $("#pgGo").onclick = async ()=>{
    const txt = $("#pgTxt").value.trim(), mid2 = $("#pgM").value;
    if(!txt){ toast("Colle d'abord le programme"); return; }
    if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
    const btn = $("#pgGo"); btn.disabled = true;
    const ch = chantier($("#pgEtat"), "Lecture du programme", { delai: 120000 });
    try{
      const m = matById(mid2);
      const res = await iaJson({
        signal: ch.signal,
        system: NIVEAU,
        messages: [{ role:"user", content:
          "Voici le programme d'un semestre en « " + (m?m.nom:"?") + " », tel que le professeur l'a communiqué.\n\n"
          + txt.slice(0,60000) + "\n\n"
          + REGLE_THEME + "\n\n"
          + "Transforme-le en une liste ordonnée de THÈMES. Règles :\n"
          + "- un thème par notion enseignée ; si deux séances consécutives poursuivent la même notion, "
          + "elles forment UN seul thème ;\n"
          + "- \"titre\" reprend les mots de contenu du programme, sans les reformuler ni les enjoliver, mais "
          + "DÉBARRASSÉS de leur étiquette de calendrier : « Séance 4 — La fonction de consommation » devient "
          + "« La fonction de consommation ». Si une ligne ne porte qu'une étiquette et aucun contenu, déduis le "
          + "titre des notions listées en dessous ;\n"
          + "- \"objectifs\" : 1 à 3 compétences visées, formulées à l'infinitif, uniquement si le programme les indique ou les implique clairement ;\n"
          + "- \"notions\" : les termes techniques cités dans le programme pour ce chapitre ;\n"
          + "- \"periode\" : c'est ICI que va l'étiquette d'origine — « Séance 4 », « Semaine 3 », une date — "
          + "telle que le programme l'écrit, sinon une chaîne vide.\n"
          + "N'invente aucun thème absent du programme." }],
        // Structurer un plan est une extraction, pas un raisonnement :
        // l'effort minimal suffit et raccourcit nettement l'attente.
        schema: SCHEMA_PROGRAMME, effort: "low", maxTokens: 8000
      });
      ch.fini();
      const chaps = (res && res.chapitres) || [];
      if(!chaps.length){ $("#pgEtat").textContent = "Aucun chapitre identifié."; btn.disabled = false; return; }
      $("#pgEtat").textContent = chaps.length + " chapitre(s) identifié(s)";
      apercuProgramme(chaps, mid2);
    }catch(e){
      ch.fini();
      $("#pgEtat").textContent = msgErreur(e);
      btn.disabled = false;
    }
  };
}

function apercuProgramme(chaps, mid){
  const existants = chapsOf(mid);
  const host = $("#pgOut");
  host.innerHTML = '<h3 style="font-size:15px;margin:14px 0 10px">Vérifie avant de créer</h3>'
    + chaps.map((c,i)=>{
        const doublon = existants.find(x=>x.titre.toLowerCase().trim() === String(c.titre||"").toLowerCase().trim());
        return '<div class="result" data-pg="'+i+'">'
          + '<div class="result-head">'
          +   '<input value="'+esc(c.titre||"")+'" data-f="titre" aria-label="Titre du chapitre">'
          +   '<input class="field" style="width:64px;padding:5px 8px" type="number" value="'+esc(c.numero||i+1)+'" data-f="numero" aria-label="Numéro">'
          + "</div>"
          + '<div class="result-body">'
          +   (doublon ? '<p class="note" style="color:var(--attention);margin-bottom:8px">Ce chapitre existe déjà — il sera ignoré.</p>' : "")
          +   (c.periode ? '<p class="note" style="margin-bottom:6px">'+esc(c.periode)+"</p>" : "")
          +   (c.notions && c.notions.length ? '<div class="chap-meta" style="margin-bottom:8px">'
                + c.notions.slice(0,8).map(n=>'<span class="pill type">'+esc(n)+"</span>").join("") + "</div>" : "")
          +   (c.objectifs && c.objectifs.length ? '<ul style="margin:0;padding-left:18px;font-size:13.5px;color:var(--texte-2)">'
                + c.objectifs.map(o=>"<li>"+esc(o)+"</li>").join("") + "</ul>" : "")
          +   '<div class="doc-actions"><button class="btn sm fantome danger" data-drop="'+i+'">Écarter</button></div>'
          + "</div></div>";
      }).join("")
    + '<button class="btn pri large" id="pgSave" style="margin-top:6px">Créer ces chapitres</button>';

  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>b.closest(".result").remove());

  $("#pgSave").onclick = async ()=>{
    const cartes = Array.from(host.querySelectorAll(".result"));
    let n = 0;
    for(const r of cartes){
      const idx = Number(r.dataset.pg);
      const src = chaps[idx] || {};
      const titre = r.querySelector('[data-f="titre"]').value.trim();
      if(!titre) continue;
      if(chapsOf(mid).some(x=>x.titre.toLowerCase().trim() === titre.toLowerCase())) continue;
      state.chapitres.push({
        id: uid(), matiereId: mid, titre,
        numero: Number(r.querySelector('[data-f="numero"]').value) || (n+1),
        statut: "nouveau", note: src.periode || "",
        origine: "programme",
        objectifs: src.objectifs || [],
        notions: src.notions || []
      });
      n++;
    }
    await saveStructure();
    state.selMat = mid;
    closeModal();
    aller("matiere", { mat: mid });
    toast(n ? n + " chapitre(s) créé(s)" : "Aucun nouveau chapitre");
  };
}

/* Aperçu d'un chapitre à venir : ancré dans des sources vérifiables. */
async function preparerChapitre(cid){
  const c = chapById(cid); if(!c) return;
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
  const m = matById(c.matiereId);
  const ancre = IA.mode === "api" && IA.fournisseur === "gemini";

  showPanel(); state.tab = "analyse";
  $("#panelBody").innerHTML = '<div class="card"><div id="pcEtat"></div>'
    + '<div class="prose" id="liveOut" style="margin-top:10px"></div></div>';
  const ch = chantier($("#pcEtat"), ancre ? "Recherche et rédaction" : "Rédaction de l'aperçu", { delai: 180000 });

  const sources = [];
  let avecAncrage = ancre;

  const demander = (rech) => iaTexte({
      system: NIVEAU + "\n\nTu prépares un étudiant à un chapitre qu'il n'a pas encore suivi. "
        + "Tu n'inventes pas le cours du professeur : tu donnes le contenu standard du sujet, "
        + "en signalant ce qui peut varier d'un enseignement à l'autre.",
      messages: [{ role:"user", content:
        "Matière : " + (m?m.nom:"?") + "\nChapitre : " + c.titre
        + (c.notions && c.notions.length ? "\nNotions annoncées par le programme : " + c.notions.join(", ") : "")
        + (c.objectifs && c.objectifs.length ? "\nObjectifs annoncés : " + c.objectifs.join(" ; ") : "")
        + "\n\nRédige un aperçu en markdown, structuré ainsi :\n"
        + "## Ce que ce chapitre établit — 3 à 5 phrases sur le raisonnement d'ensemble.\n"
        + "## Notions à maîtriser — chaque terme suivi d'une définition d'une ligne, au niveau 1re année.\n"
        + "## Prérequis — ce qu'il faut déjà savoir pour suivre.\n"
        + "## Méthodes et formules — s'il y en a, énoncées précisément.\n"
        + "## Exercices types — 3 énoncés représentatifs, avec la démarche de résolution, sans le calcul complet.\n"
        + "## Pièges classiques — les erreurs fréquentes sur ce chapitre.\n\n"
        + (rech ? "Appuie-toi sur des sources en ligne fiables (universités, manuels de référence, cours publics) et cite-les.\n" : "")
        + "Sois rigoureux : ce document sert à un étudiant d'école de commerce, pas à un lycéen. "
        + "Si une notion admet plusieurs conventions, dis-le explicitement." }],
      effort: "high", maxTokens: 12000, recherche: rech, sources, signal: ch.signal,
      onText: t=>{ const el = $("#liveOut"); if(el) el.textContent = t; }
    });

  try{
    let texte;
    try{
      texte = await demander(ancre);
    }catch(e){
      // La recherche web n'est pas disponible pour ce modèle : on produit
      // quand même l'aperçu, sans ancrage, et on le signalera.
      if(ancre && e && (e.code === "recherche_refusee" || e.code === "invalid_request")){
        avecAncrage = false;
        sources.length = 0;
        const el = $("#liveOut"); if(el) el.textContent = "";
        toast("Recherche web indisponible — rédaction sans sources", 3000);
        texte = await demander(false);
      }else throw e;
    }

    let contenu = texte;
    if(sources.length){
      contenu += "\n\n## Sources\n" + sources.slice(0,10)
        .map(s=>"- ["+String(s.titre).replace(/[\[\]]/g,"")+"]("+s.url+")").join("\n");
    }

    const it = { id:uid(), matiereId:c.matiereId, chapitreId:cid, type:"apercu",
      titre:"Aperçu — "+c.titre, contenu, source:"ia", ancre: sources.length>0,
      date:new Date().toISOString() };
    ch.fini();
    state.items.push(it); await saveItem(it);
    state.openDocs.add(it.id);
    aller("chapitre", { chap:cid, mat:c.matiereId });
    toast(sources.length ? "Aperçu créé — " + sources.length + " source(s)"
        : (ancre && !avecAncrage) ? "Aperçu créé, sans sources : recherche web indisponible"
        : "Aperçu créé");
  }catch(e){ ch.fini(); iaError(e); renderPanel(); }
}

    return cs.length ? cs.map(c=>'<option value="'+c.id+'">'+esc(c.titre)+"</option>").join("")

  $("#enGo").onclick = ()=>{

      + "\n\n(Aucun document importé pour ce thème : appuie-toi sur le contenu standard du sujet.)";

  try{
    const texte = await iaTexte({
      system: NIVEAU + "\n\nTu fabriques des exercices d'entraînement. Tu ne testes que ce qui est "
        + "effectivement traité dans les documents fournis : ni plus difficile, ni hors-programme.",
      messages: [{ role:"user", content:
        base + "\n\n"
        + refAnnales + "Rédige une série d'entraînement sur le thème « " + c.titre + " » en markdown, structurée ainsi :\n"
        + "## Énoncés\n"
        + "Six exercices numérotés, de difficulté croissante : deux d'application directe, trois de "
        + "raisonnement, un plus exigeant qui combine plusieurs notions du thème.\n"
        + "## Corrigés\n"
        + "Pour chaque exercice, la démarche détaillée étape par étape, puis le résultat. Montre le "
        + "raisonnement, pas seulement la réponse.\n"
        + "## Ce que chaque exercice vérifie\n"
        + "Une ligne par exercice, nommant la notion testée.\n\n"
        + (ancre
            ? "IMPÉRATIF : reprends EXACTEMENT les notations, symboles, conventions et vocabulaire des "
              + "documents ci-dessus — c'est ainsi que le professeur les écrit. N'introduis aucune notion "
              + "absente de ces documents. Si les documents contiennent déjà des exercices, inspire-t'en "
              + "pour le style et le niveau, mais propose des énoncés NOUVEAUX, avec d'autres valeurs.\n"
            : "")
        + "Formules en LaTeX entre $…$, tableaux en markdown. Les valeurs numériques doivent tomber juste "
        + "ou presque : refais chaque calcul avant d'écrire le corrigé. N'invente aucune formule ni définition "
        + "absente des documents ; si le cours fourni contient une erreur, signale-la." }],
      effort: "high", maxTokens: 16000, signal: ch.signal,
      onText: t=>{ const el = $("#liveOut"); if(el) el.textContent = t; }
    });

    const it = { id:uid(), matiereId:c.matiereId, chapitreId:cid, type:"entrainement",
      titre:"Entraînement — " + c.titre, contenu: texte, source:"ia", ancre,
      date:new Date().toISOString() };
    ch.fini();
    state.items.push(it); await saveItem(it);
    state.openDocs.add(it.id);
    aller("chapitre", { chap:cid, mat:c.matiereId });
    toast(ancre ? "Exercices créés à partir de tes " + its.length + " document(s)"
                : "Exercices créés — aucun document dans ce thème, contenu générique");
  }catch(e){ ch.fini(); iaError(e); renderPanel(); }

/* =========================================================
   MODE ÉVALUATION — préparer une épreuve pour de vrai
   L'idée de Hugo : les annales de la matière disent la FORME que prend
   l'épreuve (structure, type de questions, barème, durée), et les documents
   du thème disent le FOND. On croise les deux, au lieu de produire une fiche
   de révision générique qui ne ressemble à aucun sujet réel.
   ========================================================= */
/* Pertinence d'un document face à la description que l'étudiant fait de son
   épreuve. Recherche locale, sans appel au modèle : instantanée, et surtout
   reproductible — deux lancements identiques donnent la même sélection. */
const sansTexte = i => !!(i && (i.scan || /^\*\(Ce PDF est un scan/.test(String(i.contenu||""))));

function motsUtiles(txt){
  const vides = new Set(("le la les de des du un une et ou a à au aux en dans sur pour par avec sans "
    + "ce cet cette ces son sa ses est sont être avoir que qui quoi dont où il elle on nous vous ils "
    + "elles se sa mes mon ma tes ton ta plus moins tout tous toute toutes chapitre partie cours "
    + "seance séance exercice examen sujet the of and to in for on a an is are").split(" "));
  return [...new Set(String(txt||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .split(/[^a-z0-9]+/)
    .filter(m=>m.length>2 && !vides.has(m)))];
}

function scorePertinence(it, mots, titresThemes){
  if(!mots.length) return 1;
  const titre = (it.titre||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const corps = (it.contenu||"").slice(0,6000).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const theme = (titresThemes[it.chapitreId]||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  let s = 0;
  for(const m of mots){
    if(titre.indexOf(m) >= 0) s += 6;      // le titre est le signal le plus sûr
    if(theme.indexOf(m) >= 0) s += 4;
    if(corps.indexOf(m) >= 0) s += 1;
  }
  return s;
}

/* Les annales donnent la FORME de l'épreuve : structure, type de questions,
   barème. On les rassemble à part du contenu, et on privilégie celles qui
   parlent du sujet annoncé. */
function annalesDe(mid, mots, titresThemes, maxChars){
  let an = state.items.filter(i => i.type === "annale" && !sansTexte(i) && (!mid || i.matiereId === mid));
  if(!an.length) return { texte:"", nb:0, titres:[] };
  an = an.map(i=>({ i, s: scorePertinence(i, mots, titresThemes) }))
         .sort((a,b)=>b.s-a.s).slice(0,12).map(x=>x.i);
  // Budget large : les annales transcrites portent énoncé, barème et corrigé vérifié ;
  // tronquer à ~1 800 caractères par sujet ne laissait voir que l'énoncé.
  const budget = maxChars || 60000;
  const part = Math.max(900, Math.floor(budget / an.length));
  let txt = "";
  an.forEach(i=>{
    const c = String(i.contenu || "");
    txt += "\n=== SUJET : " + (i.titre || "sans titre") + " ===\n"
        + (c.length > part ? c.slice(0, part) + "\n[…]" : c) + "\n";
  });
  return { texte: txt.slice(0, budget + 400), nb: an.length, titres: an.map(i=>i.titre) };
}

    +   '<p class="note" style="margin-top:6px">L\'agent cherche dans <b>tous</b> tes documents ceux qui s\'en rapprochent — '
