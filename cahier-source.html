    +   "<em>Force la lecture d'image sur toutes les pages du PDF. À cocher si tes traits au stylo "
    +   "ne ressortent pas — sinon l'outil les détecte tout seul.</em></span></label>"
    + '<div><label class="lab" for="iHint">Précision facultative</label>'
    +   '<input class="field" id="iHint" placeholder="Ex. « TD du 3 octobre, suite du chapitre 2 »"></div>'
    + '<p class="note">Les pages qui se suivent sont regroupées en un seul document ; cours, exercices et corrigés sont séparés automatiquement.</p>'
    + '<div id="iOut"></div>'
    + "</div></div>"
    + '<div class="modal-foot"><span class="note" id="iState"></span><div style="flex:1"></div>'
    + '<button class="btn" data-x>Fermer</button><button class="btn pri" id="iGo" disabled>Analyser</button></div>', {wide:true, sticky:true});

  const files = [], drop = $("#drop"), input = $("#files");
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  if(drop && input){
    drop.onclick = ()=>input.click();
    drop.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("hot"); }));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("hot"); }));
    drop.addEventListener("drop", e=>add(e.dataTransfer.files));
    input.onchange = ()=>add(input.files);
  }
  $("#iPaste").oninput = paint;
  $("#iPaste").focus();

  function add(list){
    for(const f of list){
      if(files.length >= (maxN||8)+6){ toast("Trop de fichiers d'un coup"); break; }
      files.push(f);
    }
    paint();
  }
  function paint(){
    const host = $("#thumbs");
    host.innerHTML = files.map((f,idx)=>'<div class="thumb">'
      + (f.type.startsWith("image/") ? '<img alt="" src="'+URL.createObjectURL(f)+'">' : '<div class="doc-ic">'+esc(f.name.slice(0,24))+"</div>")
      + '<button class="x" data-rm="'+idx+'" aria-label="Retirer">✕</button></div>').join("");
    host.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ files.splice(Number(b.dataset.rm),1); paint(); });
    const imgs = files.filter(f=>f.type.startsWith("image/")).length;
    const colle = $("#iPaste").value.trim();
    $("#iGo").disabled = !files.length && !colle;
    $("#iState").textContent = files.length ? files.length+" fichier(s)"+(imgs>maxN?" — "+imgs+" images, max "+maxN+" par analyse":"")
                             : (colle ? (colle.length<1000 ? colle.length+" caractères collés"
                                                           : (colle.length/1000).toFixed(1).replace(".",",")+" k caractères collés") : "");
  }
  paint();

  $("#iGo").onclick = ()=>lancerImport(files, $("#iM").value, $("#iHint").value.trim(), maxN,
    $("#iPaste").value.trim(), $("#iAnnot") && $("#iAnnot").checked);
}

const SCHEMA_IMPORT = {
  type:"object",
  properties:{
    documents:{ type:"array", items:{
      type:"object",
      properties:{
        titre:{type:"string"},
        type:{type:"string", enum:["cours","td","exercice","fiche","annale","note"]},
        chapitreId:{type:"string"},
        chapitreTitre:{type:"string"},
        chapitreNumero:{type:"integer"},
        pages:{type:"string"},
        transcription:{type:"string"},
        concepts:{type:"array", items:{type:"string"}},
        incertitudes:{type:"array", items:{type:"string"}}
      },
      required:["titre","type","chapitreId","chapitreTitre","chapitreNumero","pages","transcription","concepts","incertitudes"],
      additionalProperties:false }}
  },
  required:["documents"],
  additionalProperties:false
};

async function lancerImport(files, mid, hint, maxN, colle, toutAnnote){
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir ⚙ Réglages."); return; }
  const estPDF = f => /\.pdf$/i.test(f.name) || f.type === "application/pdf";
  const imgs = files.filter(f=>f.type.startsWith("image/"));
  const pdfs = files.filter(estPDF);
  const txts = files.filter(f=>!f.type.startsWith("image/") && !estPDF(f));
  if(imgs.length && !IA.vision && !colle && !pdfs.length){
    toast("La lecture des photos n'est pas active ici — voir ⚙ Réglages.", 4500); return;
  }
  if(imgs.length > maxN){ toast("Maximum "+maxN+" images par analyse — retires-en quelques-unes."); return; }

  const btn = $("#iGo"); btn.disabled = true;
  const ch = chantier($("#iState"), "Lecture des documents", { delai: 600000 });

  let annexes = "";
  for(const f of txts){
    if(!TXT_EXT.test(f.name) && !f.type.startsWith("text/")){ toast("Format non lisible : "+f.name); continue; }
    try{ annexes += "\n\n=== FICHIER JOINT : "+f.name+" ===\n" + (await f.text()).slice(0,18000); }catch(e){}
  }

  /* ----- PDF : couche de texte d'abord, lecture d'image en dernier ----- */
  let textePDF = "", bilanPDF = [], restant = 0;
  try{
    for(const f of pdfs){
      const lu = await lirePDF(f, { signal: ch.signal, toutAnnote,
        onEtat: (i,n)=>{ const e=$("#iState"); if(e && e.querySelector(".thinking"))
          e.querySelector(".thinking").innerHTML = "<i></i>" + esc(f.name) + " — page " + i + "/" + n; } });

      // Toute page sans couche de texte, ou portant des traces manuscrites,
      // demande une lecture d'image. Le plafond borne la dépense : au-delà,
      // les pages restantes gardent leur texte imprimé sans les annotations.
      const aLire = lu.pages.filter(p=>p.scan || p.annotee);
      if(aLire.length && IA.vision){
        const plafond = Math.min(aLire.length, PLAFOND_PAGES_IMAGE);
        for(let k = 0; k < plafond; k++){
          const pg = aLire[k], e = $("#iState");
          if(e && e.querySelector(".thinking"))
            e.querySelector(".thinking").innerHTML = "<i></i>" + esc(f.name) + " — page " + pg.num
              + " " + (pg.scan ? "scannée" : "annotée") + " (" + (k+1) + "/" + plafond + ")";
          try{
            pg.texte = pg.scan
              ? await ocrPagePDF(pg.page, ch.signal)
              : await lirePageAnnotee(pg.page, pg.texte, ch.signal);
          }catch(e2){ /* on garde le texte extrait : mieux vaut sans annotations que rien */ }
        }
        if(aLire.length > plafond) restant += aLire.length - plafond;
      }

      const utiles = lu.pages.filter(p=>p.texte);
      textePDF += "\n\n=== DOCUMENT : " + f.name + " ===\n"
        + utiles.map(p=>"\n[page " + p.num + "]\n" + p.texte).join("\n");
      bilanPDF.push(f.name + " : " + lu.total + " page" + (lu.total>1?"s":"")
        + (lu.scannees ? ", " + lu.scannees + " scannée" + (lu.scannees>1?"s":"") : "")
        + (lu.annotees ? ", " + lu.annotees + " annotée" + (lu.annotees>1?"s":"") + " à la main" : "")
        + (!lu.scannees && !lu.annotees ? ", texte pur" : ""));
    }
  }catch(e){
    ch.fini();
    $("#iState").innerHTML = '<b style="color:var(--alerte)">' + esc(
      e && e.code === "pdf_indispo" ? e.message : msgErreur(e)) + "</b>";
    btn.disabled = false;
    return;
  }

  $("#iOut").innerHTML = bilanPDF.length
    ? '<div class="card"><h4>PDF lus</h4><p class="note">' + esc(bilanPDF.join(" · ")) + "</p>"
      + (restant ? '<p class="note" style="color:var(--attention);margin-top:8px">'
          + restant + " page(s) au-delà du plafond de " + PLAFOND_PAGES_IMAGE
          + " : leur texte imprimé est bien repris, mais pas les annotations manuscrites. "
          + "Découpe le PDF pour les récupérer.</p>" : "")
      + "</div>"
    : '<div class="card"><p class="note">L\'agent lit chaque page, retranscrit intégralement et identifie de quel chapitre il s\'agit.</p></div>';

  const m = matById(mid), cs = chapsOf(mid);
  const liste = cs.length ? cs.map(c=>'- id "'+c.id+'" · Ch. '+(c.numero||"?")+" — "+c.titre).join("\n") : "(aucun chapitre existant)";

  const avecImages = imgs.length > 0 && IA.vision;

  const prompt = "Tu retranscris et classes des documents de cours de la matière « " + (m?m.nom:"?") + " ».\n"
    + (avecImages ? "Les "+imgs.length+" image(s) jointes sont des photos de notes manuscrites, de polycopiés, de tableaux ou de slides, dans l'ordre où elles ont été prises.\n" : "")
    + (hint ? "Précision donnée par l'étudiant : « "+hint+" ».\n" : "")
    + "\nCHAPITRES DÉJÀ EXISTANTS dans cette matière :\n" + liste + "\n"
    + (colle ? "\nTEXTE FOURNI PAR L'ÉTUDIANT :\n" + colle.slice(0,34000) + "\n" : "")
    + (annexes ? "\nCONTENU DES FICHIERS JOINTS :" + annexes + "\n" : "")
    + "\nTravail à faire :\n"
    + "1. RETRANSCRIS intégralement chaque document, en suivant ces règles de lecture :\n"
    + (avecImages ? consigneVision("").split("RESTITUE LE TEXTE")[1].split("RENDU")[0].trim() + "\n"
                  : "Tout le texte, titres, numérotation, définitions, formules (LaTeX entre $…$), tableaux (markdown). "
                    + "Ne résume pas, ne saute rien, n'invente rien. Marque `[illisible]` là où tu n'es pas sûr.\n")
    + "2. REGROUPE les pages qui se suivent et appartiennent au même document en une seule entrée ; SÉPARE en entrées distinctes ce qui est de nature différente (cours / exercices / corrigé) ou d'un chapitre différent.\n"
    + "3. CLASSE chaque entrée : réutilise l'id d'un chapitre existant si le contenu y correspond, sinon propose un nouveau chapitre.\n\n"
    + 'Réponds UNIQUEMENT avec ce JSON :\n'
    + '{"documents":[{"titre":"titre court et explicite","type":"cours|td|exercice|fiche|annale|note",'
    + '"chapitreId":"id d\'un chapitre existant, ou chaîne vide pour un nouveau chapitre",'
    + '"chapitreTitre":"titre du chapitre (existant ou proposé)","chapitreNumero":3,'
    + '"pages":"1-2","transcription":"le document complet en markdown","concepts":["notion 1"],"incertitudes":["passage illisible ou douteux"]}]}';

  const appeler = (withImages, tranche, dejaProposes) => iaJson({
    system: NIVEAU,
    messages: [{ role:"user", content: prompt
      + (tranche ? "\n\nTEXTE EXTRAIT DES PDF (tranche à traiter) :\n" + tranche + "\n" : "")
      + (dejaProposes && dejaProposes.length
          ? "\nChapitres déjà proposés pour les tranches précédentes de ce même document — "
            + "réutilise exactement ces titres quand le contenu s'y rattache, au lieu d'en créer des variantes :\n- "
            + dejaProposes.join("\n- ") + "\n"
          : "") }],
    images: withImages ? imgs : null,
    schema: SCHEMA_IMPORT,
    effort: "medium",
    maxTokens: 32000,
    signal: ch.signal
  });

  try{
    let docs = [];

    if(textePDF.trim()){
      // Un poly de 80 pages dépasse largement ce qu'un seul appel peut lire :
      // on le traite par tranches, en transmettant les chapitres déjà proposés
      // pour que le découpage reste cohérent d'une tranche à l'autre.
      const tranches = decouper(textePDF.trim(), 28000);
      const proposes = [];
      for(let i = 0; i < tranches.length; i++){
        const e = $("#iState");
        if(e) e.innerHTML = '<span class="thinking"><i></i>Classement — tranche ' + (i+1)
          + "/" + tranches.length + "</span>";
        const r = await appeler(i === 0 && avecImages, tranches[i], proposes);
        for(const d of (r && r.documents) || []){
          docs.push(d);
          const t = String(d.chapitreTitre || "").trim();
          if(t && proposes.indexOf(t) < 0) proposes.push(t);
        }
      }
    }else{
      let res;
      try{
        res = await appeler(avecImages);
      }catch(e){
        if(e && e.code === "images_unavailable" && avecImages){
          imagesKO = true; majMode();
          if(colle || annexes){
            $("#iState").innerHTML = '<span class="thinking"><i></i>Photos refusées — reprise sur le texte seul…</span>';
            res = await appeler(false);
          }else{
            throw e;
          }
        }else throw e;
      }
      docs = (res && res.documents) || [];
    }

    ch.fini();
    if(!docs.length){ $("#iState").textContent = "Rien n'a pu être lu."; btn.disabled=false; return; }
    $("#iState").textContent = docs.length + " document(s) reconnu(s)" + (!avecImages && imgs.length ? " — photos ignorées" : "");
    afficherResultats(docs, mid);
  }catch(e){
    ch.fini();
    $("#iState").textContent = msgErreur(e);
    $("#iOut").innerHTML = (e && (e.code === "images_unavailable" || e.code === "not_granted"))
      ? '<div class="card" style="border-color:var(--warn)"><h4 style="color:var(--warn)">Activer la lecture des photos</h4>'
        + '<p class="note">Ouvre ⚙ Réglages et enregistre ta clé API : l\'OCR tourne alors directement dans l\'outil, sans intermédiaire. '
        + 'En attendant, colle le texte dans le champ ci-dessus — le tri et le classement fonctionnent normalement.</p></div>'
      : "";
    btn.disabled = false;
  }
}

function afficherResultats(docs, mid){
  const cs = chapsOf(mid);
  $("#iOut").innerHTML = '<h3 style="font-family:var(--serif);font-size:16px;margin:16px 0 10px">Vérifie avant d\'enregistrer</h3>'
    + docs.map((d,idx)=>{
      const chapOpts = cs.map(c=>'<option value="'+c.id+'"'+(c.id===d.chapitreId?" selected":"")+">Ch. "+esc(c.numero||"?")+" — "+esc(c.titre)+"</option>").join("")
        + '<option value="__new"'+(!d.chapitreId?" selected":"")+">+ Nouveau : "+esc(d.chapitreTitre||"sans titre")+"</option>";
      return '<div class="result" data-r="'+idx+'">'
        + '<div class="result-head"><input value="'+esc(d.titre||"Document")+'" data-f="titre" aria-label="Titre"></div>'
        + '<div class="result-body"><div class="grid2" style="margin-bottom:10px">'
        +   '<div><label class="lab">Chapitre</label><select class="field" data-f="chap">'+chapOpts+"</select></div>"
        +   '<div><label class="lab">Type</label><select class="field" data-f="type">'
        +     Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(d.type===k?" selected":"")+">"+TYPES[k]+"</option>").join("")+"</select></div>"
        + "</div>"
        + '<div class="hide" data-newchap><label class="lab">Titre du nouveau chapitre</label>'
        +   '<input class="field" data-f="newtitre" value="'+esc(d.chapitreTitre||"")+'" style="margin-bottom:10px"></div>'
        + (d.concepts && d.concepts.length ? '<div class="chap-meta" style="margin-bottom:8px">'+d.concepts.slice(0,8).map(c=>'<span class="pill type">'+esc(c)+"</span>").join("")+"</div>" : "")
        + (d.incertitudes && d.incertitudes.length ? '<p class="note" style="color:var(--warn);margin-bottom:8px">À vérifier : '+esc(d.incertitudes.join(" · "))+"</p>" : "")
        + '<label class="lab">Retranscription '+(d.pages?"(pages "+esc(d.pages)+")":"")+"</label>"
        + '<textarea class="field" data-f="contenu" rows="9" style="font-family:var(--mono);font-size:12.5px">'+esc(d.transcription||"")+"</textarea>"
        + '<div class="doc-actions"><button class="btn sm ghost danger" data-drop="'+idx+'">Écarter ce document</button></div>'
        + "</div></div>";
    }).join("")
    + '<button class="btn pri" id="iSave" style="width:100%;justify-content:center;margin-top:6px">Enregistrer dans le classeur</button>';

  const host = $("#iOut");
  function sync(){
    host.querySelectorAll(".result").forEach(r=>{
      const sel = r.querySelector('[data-f="chap"]');
      r.querySelector("[data-newchap]").classList.toggle("hide", sel.value!=="__new");
    });
  }
  host.querySelectorAll('[data-f="chap"]').forEach(s=>s.onchange=sync); sync();
  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{ b.closest(".result").remove(); });

  $("#iSave").onclick = async ()=>{
    const cards = Array.from(host.querySelectorAll(".result"));
    if(!cards.length){ toast("Plus rien à enregistrer"); return; }
    let n = 0;
    for(const r of cards){
      const g = f => r.querySelector('[data-f="'+f+'"]');
      let chapId = g("chap").value;
      if(chapId==="__new"){
        const t = g("newtitre").value.trim() || "Chapitre sans titre";
        const exist = chapsOf(mid).find(c=>c.titre.toLowerCase()===t.toLowerCase());
        if(exist) chapId = exist.id;
        else{
          const num = chapsOf(mid).reduce((x,c)=>Math.max(x,Number(c.numero)||0),0)+1;
          const nc = { id:uid(), matiereId:mid, titre:t, numero:num, statut:"encours", note:"" };
          state.chapitres.push(nc); chapId = nc.id;
        }
      }
      const it = { id:uid(), matiereId:mid, chapitreId:chapId, type:g("type").value,
        titre:g("titre").value.trim()||"Document", contenu:g("contenu").value, source:"photo", date:new Date().toISOString() };
      state.items.push(it); await saveItem(it); state.openChaps.add(chapId); n++;
    }
    await saveStructure();
    state.selMat = mid; closeModal(); render();
    toast(n + " document(s) classé(s)");
  };
}

/* =========================================================
   PROGRAMME — le squelette du semestre
   Le syllabus du prof devient la liste des chapitres. Chaque chapitre
   peut ensuite recevoir un aperçu généré, ancré dans des sources que
   l'étudiant peut ouvrir et vérifier lui-même.
   ========================================================= */
const SCHEMA_PROGRAMME = {
  type:"object",
  properties:{
    chapitres:{ type:"array", items:{
      type:"object",
      properties:{
        numero:{type:"integer"},
        titre:{type:"string"},
        objectifs:{type:"array", items:{type:"string"}},
        notions:{type:"array", items:{type:"string"}},
        periode:{type:"string"}
      },
      required:["numero","titre","objectifs","notions","periode"],
      additionalProperties:false }}
  },
  required:["chapitres"],
  additionalProperties:false
};

function openProgramme(mid){
  mid = mid || state.selMat;
  if(!state.matieres.length){ openMatieresModal(); return; }

  modal('<div class="modal-head"><h2>Programme du semestre</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><div class="stack">'
    + '<div><label class="lab" for="pgM">Matière</label><select class="field" id="pgM">'
    +   state.matieres.map(m=>'<option value="'+m.id+'"'+(m.id===mid?" selected":"")+">"+esc(m.nom)+"</option>").join("")
    + "</select></div>"
    + '<div><label class="lab" for="pgTxt">Colle ici le programme donné par ton prof</label>'
    +   '<textarea class="field" id="pgTxt" rows="10" placeholder="Plan du cours, liste des séances, thèmes, dates… tel que tu l\'as reçu. Le format n\'a pas d\'importance."></textarea>'
    +   '<p class="note" style="margin-top:8px">Chaque élément deviendra un chapitre de ta matière. Tes chapitres existants ne sont pas touchés : '
    +   'si un titre correspond déjà, il est laissé tel quel.</p></div>'
    + '<div id="pgOut"></div>'
    + "</div></div>"
    + '<div class="modal-foot"><span class="note" id="pgEtat"></span><div style="flex:1"></div>'
    + '<button class="btn" data-x>Annuler</button><button class="btn pri" id="pgGo">Structurer</button></div>', {wide:true, sticky:true});

  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  $("#pgTxt").focus();

  $("#pgGo").onclick = async ()=>{
    const txt = $("#pgTxt").value.trim(), mid2 = $("#pgM").value;
    if(!txt){ toast("Colle d'abord le programme"); return; }
    if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
    const btn = $("#pgGo"); btn.disabled = true;
    const ch = chantier($("#pgEtat"), "Lecture du programme", { delai: 120000 });
    try{
      const m = matById(mid2);
      const res = await iaJson({
        signal: ch.signal,
        system: NIVEAU,
        messages: [{ role:"user", content:
          "Voici le programme d'un semestre en « " + (m?m.nom:"?") + " », tel que le professeur l'a communiqué.\n\n"
          + txt.slice(0,20000) + "\n\n"
          + "Transforme-le en une liste ordonnée de chapitres. Règles :\n"
          + "- un chapitre par unité d'enseignement identifiable (séance, thème, partie) ;\n"
          + "- \"titre\" reprend les mots du programme, sans les reformuler ni les enjoliver ;\n"
          + "- \"objectifs\" : 1 à 3 compétences visées, formulées à l'infinitif, uniquement si le programme les indique ou les implique clairement ;\n"
          + "- \"notions\" : les termes techniques cités dans le programme pour ce chapitre ;\n"
          + "- \"periode\" : la date ou la semaine si le programme en donne une, sinon une chaîne vide.\n"
          + "N'invente aucun chapitre absent du programme." }],
        // Structurer un plan est une extraction, pas un raisonnement :
        // l'effort minimal suffit et raccourcit nettement l'attente.
        schema: SCHEMA_PROGRAMME, effort: "low", maxTokens: 8000
      });
      ch.fini();
      const chaps = (res && res.chapitres) || [];
      if(!chaps.length){ $("#pgEtat").textContent = "Aucun chapitre identifié."; btn.disabled = false; return; }
      $("#pgEtat").textContent = chaps.length + " chapitre(s) identifié(s)";
      apercuProgramme(chaps, mid2);
    }catch(e){
      ch.fini();
      $("#pgEtat").textContent = msgErreur(e);
      btn.disabled = false;
    }
  };
}

function apercuProgramme(chaps, mid){
  const existants = chapsOf(mid);
  const host = $("#pgOut");
  host.innerHTML = '<h3 style="font-size:15px;margin:14px 0 10px">Vérifie avant de créer</h3>'
    + chaps.map((c,i)=>{
        const doublon = existants.find(x=>x.titre.toLowerCase().trim() === String(c.titre||"").toLowerCase().trim());
        return '<div class="result" data-pg="'+i+'">'
          + '<div class="result-head">'
          +   '<input value="'+esc(c.titre||"")+'" data-f="titre" aria-label="Titre du chapitre">'
          +   '<input class="field" style="width:64px;padding:5px 8px" type="number" value="'+esc(c.numero||i+1)+'" data-f="numero" aria-label="Numéro">'
          + "</div>"
          + '<div class="result-body">'
          +   (doublon ? '<p class="note" style="color:var(--attention);margin-bottom:8px">Ce chapitre existe déjà — il sera ignoré.</p>' : "")
          +   (c.periode ? '<p class="note" style="margin-bottom:6px">'+esc(c.periode)+"</p>" : "")
          +   (c.notions && c.notions.length ? '<div class="chap-meta" style="margin-bottom:8px">'
                + c.notions.slice(0,8).map(n=>'<span class="pill type">'+esc(n)+"</span>").join("") + "</div>" : "")
          +   (c.objectifs && c.objectifs.length ? '<ul style="margin:0;padding-left:18px;font-size:13.5px;color:var(--texte-2)">'
                + c.objectifs.map(o=>"<li>"+esc(o)+"</li>").join("") + "</ul>" : "")
          +   '<div class="doc-actions"><button class="btn sm fantome danger" data-drop="'+i+'">Écarter</button></div>'
          + "</div></div>";
      }).join("")
    + '<button class="btn pri large" id="pgSave" style="margin-top:6px">Créer ces chapitres</button>';

  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>b.closest(".result").remove());

  $("#pgSave").onclick = async ()=>{
    const cartes = Array.from(host.querySelectorAll(".result"));
    let n = 0;
    for(const r of cartes){
      const idx = Number(r.dataset.pg);
      const src = chaps[idx] || {};
      const titre = r.querySelector('[data-f="titre"]').value.trim();
      if(!titre) continue;
      if(chapsOf(mid).some(x=>x.titre.toLowerCase().trim() === titre.toLowerCase())) continue;
      state.chapitres.push({
        id: uid(), matiereId: mid, titre,
        numero: Number(r.querySelector('[data-f="numero"]').value) || (n+1),
        statut: "nouveau", note: src.periode || "",
        origine: "programme",
        objectifs: src.objectifs || [],
        notions: src.notions || []
      });
      n++;
    }
    await saveStructure();
    state.selMat = mid;
    closeModal();
    aller("matiere", { mat: mid });
    toast(n ? n + " chapitre(s) créé(s)" : "Aucun nouveau chapitre");
  };
}

/* Aperçu d'un chapitre à venir : ancré dans des sources vérifiables. */
async function preparerChapitre(cid){
  const c = chapById(cid); if(!c) return;
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
  const m = matById(c.matiereId);
  const ancre = IA.mode === "api" && IA.fournisseur === "gemini";

  showPanel(); state.tab = "analyse";
  $("#panelBody").innerHTML = '<div class="card"><div id="pcEtat"></div>'
    + '<div class="prose" id="liveOut" style="margin-top:10px"></div></div>';
  const ch = chantier($("#pcEtat"), ancre ? "Recherche et rédaction" : "Rédaction de l'aperçu", { delai: 180000 });

  const sources = [];
  let avecAncrage = ancre;

  const demander = (rech) => iaTexte({
      system: NIVEAU + "\n\nTu prépares un étudiant à un chapitre qu'il n'a pas encore suivi. "
        + "Tu n'inventes pas le cours du professeur : tu donnes le contenu standard du sujet, "
        + "en signalant ce qui peut varier d'un enseignement à l'autre.",
      messages: [{ role:"user", content:
        "Matière : " + (m?m.nom:"?") + "\nChapitre : " + c.titre
        + (c.notions && c.notions.length ? "\nNotions annoncées par le programme : " + c.notions.join(", ") : "")
        + (c.objectifs && c.objectifs.length ? "\nObjectifs annoncés : " + c.objectifs.join(" ; ") : "")
        + "\n\nRédige un aperçu en markdown, structuré ainsi :\n"
        + "## Ce que ce chapitre établit — 3 à 5 phrases sur le raisonnement d'ensemble.\n"
        + "## Notions à maîtriser — chaque terme suivi d'une définition d'une ligne, au niveau 1re année.\n"
        + "## Prérequis — ce qu'il faut déjà savoir pour suivre.\n"
        + "## Méthodes et formules — s'il y en a, énoncées précisément.\n"
        + "## Exercices types — 3 énoncés représentatifs, avec la démarche de résolution, sans le calcul complet.\n"
        + "## Pièges classiques — les erreurs fréquentes sur ce chapitre.\n\n"
        + (rech ? "Appuie-toi sur des sources en ligne fiables (universités, manuels de référence, cours publics) et cite-les.\n" : "")
        + "Sois rigoureux : ce document sert à un étudiant d'école de commerce, pas à un lycéen. "
        + "Si une notion admet plusieurs conventions, dis-le explicitement." }],
      effort: "high", maxTokens: 12000, recherche: rech, sources, signal: ch.signal,
      onText: t=>{ const el = $("#liveOut"); if(el) el.textContent = t; }
    });

  try{
    let texte;
    try{
      texte = await demander(ancre);
    }catch(e){
      // La recherche web n'est pas disponible pour ce modèle : on produit
      // quand même l'aperçu, sans ancrage, et on le signalera.
      if(ancre && e && (e.code === "recherche_refusee" || e.code === "invalid_request")){
        avecAncrage = false;
        sources.length = 0;
        const el = $("#liveOut"); if(el) el.textContent = "";
        toast("Recherche web indisponible — rédaction sans sources", 3000);
        texte = await demander(false);
      }else throw e;
    }

    let contenu = texte;
    if(sources.length){
      contenu += "\n\n## Sources\n" + sources.slice(0,10)
        .map(s=>"- ["+String(s.titre).replace(/[\[\]]/g,"")+"]("+s.url+")").join("\n");
    }

    const it = { id:uid(), matiereId:c.matiereId, chapitreId:cid, type:"apercu",
      titre:"Aperçu — "+c.titre, contenu, source:"ia", ancre: sources.length>0,
      date:new Date().toISOString() };
    ch.fini();
    state.items.push(it); await saveItem(it);
    state.openDocs.add(it.id);
    aller("chapitre", { chap:cid, mat:c.matiereId });
    toast(sources.length ? "Aperçu créé — " + sources.length + " source(s)"
        : (ancre && !avecAncrage) ? "Aperçu créé, sans sources : recherche web indisponible"
        : "Aperçu créé");
  }catch(e){ ch.fini(); iaError(e); renderPanel(); }
}

/* =========================================================
   RANGEMENT D'UNE MATIÈRE
   Le classement fait à l'import est aveugle au reste : il ne voit que ce
   qu'on lui donne. Après plusieurs imports, des chapitres se dédoublent et
   des documents se retrouvent au mauvais endroit. Cette passe relit toute
   la matière et propose un plan — jamais appliqué sans validation.

   Deux temps, pour que la charge reste bornée quel que soit le volume :
   d'abord consolider les chapitres (charge faible, vue d'ensemble), puis
   replacer les documents par lots contre cette structure assainie.
   ========================================================= */
const SCHEMA_TRI_CHAP = {
  type:"object",
  properties:{
    fusions:{ type:"array", items:{
      type:"object",
      properties:{ garder:{type:"string"}, absorber:{type:"array", items:{type:"string"}},
                   titre:{type:"string"}, pourquoi:{type:"string"} },
      required:["garder","absorber","titre","pourquoi"], additionalProperties:false }},
    renommages:{ type:"array", items:{
      type:"object",
      properties:{ id:{type:"string"}, titre:{type:"string"}, pourquoi:{type:"string"} },
      required:["id","titre","pourquoi"], additionalProperties:false }},
    ordre:{ type:"array", items:{type:"string"} }
  },
  required:["fusions","renommages","ordre"], additionalProperties:false
};

const SCHEMA_TRI_DOCS = {
  type:"object",
  properties:{
    deplacements:{ type:"array", items:{
      type:"object",
      properties:{ docId:{type:"string"}, versId:{type:"string"}, pourquoi:{type:"string"} },
      required:["docId","versId","pourquoi"], additionalProperties:false }},
    doublons:{ type:"array", items:{
      type:"object",
      properties:{ garder:{type:"string"}, supprimer:{type:"array", items:{type:"string"}}, pourquoi:{type:"string"} },
      required:["garder","supprimer","pourquoi"], additionalProperties:false }}
  },
  required:["deplacements","doublons"], additionalProperties:false
};

const extraitDe = (it, n) => String(it.contenu||"")
  .replace(/[#*=`>|\-]/g," ").replace(/\s+/g," ").trim().slice(0, n || 260);

/* Déplacement manuel d'un document : pour le cas isolé, sans mobiliser l'IA. */
function deplacerDoc(itemId){
  const it = state.items.find(x=>x.id===itemId);
  if(!it) return;
  const cs = chapsOf(it.matiereId);
  modal('<div class="modal-head"><h2>Déplacer le document</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><p class="note" style="margin-bottom:12px">« '+esc(it.titre||"sans titre")+' »</p>'
    + '<div class="creation-liste">'
    + cs.map(c=>'<button class="creation" data-vers="'+c.id+'"'+(c.id===it.chapitreId?' style="border-color:var(--accent)"':'')+'>'
        + '<span class="creation-ic">'+esc(c.numero!=null?String(c.numero).padStart(2,"0"):"··")+"</span>"
        + "<span><b>"+esc(c.titre)+"</b><em>"+itemsOf(c.id).length+" document"+(itemsOf(c.id).length>1?"s":"")
        + (c.id===it.chapitreId?" · emplacement actuel":"")+"</em></span></button>").join("")
    + "</div></div>");
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  document.querySelectorAll("[data-vers]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.vers !== it.chapitreId){
      it.chapitreId = b.dataset.vers;
      it.maj = new Date().toISOString();
      await saveItem(it);
      toast("Déplacé vers « " + (chapById(b.dataset.vers)||{}).titre + " »");
    }
    closeModal();
    aller("chapitre", { chap: it.chapitreId, mat: it.matiereId });
  });
}

async function rangerMatiere(mid){
  const m = matById(mid);
  if(!m) return;
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
  const cs = chapsOf(mid), its = itemsOfMat(mid);
  if(!cs.length && !its.length){ toast("Rien à ranger dans cette matière."); return; }

  modal('<div class="modal-head"><h2>Ranger « '+esc(m.nom)+' »</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><div id="trEtat"></div><div id="trOut"></div></div>'
    + '<div class="modal-foot"><button class="btn" data-x>Fermer</button>'
    + '<button class="btn pri hide" id="trGo">Appliquer</button></div>', {wide:true, sticky:true});
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);

  const ch = chantier($("#trEtat"), "Relecture de la matière", { delai: 300000 });
  const plan = { fusions:[], renommages:[], ordre:[], deplacements:[], doublons:[] };

  try{
    /* ----- temps 1 : consolider les chapitres ----- */
    if(cs.length > 1){
      const inventaire = cs.map(c=>{
        const titres = itemsOf(c.id).slice(0,6).map(i=>i.titre).join(" | ");
        return '- id "'+c.id+'" · n°'+(c.numero||"?")+' · "'+c.titre+'"'
          + " · " + itemsOf(c.id).length + " doc"
          + (titres ? " · contient : " + titres : " · vide");
      }).join("\n");

      const r1 = await iaJson({
        system: NIVEAU,
        messages:[{ role:"user", content:
          "Voici les chapitres de la matière « " + m.nom + " » d'un classeur de cours.\n\n" + inventaire + "\n\n"
          + "Repère les défauts de structure et propose un plan de rangement :\n"
          + "1. FUSIONS : deux chapitres qui désignent manifestement la même chose (« Amortissements » et « Les amortissements », "
          + "ou un chapitre créé en double lors d'un import découpé). Indique lequel garder, lesquels absorber, et le titre final. "
          + "Ne fusionne JAMAIS deux chapitres qui traitent de sujets distincts, même proches.\n"
          + "2. RENOMMAGES : uniquement si un titre est manifestement tronqué, mal orthographié, ou porte un numéro de tranche "
          + "parasite (« Partie 3 »). Sinon laisse le titre tel quel — c'est celui du professeur.\n"
          + "3. ORDRE : la liste complète des id de chapitres, dans l'ordre pédagogique logique. Conserve l'ordre existant "
          + "s'il est cohérent ; ne réordonne que si un chapitre est visiblement mal placé.\n\n"
          + "Sois conservateur : en cas de doute, ne propose rien. Un classeur mal fusionné est pire qu'un classeur imparfait." }],
        schema: SCHEMA_TRI_CHAP, effort:"high", maxTokens: 8000, signal: ch.signal
      });
      plan.fusions    = (r1 && r1.fusions) || [];
      plan.renommages = (r1 && r1.renommages) || [];
      plan.ordre      = (r1 && r1.ordre) || [];
    }

    /* ----- temps 2 : replacer les documents, par lots ----- */
    if(its.length){
      // Structure cible : après fusions et renommages proposés.
      const absorbes = new Set();
      plan.fusions.forEach(f=>(f.absorber||[]).forEach(a=>absorbes.add(a)));
      const titreFinal = id => {
        const f = plan.fusions.find(x=>x.garder === id);
        if(f && f.titre) return f.titre;
        const r = plan.renommages.find(x=>x.id === id);
        if(r && r.titre) return r.titre;
        const c = chapById(id); return c ? c.titre : "";
      };
      const cible = cs.filter(c=>!absorbes.has(c.id));
      const listeCible = cible.map(c=>'- id "'+c.id+'" · "'+titreFinal(c.id)+'"').join("\n");

      const LOT = 30;
      for(let i = 0; i < its.length; i += LOT){
        const lot = its.slice(i, i + LOT);
        if($("#trEtat")) {
          const t = $("#trEtat").querySelector(".thinking");
          if(t) t.innerHTML = "<i></i>Placement des documents — " + Math.min(i+LOT, its.length) + "/" + its.length;
        }
        const desc = lot.map(it=>{
          const actuel = absorbes.has(it.chapitreId) ? (plan.fusions.find(f=>(f.absorber||[]).includes(it.chapitreId))||{}).garder : it.chapitreId;
          return '- doc "'+it.id+'" · type '+(TYPES[it.type]||it.type)+' · titre "'+(it.titre||"")+'"'
            + ' · actuellement dans "'+(actuel||"aucun")+'" · extrait : ' + extraitDe(it);
        }).join("\n");

        const r2 = await iaJson({
          system: NIVEAU,
          messages:[{ role:"user", content:
            "Chapitres disponibles dans la matière « " + m.nom + " » :\n" + listeCible + "\n\n"
            + "Documents à vérifier :\n" + desc + "\n\n"
            + "1. DÉPLACEMENTS : pour chaque document manifestement rangé dans le mauvais chapitre, indique son id "
            + "et l'id du chapitre qui lui convient. N'utilise que les id de la liste ci-dessus. "
            + "Ne propose RIEN pour un document déjà bien placé — la liste doit être courte.\n"
            + "2. DOUBLONS : deux documents dont le contenu se recouvre presque entièrement (même page importée deux fois). "
            + "Indique lequel garder et lesquels supprimer. Un cours et son exercice ne sont PAS des doublons ; "
            + "deux séances distinctes non plus. En cas de doute, ne signale rien." }],
          schema: SCHEMA_TRI_DOCS, effort:"high", maxTokens: 8000, signal: ch.signal
        });
        plan.deplacements = plan.deplacements.concat((r2 && r2.deplacements) || []);
        plan.doublons     = plan.doublons.concat((r2 && r2.doublons) || []);
      }
    }

    ch.fini();
    ecranRangement(plan, mid);
  }catch(e){
    ch.fini();
    $("#trEtat").innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>";
  }
}

function ecranRangement(plan, mid){
  const nom = id => { const c = chapById(id); return c ? (c.numero!=null?"Ch. "+c.numero+" — ":"") + c.titre : "(chapitre inconnu)"; };
  const doc = id => { const i = state.items.find(x=>x.id===id); return i ? (i.titre||"sans titre") : "(document inconnu)"; };
  const valides = c => chapById(c);

  const fusions = (plan.fusions||[]).filter(f=>valides(f.garder) && (f.absorber||[]).some(valides));
  const renom   = (plan.renommages||[]).filter(r=>valides(r.id) && r.titre && chapById(r.id).titre !== r.titre);
  const depl    = (plan.deplacements||[]).filter(d=>{
    const it = state.items.find(x=>x.id===d.docId);
    return it && valides(d.versId) && it.chapitreId !== d.versId;
  });
  const doubl   = (plan.doublons||[]).filter(d=>state.items.some(x=>x.id===d.garder) && (d.supprimer||[]).some(id=>state.items.some(x=>x.id===id)));
  const ordreUtile = (plan.ordre||[]).filter(valides);
  const ordreChange = ordreUtile.length > 1 &&
    ordreUtile.join("|") !== chapsOf(mid).map(c=>c.id).join("|");

  const total = fusions.length + renom.length + depl.length + doubl.length + (ordreChange?1:0);
  $("#trEtat").innerHTML = total
    ? "<b>" + total + " proposition" + (total>1?"s":"") + "</b> — décoche ce que tu refuses."
    : "<b>Rien à redresser.</b> La matière est déjà bien rangée.";

  if(!total){ $("#trOut").innerHTML = ""; return; }

  const ligne = (cle, titre, detail, pourquoi) =>
    '<label class="prop"><input type="checkbox" checked data-act="'+cle+'">'
    + "<span><b>"+titre+"</b>"
    + (detail ? "<em>"+detail+"</em>" : "")
    + (pourquoi ? '<span class="note">'+esc(pourquoi)+"</span>" : "")
    + "</span></label>";

  let html = "";
  if(fusions.length){
    html += '<div class="titre-section"><h2>Chapitres en double</h2></div>';
    fusions.forEach((f,i)=>{
      const abs = (f.absorber||[]).filter(valides);
      html += ligne("fus:"+i, "Fusionner en « "+esc(f.titre||chapById(f.garder).titre)+" »",
        esc(abs.map(nom).join(" + ")) + " → " + esc(nom(f.garder)), f.pourquoi);
    });
  }
  if(renom.length){
    html += '<div class="titre-section"><h2>Titres à corriger</h2></div>';
    renom.forEach((r,i)=>html += ligne("ren:"+i, esc(chapById(r.id).titre)+" → "+esc(r.titre), "", r.pourquoi));
  }
  if(depl.length){
    html += '<div class="titre-section"><h2>Documents mal rangés</h2></div>';
    depl.forEach((d,i)=>html += ligne("dep:"+i, esc(doc(d.docId)),
      esc(nom(state.items.find(x=>x.id===d.docId).chapitreId)) + " → " + esc(nom(d.versId)), d.pourquoi));
  }
  if(doubl.length){
    html += '<div class="titre-section"><h2>Doublons</h2></div>';
    doubl.forEach((d,i)=>{
      const sup = (d.supprimer||[]).filter(id=>state.items.some(x=>x.id===id));
      html += ligne("dbl:"+i, "Supprimer " + sup.length + " copie" + (sup.length>1?"s":""),
        esc(sup.map(doc).join(", ")) + " · garde « " + esc(doc(d.garder)) + " »", d.pourquoi);
    });
  }
  if(ordreChange){
    html += '<div class="titre-section"><h2>Ordre des chapitres</h2></div>';
    html += ligne("ord:0", "Renuméroter les chapitres",
      esc(ordreUtile.map(id=>chapById(id).titre).join(" → ")), "");
  }

  $("#trOut").innerHTML = html;
  $("#trGo").classList.remove("hide");
  $("#trGo").onclick = async ()=>{
    const coche = c => { const e = document.querySelector('[data-act="'+c+'"]'); return e && e.checked; };
    let n = 0;

    for(let i=0;i<fusions.length;i++){
      if(!coche("fus:"+i)) continue;
      const f = fusions[i], abs = (f.absorber||[]).filter(valides);
      for(const a of abs){
        for(const it of itemsOf(a)){ it.chapitreId = f.garder; await saveItem(it); }
        state.chapitres = state.chapitres.filter(c=>c.id !== a);
      }
      const g = chapById(f.garder); if(g && f.titre) g.titre = f.titre;
      n++;
    }
    for(let i=0;i<renom.length;i++){
      if(!coche("ren:"+i)) continue;
      const c = chapById(renom[i].id); if(c){ c.titre = renom[i].titre; n++; }
    }
    for(let i=0;i<depl.length;i++){
      if(!coche("dep:"+i)) continue;
      const it = state.items.find(x=>x.id===depl[i].docId);
      if(it && chapById(depl[i].versId)){ it.chapitreId = depl[i].versId; await saveItem(it); n++; }
    }
    for(let i=0;i<doubl.length;i++){
      if(!coche("dbl:"+i)) continue;
      for(const id of (doubl[i].supprimer||[])) if(state.items.some(x=>x.id===id)){ await deleteItem(id); n++; }
    }
    if(ordreChange && coche("ord:0")){
      ordreUtile.forEach((id,k)=>{ const c = chapById(id); if(c) c.numero = k+1; });
      n++;
    }

    await saveStructure();
    closeModal();
    aller("matiere", { mat: mid });
    toast(n ? n + " changement(s) appliqué(s)" : "Aucun changement");
  };
}

/* =========================================================
   NAVIGATION & VUES
   Un empilement simple : la barre d'onglets fixe la destination,
   les cartes creusent (matière → chapitre), le retour dépile.
   ========================================================= */
const PREF_KEY = LS_KEY + "-pref";
function savePref(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({ vue:state.vue, mat:state.selMat, chap:state.selChap })); }catch(e){}
}
function loadPref(){
  try{
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    if(p.mat && matById(p.mat)) state.selMat = p.mat;
    if(p.chap && chapById(p.chap)) state.selChap = p.chap;
    if(p.vue) state.vue = p.vue;
  }catch(e){}
  if(state.vue === "chapitre" && !chapById(state.selChap)) state.vue = "cahier";
  if(state.vue === "matiere" && !matById(state.selMat)) state.vue = "cahier";
  if(!state.selMat && state.matieres.length) state.selMat = state.matieres[0].id;
}

state.vue = "cahier";

function aller(vue, opts){
  opts = opts || {};
  if(opts.mat !== undefined) state.selMat = opts.mat;
  if(opts.chap !== undefined) state.selChap = opts.chap;
  state.vue = vue;
  render();
  window.scrollTo({ top:0, behavior: opts.doux ? "smooth" : "auto" });
}
function retour(){
  if(state.vue === "chapitre") return aller("matiere");
  aller("cahier");
}

/* ---------- éléments réutilisés ---------- */
const initiales = nom => nom.split(/[\s'’-]+/).filter(Boolean).slice(0,2).map(m=>m[0]).join("").toUpperCase();

function avancement(mid){
  const cs = chapsOf(mid);
  if(!cs.length) return 0;
  return Math.round(cs.filter(c=>c.statut==="maitrise").length / cs.length * 100);
}

const lacunesDe = mid => chapsOf(mid).reduce((n,c)=>n + ((c.analyse && c.analyse.lacunes) ? c.analyse.lacunes.length : 0), 0);

function anneau(m, actif){
  const pct = avancement(m.id);
  const c = m.couleur || "#4DD6A8";
  const fond = pct > 0
    ? "conic-gradient("+c+" 0 "+pct+"%, var(--trait) "+pct+"% 100%)"
    : (actif ? c : "var(--trait)");
  const lac = lacunesDe(m.id);
  return '<span class="anneau" style="background:'+fond+'"><i>'+esc(initiales(m.nom))+"</i>"
    + (lac ? '<b class="badge">'+(lac>9?"9+":lac)+"</b>" : "") + "</span>";
}

function rangeeMatieres(){
  if(!state.matieres.length) return "";
  return '<div class="rangee"><div class="rangee-int">'
    + state.matieres.map(m=>
        '<button class="pastille" data-mat="'+m.id+'" aria-current="'+(state.selMat===m.id)+'">'
        + anneau(m, state.selMat===m.id)
        + "<span>"+esc(m.nom)+"</span></button>").join("")
    + '<button class="pastille ajout" data-ajout="1"><span class="anneau" style="background:var(--trait)"><i>+</i></span><span>Matière</span></button>'
    + "</div></div>";
}

/* Horodatage : chaque note porte son jour ET son heure de prise. */
const HEURE = { hour:"2-digit", minute:"2-digit" };

const heureDe = iso => {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleTimeString("fr-FR", HEURE);
};
const dateHeure = iso => {
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" })
    + " à " + d.toLocaleTimeString("fr-FR", HEURE);
};
const ilYA = iso => {
  const d = new Date(iso); if(isNaN(d)) return "";
  const auj = new Date(), hier = new Date(auj.getTime() - 86400000);
  const memeJour = (a,b) => a.toDateString() === b.toDateString();
  if(memeJour(d, auj))  return "aujourd'hui à " + d.toLocaleTimeString("fr-FR", HEURE);
  if(memeJour(d, hier)) return "hier à " + d.toLocaleTimeString("fr-FR", HEURE);
  const j = Math.floor((auj - d) / 86400000);
  if(j < 7) return "il y a " + j + " j";
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"short" });
};

function entete(titre, avecRetour, actions){
  return '<header class="entete"><div class="entete-ligne">'
    + (avecRetour ? '<button class="retour" data-retour="1">‹ <span>Retour</span></button>' : '<span class="marque">'+esc(titre)+"</span>")
    + (avecRetour ? '<span class="titre-vue">'+esc(titre)+"</span>" : "")
    + (actions || (avecRetour ? "<span style='width:64px'></span>" : ""))
    + "</div></header>";
}

const ACTION_CHERCHER = '<button class="icone-btn" data-vue-aller="recherche" aria-label="Chercher">'
  + '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
  + '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>';
const ACTION_AJOUT = '<button class="icone-btn" data-creation="1" aria-label="Ajouter">＋</button>';

/* =========================================================
   VUE — MATIÈRE
   ========================================================= */
function vueMatiere(){
  const m = matById(state.selMat);
  if(!m) return aller("cahier");
  const scene = $("#scene"), cs = chapsOf(m.id), its = itemsOfMat(m.id);
  const pct = avancement(m.id);
  const enCours = cs.find(c=>c.statut === "encours");
  const lac = lacunesDe(m.id);

  scene.innerHTML = entete(m.nom, true, ACTION_AJOUT)
    + '<div class="colonne">'
    + '<div style="display:flex;align-items:center;gap:14px;padding:18px 0 10px">'
    +   anneau(m, true)
    +   '<div style="flex:1;min-width:0">'
    +     '<div class="stats">'
    +       '<span class="stat"><b>'+cs.length+"</b><span>chapitre"+(cs.length>1?"s":"")+"</span></span>"
    +       '<span class="stat"><b>'+its.length+"</b><span>document"+(its.length>1?"s":"")+"</span></span>"
    +       '<span class="stat"><b>'+pct+'%</b><span>maîtrisé</span></span>'
    +     "</div>"
    +     '<div class="jauge"><i style="width:'+pct+'%;background:'+esc(m.couleur)+'"></i></div>'
    +   "</div>"
    + "</div>"
    + ((enCours || lac || m.code || m.prof)
        ? '<div class="chap-meta" style="margin-bottom:12px">'
          + (m.code ? '<span class="etiq type">'+esc(m.code)+"</span>" : "")
          + (m.prof ? '<span class="etiq type">'+esc(m.prof)+"</span>" : "")
          + (enCours ? '<button class="etiq encours" data-chap="'+enCours.id+'">En cours · Ch. '+esc(enCours.numero||"?")+" "+esc(enCours.titre)+"</button>" : "")
          + (lac ? '<span class="etiq manque">'+lac+" à compléter</span>" : "")
          + "</div>"
        : "")
    + '<div class="doc-actions" style="margin:6px 0 4px">'
    +   '<button class="btn pri sm" data-import="1">＋ Photos / PDF</button>'
    +   '<button class="btn sm" data-ecrire="">✎ Écrire</button>'
    +   '<button class="btn sm" data-programme="1">☰ Programme</button>'
    +   '<button class="btn sm" data-ranger="1">⇄ Ranger</button>'
    +   '<button class="btn sm" data-newchap="1">Chapitre</button>'
    +   '<button class="btn sm fantome" data-editmat="1">Modifier</button>'
    + "</div>"
    + (cs.length
        ? '<div class="titre-section"><h2>Chapitres</h2></div><div class="fil">'
          + cs.map(c=>{
              const n = itemsOf(c.id).length;
              const lac = (c.analyse && c.analyse.lacunes) ? c.analyse.lacunes.length : 0;
              return '<button class="chap" data-chap="'+c.id+'">'
                + '<span class="num">'+esc(c.numero!=null&&c.numero!==""?String(c.numero).padStart(2,"0"):"··")+"</span>"
                + '<span class="txt"><h3>'+esc(c.titre)+'</h3><span class="meta">'
                +   '<span class="etiq '+esc(c.statut||"nouveau")+'">'+esc(STATUTS[c.statut]||STATUTS.nouveau)+"</span>"
                +   '<span class="etiq type">'+n+" doc"+(n>1?"s":"")+"</span>"
                +   (c.analyse ? '<span class="etiq ia">analysé</span>' : "")
                +   (lac ? '<span class="etiq manque">'+lac+" à compléter</span>" : "")
                + "</span></span><span class='chevron'>›</span></button>";
            }).join("") + "</div>"
        : '<div class="vide"><div class="gros">◌</div><h3>Aucun chapitre</h3>'
          + "<p>Importe une photo ou écris un cours : le chapitre sera créé à partir de ce que contient le document.</p></div>")
    + "</div>";

  câbler(scene);
}

/* =========================================================
   VUE — CHAPITRE
   ========================================================= */
function vueChapitre(){
  const c = chapById(state.selChap);
  if(!c) return aller("cahier");
  const m = matById(c.matiereId), its = itemsOf(c.id), scene = $("#scene");
  const a = c.analyse;

  scene.innerHTML = entete("Ch. " + (c.numero||"?"), true, ACTION_AJOUT)
    + '<div class="colonne">'
    + '<div style="padding:16px 0 10px">'
    +   '<div class="chap-meta" style="margin-bottom:8px">'
    +     '<span class="jeton" style="background:'+esc(m?m.couleur:"#4DD6A8")+';width:22px;height:22px;font-size:11px">'+esc(m?initiales(m.nom):"?")+"</span>"
    +     '<span class="etiq type">'+esc(m?m.nom:"—")+"</span>"
    +     '<span class="etiq '+esc(c.statut||"nouveau")+'">'+esc(STATUTS[c.statut]||STATUTS.nouveau)+"</span>"
    +   "</div>"
    +   '<h1 style="font-family:var(--lecture);font-size:27px;line-height:1.2">'+esc(c.titre)+"</h1>"
    +   (c.note ? '<p class="note" style="margin-top:8px">'+esc(c.note)+"</p>" : "")
    + "</div>"
    + (c.origine === "programme" && ((c.objectifs&&c.objectifs.length) || (c.notions&&c.notions.length))
        ? '<div class="card"><h4>Annoncé au programme</h4>'
          + (c.objectifs && c.objectifs.length
              ? '<ul style="margin:0 0 8px;padding-left:18px;font-size:14px">'+c.objectifs.map(o=>"<li>"+esc(o)+"</li>").join("")+"</ul>" : "")
          + (c.notions && c.notions.length
              ? '<div class="chap-meta">'+c.notions.map(n=>'<span class="pill type">'+esc(n)+"</span>").join("")+"</div>" : "")
          + "</div>"
        : "")
    + '<div class="seg" style="margin-bottom:12px">'
    +   Object.keys(STATUTS).map(k=>'<button data-statut="'+k+'" aria-pressed="'+((c.statut||"nouveau")===k)+'">'+STATUTS[k]+"</button>").join("")
    + "</div>"
    + '<div class="doc-actions" style="margin-bottom:6px">'
    +   (its.length
        ? '<button class="btn pri sm" data-analyse="'+c.id+'">'+(a?"Relancer l'analyse":"Analyser ce chapitre")+"</button>"
        : '<button class="btn pri sm" data-preparer="'+c.id+'">Préparer ce chapitre</button>')
    +   '<button class="btn sm" data-question="'+c.id+'">Poser une question</button>'
    +   '<button class="btn sm" data-import="1">＋ Photos / PDF</button>'
    +   '<button class="btn sm" data-ecrire="'+c.id+'">✎ Écrire</button>'
    +   '<button class="btn sm fantome" data-editchap="'+c.id+'">Modifier</button>'
    +   '<button class="btn sm fantome danger" data-delchap="'+c.id+'">Supprimer</button>'
    + "</div>"
    + (a && a.lacunes && a.lacunes.length
        ? '<div class="card" style="border-color:var(--alerte)"><h4 style="color:var(--alerte)">Ce qui manque</h4>'
          + a.lacunes.map(l=>'<div class="lacune"><span class="dot"></span><span><b>'+esc(l.quoi)+"</b><br>"
              + '<span class="note">'+esc(l.pourquoi||"")+"</span></span></div>").join("")
          + '<div class="doc-actions"><button class="btn sm" data-voiranalyse="1">Voir l\'analyse complète</button></div></div>'
        : a ? '<div class="card"><h4>Analyse</h4><p class="note">Rien ne manque dans ce chapitre.</p>'
              + '<div class="doc-actions"><button class="btn sm" data-voiranalyse="1">Voir la synthèse</button></div></div>'
            : "")
    + '<div class="titre-section"><h2>Documents</h2><span>'+its.length+"</span></div>"
    + (its.length
        ? '<div class="fil">' + its.map(i=>{
            const ouvert = state.openDocs.has(i.id);
            const d = i.date ? new Date(i.date) : null;
            const jourHeure = d && !isNaN(d)
              ? d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}) + " · " + heureDe(i.date)
              : "";
            return '<div class="doc"><button class="doc-tete" data-doc="'+i.id+'" aria-expanded="'+ouvert+'">'
              + '<span class="etiq type">'+esc(TYPES[i.type]||i.type||"doc")+"</span>"
              + "<h4>"+esc(i.titre||"Sans titre")+"</h4>"
              + '<span class="doc-date">'+jourHeure+"</span>"
              + "<span class='chevron' style='transform:rotate("+(ouvert?90:0)+"deg)'>›</span></button>"
              + (ouvert
                  ? '<div class="doc-corps">'
                    + (i.type === "apercu"
                        ? '<div class="avertit">Aperçu généré à partir du programme — '
                          + (i.ancre ? "appuyé sur des sources listées en fin de document." : "sans sources vérifiables.")
                          + " Ce n'est pas le cours de ton professeur : confronte-le à ce qui sera dit en amphi.</div>"
                        : "")
                    + '<div class="prose">'+md(i.contenu)+"</div>"
                    + '<p class="note" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--trait)">'
                    +   "Noté le " + esc(dateHeure(i.date))
                    +   (i.maj && i.maj !== i.date ? " · modifié le " + esc(dateHeure(i.maj)) : "")
                    + "</p>"
                    + '<div class="doc-actions">'
                    +   '<button class="btn sm" data-edit="'+i.id+'">Modifier</button>'
                    +   '<button class="btn sm" data-deplacer="'+i.id+'">Déplacer</button>'
                    +   '<button class="btn sm" data-expliquer="'+i.id+'">Expliquer</button>'
                    +   '<button class="btn sm" data-fiche="'+i.id+'">Fiche</button>'
                    +   '<button class="btn sm fantome danger" data-del="'+i.id+'">Supprimer</button>'
                    + "</div></div>"
                  : "")
              + "</div>";
          }).join("") + "</div>"
        : '<div class="vide" style="padding:30px 10px"><p>Aucun document dans ce chapitre.</p></div>')
    + "</div>";

  câbler(scene);
}

/* =========================================================
   VUE — RECHERCHE
   ========================================================= */
function vueRecherche(){
  const scene = $("#scene"), q = (state.query||"").trim().toLowerCase();
  const hits = q ? state.items.filter(i =>
      String(i.titre||"").toLowerCase().includes(q) || String(i.contenu||"").toLowerCase().includes(q)
    ).slice(0,50) : [];

  scene.innerHTML = entete("Chercher")
    + '<div class="colonne" style="padding-top:14px">'
    + '<input class="field" id="qInput" placeholder="Un mot, une notion, un titre…" value="'+esc(state.query||"")+'" autocomplete="off">'
    + (q
        ? '<div class="titre-section"><h2>'+(hits.length||"Aucun")+" résultat"+(hits.length>1?"s":"")+"</h2></div>"
          + (hits.length ? '<div class="fil">'+hits.map(carteDoc).join("")+"</div>"
                         : '<div class="vide"><p>Rien ne correspond à « '+esc(state.query)+' ».</p></div>')
        : '<div class="vide" style="padding:40px 10px"><div class="gros">⌕</div>'
          + "<p>Cherche dans l'intégralité de tes cours — titres et contenu.</p></div>")
    + "</div>";

  const inp = $("#qInput");
  inp.oninput = e=>{ state.query = e.target.value; vueRecherche(); const n=$("#qInput"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  câbler(scene);
}

/* =========================================================
   VUE — AGENT  (conserve les identifiants attendus par la couche IA)
   ========================================================= */
function showPanel(){ if(state.vue !== "agent") aller("agent"); }

function vueAgent(){
  const scene = $("#scene");
  scene.innerHTML = entete("Agent")
    + '<div class="colonne">'
    + '<div class="seg" style="padding:12px 0 4px" id="agTabs">'
    +   '<button data-tab="analyse" aria-pressed="'+(state.tab!=="chat")+'">Analyse</button>'
    +   '<button data-tab="chat" aria-pressed="'+(state.tab==="chat")+'">Questions</button>'
    + "</div>"
    + '<div id="panelBody"></div></div>';
  $("#agTabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.tab = b.dataset.tab; renderPanel(); });
  renderPanel();
}

function renderPanel(){
  if(state.vue !== "agent") return;
  const body = $("#panelBody");
  if(!body) return;
  const c = chapById(state.selChap);
  $("#agTabs").querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed", String((state.tab==="chat") === (b.dataset.tab==="chat"))));
  $("#composer").classList.toggle("hide", state.tab !== "chat" || !c || IA.mode === "off");

  if(IA.mode === "off"){
    body.innerHTML = '<div class="card"><h4>Agent éteint</h4><p class="note">'+esc(IA.detail)+"</p>"
      + '<div class="doc-actions"><button class="btn sm pri" id="pCfg">Ouvrir les réglages</button></div></div>';
    $("#pCfg").onclick = ()=>aller("reglages");
    return;
  }
  if(!c){
    body.innerHTML = '<div class="vide" style="padding:40px 10px"><div class="gros">◈</div>'
      + "<h3>Aucun chapitre choisi</h3><p>Ouvre un chapitre, puis reviens ici : l'agent travaille sur tes documents à toi. "
      + "Il ne dit jamais rien de lui-même.</p></div>";
    return;
  }

  if(state.tab !== "chat"){
    const a = c.analyse;
    if(!a){
      body.innerHTML = '<div class="card"><h4>'+esc(c.titre)+"</h4>"
        + "<p class=\"note\">L'agent lit tous les documents du chapitre, en fait une synthèse à ton niveau, et te signale ce qui manque par rapport à un chapitre complet.</p>"
        + '<div class="doc-actions"><button class="btn pri sm" id="pAn">Analyser le chapitre</button></div></div>';
      $("#pAn").onclick = ()=>analyseChapitre(c.id);
      return;
    }
    body.innerHTML =
        '<div class="card"><h4>'+esc(c.titre)+'</h4><div class="prose">'+md(a.resume||"")+"</div></div>"
      + (a.plan && a.plan.length ? '<div class="card"><h4>Structure</h4><ol style="margin:0;padding-left:19px;font-size:14px">'
          + a.plan.map(p=>"<li style='margin:4px 0'>"+esc(p)+"</li>").join("")+"</ol></div>" : "")
      + (a.notions && a.notions.length ? '<div class="card"><h4>Notions clés</h4>'
          + a.notions.map(n=>'<div class="notion"><b>'+esc(n.terme)+"</b><span>"+esc(n.definition)+"</span></div>").join("")+"</div>" : "")
      + (a.lacunes && a.lacunes.length ? '<div class="card" style="border-color:var(--alerte)"><h4 style="color:var(--alerte)">Ce qui manque</h4>'
          + a.lacunes.map(l=>'<div class="lacune"><span class="dot"></span><span><b>'+esc(l.quoi)+"</b><br><span class=\"note\">"+esc(l.pourquoi||"")+"</span></span></div>").join("")
          + '<p class="note" style="margin-top:10px">Vérifie dans tes notes ou demande au prof — ce sont des points normalement traités et absents de ce que tu as importé.</p></div>' : "")
      + (a.questions && a.questions.length ? '<div class="card"><h4>Teste-toi</h4><ul style="margin:0;padding-left:19px;font-size:14px">'
          + a.questions.map(q=>"<li style='margin:6px 0'>"+esc(q)+"</li>").join("")+"</ul></div>" : "")
      + '<div class="doc-actions"><button class="btn sm" id="pRe">Relancer</button>'
      + '<button class="btn sm" id="pFiche">Créer la fiche</button></div>'
      + '<p class="note" style="margin-top:10px">Analysé le '+esc(a.date||"")+"</p>";
    $("#pRe").onclick = ()=>analyseChapitre(c.id);
    $("#pFiche").onclick = ()=>ficheChapitre(c.id);
    return;
  }

  const log = state.chats[c.id] || [];
  body.innerHTML = '<div class="chat" id="chatLog">'
    + (log.length
        ? log.map(t=>'<div class="msg '+(t.role==="user"?"me":"ia")+'">'
            + (t.role==="user" ? esc(t.content) : '<div class="prose">'+md(t.content)+"</div>") + "</div>").join("")
        : '<div class="card"><h4>'+esc(c.titre)+"</h4><p class=\"note\">Pose ta question. L'agent répond à partir de <b>tes</b> documents, à ton niveau, et te dit franchement quand la réponse n'y est pas.</p></div>")
    + "</div>";
  window.scrollTo({ top: document.body.scrollHeight });
}

    +     (IA.vision?"active":"inactive")+"</b></p>"
    +   '<div class="doc-actions"><button class="btn pri sm" id="rIA">Configurer</button></div></div>'
    + '<div class="card"><h4>Lecture des photos</h4>'
    +   '<p class="note">Vérifie sur une page manuscrite fabriquée pour l\'occasion — surlignage, mot entouré, '
    +   "note de marge, schéma — ce que ton modèle restitue vraiment. Score sur 7.</p>"
    +   '<div class="seg" style="margin-top:10px" id="rQual">'
    +     '<button data-q="std" aria-pressed="'+(!qualiteFine())+'">Définition standard</button>'
    +     '<button data-q="fine" aria-pressed="'+qualiteFine()+'">Maximale</button>'
    +   "</div>"
    +   '<div class="doc-actions"><button class="btn pri sm" id="rEpreuve">Lancer l\'épreuve</button></div>'
    +   '<div id="rEpOut"></div></div>'
    + '<div class="card"><h4>Matières</h4><p class="note">'+state.matieres.length+" matière"+(state.matieres.length>1?"s":"")+" · modifie la liste, les codes et les profs.</p>"
    +   '<div class="doc-actions"><button class="btn sm" id="rMat">Gérer mes matières</button></div></div>'
    + '<div class="card"><h4>Apparence</h4><p class="note">Le cahier suit ton système. Tu peux forcer un mode.</p>'
    +   '<div class="seg" style="margin-top:10px" id="rTheme">'
    +     ['auto','light','dark'].map(t=>'<button data-theme="'+t+'">'+({auto:"Système",light:"Clair",dark:"Sombre"})[t]+"</button>").join("")
    +   "</div></div>"
    + '<div class="card"><h4>Sauvegarde</h4><p class="note">'
    +   (db ? "Tes cours sont enregistrés sur ton compte et suivent cette page d'un appareil à l'autre."
          : "Sauvegarde locale à ce navigateur. Exporte de temps en temps.")
    +   "</p><p class=\"note\" style=\"margin-top:6px\">"+nb+" document"+(nb>1?"s":"")+" · ~"+poids+" Ko</p>"
    +   '<div class="doc-actions"><button class="btn sm" id="rExp">Exporter en JSON</button>'
    +   '<button class="btn sm" id="rImp">Importer un JSON</button></div></div>'
    + "</div>";

  $("#rIA").onclick = openSettings;
  $("#rQual").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ reglerQualite(b.dataset.q); vueReglages(); });
  $("#rEpreuve").onclick = async ()=>{
    const btn = $("#rEpreuve"), out = $("#rEpOut");
    if(IA.mode === "off" || !IA.vision){
      out.innerHTML = '<p class="note" style="margin-top:10px;color:var(--attention)">'
        + "La lecture des photos n'est pas active. Configure le moteur IA au-dessus.</p>";
      return;
    }
    btn.disabled = true;
    out.innerHTML = '<div id="rEpEtat" style="margin-top:10px"></div>'
      + '<pre id="rEpTexte" style="margin-top:10px;background:var(--surface-3);border-radius:10px;'
      + 'padding:10px 12px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;max-height:220px;overflow:auto"></pre>';
    const ch = chantier($("#rEpEtat"), "Lecture de la page d'épreuve", { delai: 150000 });
    try{
      const r = await epreuveVision(t=>{ const e = $("#rEpTexte"); if(e) e.textContent = t; });
      ch.fini();
      const couleur = r.reussis >= 6 ? "var(--ok)" : r.reussis >= 4 ? "var(--attention)" : "var(--alerte)";
      const verdict = r.reussis >= 6 ? "ton modèle lit correctement les annotations."
        : r.reussis >= 4 ? "lecture partielle — essaie la définition maximale, ou un autre modèle."
        : "ce modèle lit mal les annotations — changes-en dans Configurer.";
      $("#rEpEtat").innerHTML = '<b style="color:'+couleur+'">' + r.reussis + "/7 — " + verdict + "</b>"
        + '<div style="margin-top:10px">'
        + r.criteres.map(c=>'<div class="note" style="padding:3px 0">'
            + '<span style="color:'+(c.ok?"var(--ok)":"var(--alerte)")+';font-weight:700">'
            + (c.ok?"✓":"✗") + "</span> " + esc(c.nom) + "</div>").join("")
        + "</div>";
    }catch(e){
      ch.fini();
      $("#rEpEtat").innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>";
    }
    btn.disabled = false;
  };
  $("#rMat").onclick = openMatieresModal;
  $("#rExp").onclick = exporterJSON;
  $("#rImp").onclick = importerJSON;
  const th = localStorage.getItem(LS_KEY+"-theme") || "auto";
  $("#rTheme").querySelectorAll("[data-theme]").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.theme === th));
    b.onclick = ()=>{ appliquerTheme(b.dataset.theme); vueReglages(); };
  });
}

function appliquerTheme(t){
  try{ localStorage.setItem(LS_KEY+"-theme", t); }catch(e){}
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

function exporterJSON(){
  const blob = new Blob([JSON.stringify({matieres:state.matieres, chapitres:state.chapitres, items:state.items}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "cahier-bba.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importerJSON(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!confirm("Fusionner ce fichier avec ton cahier actuel ?")) return;
      const a = (arr,id)=>arr.some(x=>x.id===id);
      (d.matieres||[]).forEach(m=>{ if(!a(state.matieres,m.id)) state.matieres.push(m); });
      (d.chapitres||[]).forEach(c=>{ if(!a(state.chapitres,c.id)) state.chapitres.push(c); });
      for(const i of (d.items||[])) if(!a(state.items,i.id)){ state.items.push(i); await saveItem(i); }
      await saveStructure(); render(); toast("Import terminé");
    }catch(e){ toast("Fichier illisible"); }
  };
  inp.click();
}

/* =========================================================
   CÂBLAGE COMMUN
   ========================================================= */
function câbler(scene){
  const q = s => scene.querySelectorAll(s);
  q("[data-retour]").forEach(b=>b.onclick=retour);
  q("[data-vue-aller]").forEach(b=>b.onclick=()=>aller(b.dataset.vueAller));
  q("[data-creation]").forEach(b=>b.onclick=openCreation);
  q("[data-mat]").forEach(b=>b.onclick=()=>aller("matiere",{mat:b.dataset.mat}));
  q("[data-ajout]").forEach(b=>b.onclick=openMatieresModal);
  q("[data-chap]").forEach(b=>b.onclick=()=>{
    const c = chapById(b.dataset.chap);
    aller("chapitre",{ chap:b.dataset.chap, mat: c ? c.matiereId : state.selMat });
  });
  q("[data-ouvrir]").forEach(b=>b.onclick=()=>{
    const it = state.items.find(x=>x.id===b.dataset.ouvrir); if(!it) return;
    state.openDocs.add(it.id);
    aller("chapitre",{ chap:it.chapitreId, mat:it.matiereId });
  });
  q("[data-doc]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.doc;
    state.openDocs.has(id) ? state.openDocs.delete(id) : state.openDocs.add(id);
    render();
  });
  q("[data-import]").forEach(b=>b.onclick=()=>openImport());
  q("[data-ecrire]").forEach(b=>b.onclick=()=>{
    const cid = b.dataset.ecrire;
    openEditor(cid && chapById(cid) ? { chapitreId: cid } : {});
  });
  q("[data-newchap]").forEach(b=>b.onclick=()=>openChapModal(null));
  q("[data-programme]").forEach(b=>b.onclick=()=>openProgramme(state.selMat));
  q("[data-ranger]").forEach(b=>b.onclick=()=>rangerMatiere(state.selMat));
  q("[data-deplacer]").forEach(b=>b.onclick=()=>deplacerDoc(b.dataset.deplacer));
  q("[data-preparer]").forEach(b=>b.onclick=()=>preparerChapitre(b.dataset.preparer));
  q("[data-editmat]").forEach(b=>b.onclick=openMatieresModal);
  q("[data-editchap]").forEach(b=>b.onclick=()=>openChapModal(b.dataset.editchap));
  q("[data-delchap]").forEach(b=>b.onclick=()=>delChapitre(b.dataset.delchap));
  q("[data-edit]").forEach(b=>b.onclick=()=>openEditor({itemId:b.dataset.edit}));
  q("[data-expliquer]").forEach(b=>b.onclick=()=>expliquer(b.dataset.expliquer));
  q("[data-fiche]").forEach(b=>b.onclick=()=>genererFiche(b.dataset.fiche));
  q("[data-del]").forEach(b=>b.onclick=async()=>{
    const it = state.items.find(x=>x.id===b.dataset.del);
    if(!it || !confirm("Supprimer « "+(it.titre||"ce document")+" » ?")) return;
    await deleteItem(b.dataset.del); render(); toast("Document supprimé");
  });
  q("[data-analyse]").forEach(b=>b.onclick=()=>{ state.tab="analyse"; analyseChapitre(b.dataset.analyse); });
  q("[data-question]").forEach(b=>b.onclick=()=>{ state.selChap = b.dataset.question; state.tab="chat"; aller("agent"); });
  q("[data-voiranalyse]").forEach(b=>b.onclick=()=>{ state.tab="analyse"; aller("agent"); });
  q("[data-statut]").forEach(b=>b.onclick=async()=>{
    const c = chapById(state.selChap); if(!c) return;
    c.statut = b.dataset.statut; await saveStructure(); render();
  });
}

/* =========================================================
   RENDU PRINCIPAL
   ========================================================= */
function render(){
  savePref();
  renderOnglets();
  $("#composer").classList.add("hide");
  switch(state.vue){
    case "matiere":   vueMatiere(); break;
    case "chapitre":  vueChapitre(); break;
    case "recherche": vueRecherche(); break;
    case "agent":     vueAgent(); break;
    case "reglages":  vueReglages(); break;
    default:          vueCahier();
  }
}

/* =========================================================
   ÉVÉNEMENTS & DÉMARRAGE
   ========================================================= */
$("#chatSend").onclick = ()=>envoyerChat(false);
$("#chatInput").addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); envoyerChat(false); }
});
$("#chatInput").addEventListener("input", e=>{
  e.target.style.height = "auto";
  e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});

async function amorcer(){
  state.matieres = MATIERES_DEFAUT.map((nom,i)=>({
    id: uid(), nom, code:"", prof:"", couleur: COULEURS[i % COULEURS.length], ordre: i
  }));
  state.selMat = state.matieres[0].id;
  await saveStructure();
}

(async function boot(){
  const th = (()=>{ try{ return localStorage.getItem(LS_KEY+"-theme") || "auto"; }catch(e){ return "auto"; } })();
  if(th !== "auto") document.documentElement.setAttribute("data-theme", th);

  chargerConfig();
  await loadAll(); loadPref(); majMode(); render();

  if(typeof claude !== "undefined" && claude && claude.use){
    try{ db = await claude.use("db"); }catch(e){}
    try{ sample = await claude.use("sample"); }catch(e){}
    if(sample){
      aiOn = true;
      try{
        const l = await sample.limits();
        imgLim = l && l.images ? l.images : null;
        if(!imgLim) imgLimErr = "limites sans volet images";
      }catch(e){ imgLim = null; imgLimErr = (e && e.code) || "limits() a échoué"; }
    }
    if(db){ await loadAll(); loadPref(); }
    majMode(); render();
  }

  if(!state.matieres.length){ await amorcer(); render(); }
})();

})();
</script>
