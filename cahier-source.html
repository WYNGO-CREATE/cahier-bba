<title>Cahier — Global BBA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  /* ============================================================
     CAHIER — direction visuelle
     Grammaire d'interaction empruntée aux applications mobiles :
     onglets en bas, geste de création central, rangée de pastilles.
     Identité propre : sombre d'abord, couleur porteuse d'information
     (une teinte par matière), interface en sans-serif et contenu de
     cours en serif — l'outil est une application, ce qu'il contient
     reste un cahier.
     ============================================================ */
  :root{
    color-scheme: dark light;

    --fond:#0B0F0E;          /* nuit, biais vert-ardoise plutôt que noir pur */
    --surface:#141A18;
    --surface-2:#1B2320;
    --surface-3:#242E2A;
    --trait:#2A3531;
    --trait-fort:#3A4741;

    --texte:#ECF1EE;
    --texte-2:#9AA7A1;
    --texte-3:#6B7873;

    --accent:#4DD6A8;        /* action : jade lumineux, lisible sur les deux fonds */
    --accent-doux:#12312A;
    --sur-accent:#04140F;

    --ok:#5FD39A; --ok-doux:#12291F;
    --attention:#E0A650; --attention-doux:#2C2213;
    --alerte:#F0806B; --alerte-doux:#311914;
    --neutre-doux:#212B27;

    --ombre:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
    --r:14px; --r-s:10px;

    --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --lecture:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
    --chiffres:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

    --barre:58px;            /* hauteur de la barre d'onglets */
    --sûr-bas:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root{
      --fond:#FAFAF8; --surface:#FFFFFF; --surface-2:#F3F5F2; --surface-3:#E9EDE9;
      --trait:#E0E5E0; --trait-fort:#C9D1CB;
      --texte:#131916; --texte-2:#5A6661; --texte-3:#8B9791;
      --accent:#0E9E74; --accent-doux:#E2F5EE; --sur-accent:#FFFFFF;
      --ok:#1B8459; --ok-doux:#E3F3EA;
      --attention:#9A6A12; --attention-doux:#F7EEDC;
      --alerte:#C0472F; --alerte-doux:#FAE6E1;
      --neutre-doux:#EDF0EC;
      --ombre:0 1px 2px rgba(19,25,22,.05), 0 12px 32px -22px rgba(19,25,22,.4);
    }
  }
  :root[data-theme="light"]{
    --fond:#FAFAF8; --surface:#FFFFFF; --surface-2:#F3F5F2; --surface-3:#E9EDE9;
    --trait:#E0E5E0; --trait-fort:#C9D1CB;
    --texte:#131916; --texte-2:#5A6661; --texte-3:#8B9791;
    --accent:#0E9E74; --accent-doux:#E2F5EE; --sur-accent:#FFFFFF;
    --ok:#1B8459; --ok-doux:#E3F3EA;
    --attention:#9A6A12; --attention-doux:#F7EEDC;
    --alerte:#C0472F; --alerte-doux:#FAE6E1;
    --neutre-doux:#EDF0EC;
    --ombre:0 1px 2px rgba(19,25,22,.05), 0 12px 32px -22px rgba(19,25,22,.4);
  }
  :root[data-theme="dark"]{
    --fond:#0B0F0E; --surface:#141A18; --surface-2:#1B2320; --surface-3:#242E2A;
    --trait:#2A3531; --trait-fort:#3A4741;
    --texte:#ECF1EE; --texte-2:#9AA7A1; --texte-3:#6B7873;
    --accent:#4DD6A8; --accent-doux:#12312A; --sur-accent:#04140F;
    --ok:#5FD39A; --ok-doux:#12291F;
    --attention:#E0A650; --attention-doux:#2C2213;
    --alerte:#F0806B; --alerte-doux:#311914;
    --neutre-doux:#212B27;
    --ombre:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:none}
  body{
    margin:0;background:var(--fond);color:var(--texte);
    font-family:var(--ui);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:650}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  ::placeholder{color:var(--texte-3)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hide{display:none !important}

  /* ---------- ossature ---------- */
  .app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .scene{flex:1;padding-bottom:calc(var(--barre) + var(--sûr-bas) + 12px)}
  .colonne{max-width:680px;margin:0 auto;padding:0 16px}

  /* ---------- barre supérieure ---------- */
  .entete{
    position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--fond) 88%,transparent);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--trait);
  }
  .entete-ligne{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:680px;margin:0 auto}
  .marque{font-family:var(--lecture);font-size:21px;font-weight:600;letter-spacing:-.02em;flex:1}
  .retour{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--texte);font-weight:500}
  .icone-btn{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    font-size:17px;color:var(--texte);transition:background .12s
  }
  .icone-btn:hover{background:var(--surface-2)}
  .titre-vue{font-size:16px;font-weight:650;flex:1;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- rangée de matières ---------- */
  .rangee{display:flex;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none;
    border-bottom:1px solid var(--trait)}
  .rangee::-webkit-scrollbar{display:none}
  .rangee-int{display:flex;gap:14px;padding:0 16px;margin:0 auto;min-width:min-content}
  .pastille{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none}
  .anneau{
    position:relative;width:60px;height:60px;border-radius:50%;padding:2.5px;display:grid;place-items:center;
    transition:transform .14s
  }
  .anneau .badge{
    position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
    background:var(--alerte);color:#fff;font-size:11px;font-weight:700;font-style:normal;
    display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--fond);font-variant-numeric:tabular-nums
  }
  .pastille:active .anneau{transform:scale(.94)}
  .anneau i{
    width:100%;height:100%;border-radius:50%;background:var(--surface);
    display:grid;place-items:center;font-family:var(--lecture);font-size:20px;font-weight:600;
    font-style:normal;color:var(--texte)
  }
  .pastille span{
    font-size:11.5px;color:var(--texte-2);text-align:center;line-height:1.25;
    max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .pastille[aria-current="true"] span{color:var(--texte);font-weight:600}
  .pastille.ajout .anneau i{color:var(--texte-3);font-size:26px;font-weight:300}

  /* ---------- cartes du fil ---------- */
  .fil{display:flex;flex-direction:column;gap:12px;padding:14px 0 24px}
  .carte{
    background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);
    overflow:hidden;transition:border-color .14s,transform .1s
  }
  .carte-cliquable{width:100%;text-align:left;display:block}
  .carte-cliquable:active{transform:scale(.992)}
  .carte-cliquable:hover{border-color:var(--trait-fort)}
  .carte-tete{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .jeton{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:var(--lecture);font-size:13px;font-weight:600;color:#fff}
  .carte-tete .qui{flex:1;min-width:0}
  .carte-tete .qui b{display:block;font-size:13.5px;font-weight:650;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .carte-tete .qui em{display:block;font-style:normal;font-size:11.5px;color:var(--texte-3)}
  .carte-corps{padding:0 14px 14px}
  .carte-corps h3{font-family:var(--lecture);font-size:18px;line-height:1.25;margin-bottom:6px}
  .carte-extrait{font-size:13.5px;color:var(--texte-2);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .carte-pied{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--trait);
    flex-wrap:wrap}

  /* ---------- section ---------- */
  .titre-section{display:flex;align-items:baseline;gap:8px;padding:18px 0 2px}
  .titre-section h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-3);font-weight:650}
  .titre-section span{font-family:var(--chiffres);font-size:11.5px;color:var(--texte-3);font-variant-numeric:tabular-nums}

  /* ---------- pastilles d'état ---------- */
  .etiq{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;
    border-radius:99px;font-weight:600;white-space:nowrap}
  .etiq.nouveau{background:var(--neutre-doux);color:var(--texte-2)}
  .etiq.encours{background:var(--attention-doux);color:var(--attention)}
  .etiq.arevoir{background:var(--alerte-doux);color:var(--alerte)}
  .etiq.maitrise{background:var(--ok-doux);color:var(--ok)}
  .etiq.type{background:var(--surface-2);color:var(--texte-2);font-family:var(--chiffres);
    font-size:10.5px;font-weight:500;letter-spacing:.02em}
  .etiq.manque{background:var(--alerte-doux);color:var(--alerte)}
  .etiq.ia{background:var(--accent-doux);color:var(--accent)}

  /* ---------- chapitres ---------- */
  .chap{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;
    background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);text-align:left}
  .chap:active{transform:scale(.992)}
  .chap:hover{border-color:var(--trait-fort)}
  .chap .num{font-family:var(--chiffres);font-size:12px;color:var(--texte-3);
    background:var(--surface-2);border-radius:8px;padding:5px 7px;font-variant-numeric:tabular-nums;flex:none}
  .chap .txt{flex:1;min-width:0}
  .chap .txt h3{font-family:var(--lecture);font-size:16.5px;line-height:1.3;margin-bottom:5px}
  .chap .meta{display:flex;flex-wrap:wrap;gap:5px}
  .chevron{color:var(--texte-3);flex:none;font-size:18px}

  /* ---------- documents ---------- */
  .doc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
  .doc-tete{width:100%;display:flex;align-items:center;gap:9px;padding:12px 14px;text-align:left}
  .doc-tete h4{flex:1;min-width:0;font-size:14px;font-weight:650;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-date{font-family:var(--chiffres);font-size:10.5px;color:var(--texte-3);font-variant-numeric:tabular-nums}
  .doc-corps{padding:0 14px 14px;border-top:1px solid var(--trait);padding-top:12px}

  /* ---------- prose : le cours reste un livre ---------- */
  .prose{font-family:var(--lecture);font-size:16px;line-height:1.62;color:var(--texte)}
  .prose>*:first-child{margin-top:0}
  .prose>*:last-child{margin-bottom:0}
  .prose h1,.prose h2,.prose h3{font-family:var(--ui);font-weight:700;margin:1.3em 0 .45em;line-height:1.28}
  .prose h1{font-size:18px}.prose h2{font-size:16.5px}.prose h3{font-size:15px}
  .prose p{margin:.6em 0}
  .prose .katex{font-size:1.07em}
  .prose .katex-display,.prose .maths-bloc{overflow-x:auto;overflow-y:hidden;margin:.7em 0;padding:3px 0}
  .prose .maths-bloc .katex-display{margin:0}
  .apercu{background:var(--surface-2);border:1px solid var(--trait);border-radius:12px;padding:14px 16px;max-height:62vh;overflow:auto}
  .prose ul,.prose ol{margin:.55em 0;padding-left:1.3em}
  .prose li{margin:.28em 0}
  .prose code{font-family:var(--chiffres);font-size:.85em;background:var(--surface-3);
    padding:1px 5px;border-radius:5px}
  .prose pre{background:var(--surface-3);padding:11px 13px;border-radius:10px;overflow-x:auto;margin:.75em 0}
  .prose pre code{background:none;padding:0}
  .prose blockquote{margin:.75em 0;padding:2px 0 2px 13px;border-left:2px solid var(--trait-fort);color:var(--texte-2)}
  .prose hr{border:none;border-top:1px solid var(--trait);margin:1.2em 0}
  .prose mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;
    padding:0 3px;border-radius:3px}
  .prose table{border-collapse:collapse;font-family:var(--ui);font-size:13.5px;margin:.75em 0}
  .prose th,.prose td{border:1px solid var(--trait);padding:6px 10px;text-align:left}
  .prose th{background:var(--surface-3);font-weight:650}
  .tablewrap{overflow-x:auto}

  /* ---------- boutons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 15px;border-radius:11px;border:1px solid var(--trait-fort);
    background:var(--surface-2);font-size:14px;font-weight:600;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--surface-3)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.fantome{border-color:transparent;background:transparent;color:var(--texte-2)}
  .btn.fantome:hover{background:var(--surface-2);color:var(--texte)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.large{width:100%;padding:13px}
  .btn.danger:hover{border-color:var(--alerte);color:var(--alerte)}

  .field{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--trait-fort);
    background:var(--surface);font-size:15px}
  .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
  textarea.field{resize:vertical;line-height:1.55}
  label.lab{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--texte-3);font-weight:650;margin-bottom:6px}

  /* ---------- barre d'onglets ---------- */
  .onglets{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    height:calc(var(--barre) + var(--sûr-bas));padding-bottom:var(--sûr-bas);
    background:color-mix(in srgb,var(--fond) 92%,transparent);
    backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--trait);
  }
  .onglet{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    height:100%;color:var(--texte-3);font-size:10px;font-weight:600;transition:color .12s}
  .onglet svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .onglet[aria-current="true"]{color:var(--texte)}
  .onglet.creer{color:var(--sur-accent)}
  .onglet.creer i{width:46px;height:32px;border-radius:11px;background:var(--accent);
    display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:400;
    color:var(--sur-accent);transition:transform .12s}
  .onglet.creer:active i{transform:scale(.92)}
  .pastille-alerte{position:absolute;top:9px;left:50%;margin-left:7px;width:7px;height:7px;
    border-radius:50%;background:var(--alerte);box-shadow:0 0 0 2px var(--fond)}

  /* ---------- feuille modale ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,8,7,.62);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;
    border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--trait);border-bottom:none;
    animation:monte .24s cubic-bezier(.22,1,.36,1)}
  @keyframes monte{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .modal.wide{max-width:820px}
  .modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;
    border-bottom:1px solid var(--trait);position:relative}
  .modal-head::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:2px;background:var(--trait-fort)}
  .modal-head h2{font-size:17px;font-weight:700;flex:1}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;align-items:center;
    padding:12px 18px calc(12px + var(--sûr-bas));border-top:1px solid var(--trait);background:var(--surface-2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stack{display:flex;flex-direction:column;gap:15px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{padding:7px 13px;border-radius:99px;border:1px solid var(--trait-fort);
    font-size:13px;font-weight:600;color:var(--texte-2)}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}

  .card{background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--r);
    padding:14px;margin-bottom:11px}
  .card h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--texte-3);
    font-weight:650;margin-bottom:9px}
  .note{font-size:13px;color:var(--texte-2);line-height:1.5}
  .avertit{background:var(--attention-doux);color:var(--attention);border:1px solid var(--attention);
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px;font-weight:500}
  .prose a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .etiq.apercu{background:var(--attention-doux);color:var(--attention)}

  /* menu de création */
  .creation-liste{display:flex;flex-direction:column;gap:8px}
  .creation{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:14px;border-radius:var(--r);border:1px solid var(--trait);background:var(--surface-2)}
  .creation:hover{border-color:var(--accent);background:var(--surface-3)}
  .creation:active{transform:scale(.99)}
  .creation-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--accent-doux);
    color:var(--accent);display:grid;place-items:center;font-size:20px}
  .creation span:nth-child(2){flex:1;min-width:0}
  .creation b{display:block;font-size:15.5px;font-weight:650}
  .creation em{display:block;font-style:normal;font-size:13px;color:var(--texte-2);margin-top:2px}

  /* marques relevées sur les pages manuscrites */
  .vu-marque{display:inline-block;font-size:.72em;font-family:var(--ui);font-weight:650;
    letter-spacing:.02em;text-transform:lowercase;padding:1px 7px;border-radius:99px;
    background:var(--accent-doux);color:var(--accent);vertical-align:.12em;margin:0 2px}
  .vu-doute{color:var(--attention);border-bottom:1.5px dotted var(--attention);cursor:help}
  .vu-schema{display:block;margin:.6em 0;padding:9px 12px;border-left:3px solid var(--accent);
    background:var(--surface-2);border-radius:0 8px 8px 0;font-family:var(--ui);
    font-size:.85em;color:var(--texte-2)}
  .vu-schema b{color:var(--accent);text-transform:uppercase;font-size:.85em;letter-spacing:.05em;
    display:block;margin-bottom:2px}
  .vu-lien{display:inline-block;font-family:var(--ui);font-size:.8em;color:var(--texte-2);
    background:var(--surface-2);padding:1px 8px;border-radius:6px}

  /* plan de rangement */
  .prop{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;margin-bottom:8px;
    background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--r);cursor:pointer}
  .prop:hover{border-color:var(--trait-fort)}
  .prop input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
  .prop span{flex:1;min-width:0}
  .prop b{display:block;font-size:14.5px;font-weight:650}
  .prop em{display:block;font-style:normal;font-size:13px;color:var(--texte-2);margin-top:3px}
  .prop .note{display:block;margin-top:5px;font-size:12.5px}

  /* barre d'outils de saisie */
  .barre-saisie{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .barre-saisie .note{flex:1;min-width:120px}

/* ---------- lecture / écriture ----------
   Le contenu du cahier vit dans IndexedDB, pas dans localStorage. Raison :
   localStorage plafonne autour de 5 Mo, et un semestre importé en pèse
   davantage. Quand il déborde, TOUTES les écritures échouent — y compris
   celle de la clé API, quelques dizaines d'octets, qui n'a plus de place.
   localStorage ne garde donc plus que la configuration : clés, préférences.
   ------------------------------------------------------------------ */
const IDB_NOM = "cahier-bba", IDB_STORE = "espace";
let idbPromesse = null;
function idb(){
  if(idbPromesse) return idbPromesse;
  idbPromesse = new Promise((ok, ko)=>{
    if(typeof indexedDB === "undefined") return ko(new Error("IndexedDB indisponible"));
    const r = indexedDB.open(IDB_NOM, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = ()=>ok(r.result);
    r.onerror   = ()=>ko(r.error || new Error("ouverture refusée"));
  }).catch(e=>{ idbPromesse = null; throw e; });
  return idbPromesse;
}
function idbEcrire(cle, val){
  return idb().then(d=>new Promise((ok, ko)=>{
    const t = d.transaction(IDB_STORE, "readwrite");
    t.objectStore(IDB_STORE).put(val, cle);
    t.oncomplete = ()=>ok(true);
    t.onerror = t.onabort = ()=>ko(t.error || new Error("écriture refusée"));
  }));
}
function idbLire(cle){
  return idb().then(d=>new Promise((ok, ko)=>{
    const t = d.transaction(IDB_STORE, "readonly");
    const q = t.objectStore(IDB_STORE).get(cle);
    q.onsuccess = ()=>ok(q.result);
    q.onerror   = ()=>ko(q.error || new Error("lecture refusée"));
  }));
}

/* =========================================================
   SYNCHRONISATION EN LIGNE — Supabase
   Le cahier doit vivre sur internet, pas dans un navigateur : on ouvre le
   site depuis n'importe quel appareil, on se connecte, tout est là. Le
   stockage local devient un simple cache hors ligne.
   Aucune bibliothèque : l'API REST de Supabase suffit, et deux appels.
   ========================================================= */
const S_SUPA = LS_KEY + "-supabase";
const SUPA = { url:"", cle:"", code:"", etat:"éteint" };

function chargerSupa(){
  try{
    const d = JSON.parse(localStorage.getItem(S_SUPA) || "{}");
    SUPA.url = d.url || ""; SUPA.cle = d.cle || ""; SUPA.code = d.code || "";
  }catch(e){}
  // Le lien de partage porte tout : ouvrir ce lien sur un appareil neuf
  // suffit à retrouver son cahier, sans rien saisir.
  try{
    const h = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
    if(h.get("u") && h.get("k") && h.get("c")){
      SUPA.url = h.get("u"); SUPA.cle = h.get("k"); SUPA.code = h.get("c");
      enregistrerSupa();
      history.replaceState(null, "", location.pathname + location.search);
    }
  }catch(e){}
  SUPA.etat = supaActif() ? "en ligne" : "éteint";
}

// Ouvrir son favori alors que le site est déjà affiché ne recharge pas la
// page : sans cette écoute, le lien serait ignoré et l'étudiant croirait
// que son cahier a disparu.
window.addEventListener("hashchange", async ()=>{
  const avant = SUPA.code;
  chargerSupa();
  if(SUPA.code && SUPA.code !== avant){
    toast("Lien reconnu — récupération du cahier…", 3000);
    try{
      const d = await supaLire();
      if(d && (d.items.length || d.matieres.length)){
        appliquer(fusionnerCahiers(contenuCahier(), d));
        localSave(); render();
        toast(d.items.length + " document(s) retrouvés.", 4000);
      }
    }catch(e){ toast("Lien reconnu, mais le serveur n'a pas répondu.", 4000); }
  }
});
function enregistrerSupa(){
  try{ localStorage.setItem(S_SUPA, JSON.stringify({ url:SUPA.url, cle:SUPA.cle, code:SUPA.code })); }
  catch(e){ toast("Impossible de retenir le lien sur cet appareil.", 5000); }
}
const supaActif = () => !!(SUPA.url && SUPA.cle && SUPA.code);

function lienCahier(){
  if(!supaActif()) return "";
  const p = new URLSearchParams({ u:SUPA.url, k:SUPA.cle, c:SUPA.code });
  return location.origin + location.pathname + "#" + p.toString();
}

function nouveauCode(){
  const a = new Uint8Array(24);
  (self.crypto || window.crypto).getRandomValues(a);
  return [...a].map(x=>("0"+x.toString(16)).slice(-2)).join("");
}

/* Les deux seuls appels réseau : une fonction pour lire, une pour écrire.
   Le code secret voyage dans le corps de la requête, jamais dans l'URL. */
/* L'extraction des PDF laisse parfois des caracteres de controle — dont
   l'octet nul, que PostgreSQL refuse dans du JSON. Sans ce nettoyage, une
   seule page mal encodee bloquait toute la sauvegarde en ligne. */
const CTRL = new RegExp("[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F]", "g");
function assainir(x){
  if(typeof x === "string") return x.replace(CTRL, "");
  if(Array.isArray(x)) return x.map(assainir);
  if(x && typeof x === "object"){
    const o = {};
    for(const k in x) if(Object.prototype.hasOwnProperty.call(x,k)) o[k] = assainir(x[k]);
    return o;
  }
  return x;
}

async function supaRPC(fonction, args){
  args = assainir(args);
  const corps = JSON.stringify(args);
  // Une borne reste nécessaire (un serveur injoignable ne doit pas bloquer la
  // synchronisation), mais elle doit couvrir le TRANSFERT : le cahier pèse
  // plusieurs Mo depuis la transcription des scans, et 10 s ne suffisaient pas
  // pour l'envoyer ou le recevoir sur une connexion de téléphone. L'affichage,
  // lui, n'attend jamais le réseau (voir loadAll).
  const delai = Math.min(180000, Math.max(60000, 20000 + Math.round(corps.length / 40)));
  const ctl = new AbortController();
  const minuteur = setTimeout(()=>ctl.abort(), delai);
  let r, donnees;
  try{
    r = await fetch(SUPA.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fonction, {
      method:"POST", signal: ctl.signal,
      headers:{ "apikey":SUPA.cle, "Authorization":"Bearer "+SUPA.cle, "Content-Type":"application/json" },
      body: corps
    });
    if(!r.ok){
      const t = await r.text().catch(()=>"" );
      let aide = "";
      if(r.status === 404) aide = " — le SQL n'a pas été exécuté, ou pas dans ce projet.";
      else if(r.status === 401 || r.status === 403) aide = " — la clé ne correspond pas à ce projet.";
      else if(r.status === 405) aide = " — l'adresse du projet semble incorrecte.";
      throw Object.assign(new Error("HTTP " + r.status + aide + (t ? " " + t.slice(0,140) : "")), { http:true });
    }
    // La lecture du corps fait partie du transfert : elle reste sous la même borne.
    const texte = await r.text();
    donnees = texte ? JSON.parse(texte) : null;
  }catch(e){
    if(e && e.http) throw e;
    throw new Error(e && e.name === "AbortError"
      ? "connexion trop lente : transfert non terminé en " + Math.round(delai/1000) + " secondes, nouvel essai automatique"
      : (e instanceof SyntaxError ? "réponse du serveur incomplète, nouvel essai automatique" : "serveur injoignable"));
  }finally{ clearTimeout(minuteur); }
  return donnees;
}

async function supaLire(){
  const c = await supaRPC("cahier_lire", { c: SUPA.code });
  if(!c) return null;
  return { matieres:c.matieres||[], chapitres:c.chapitres||[], items:c.items||[],
           supprimes:c.supprimes||{ items:[], chapitres:[], matieres:[] } };
}

/* Écriture brute. N'est appelée QUE par synchroniser(), après fusion. */
async function ecrireEnLigne(c){
  await supaRPC("cahier_ecrire", { c: SUPA.code, j: c });
}

/* Les sauvegardes déclenchent une synchronisation regroupée : plusieurs
   modifications rapprochées ne font qu'un aller-retour. */
let minuterieSync = null, attentesSync = [], syncEnCours = null, syncEncore = false;
function supaEcrire(){
  if(!supaActif()) return Promise.resolve(false);
  clearTimeout(minuterieSync);
  return new Promise(ok=>{
    attentesSync.push(ok);
    minuterieSync = setTimeout(async ()=>{
      const l = attentesSync; attentesSync = [];
      const r = await synchroniser();
      l.forEach(f=>f(r));
    }, 1500);
  });
}
function synchroniser(){
  if(syncEnCours){ syncEncore = true; return syncEnCours; }
  syncEnCours = (async ()=>{
    try{ return await rejoindreEnLigne(); }
    finally{
      syncEnCours = null;
      if(syncEncore){ syncEncore = false; synchroniser(); }
    }
  })();
  return syncEnCours;
}

/* =========================================================
   FILET DE SÉCURITÉ
   Un classeur de cours ne doit jamais perdre une ligne écrite à la main.
   Avant toute opération destructrice — suppression d'une matière, d'un
   chapitre, d'un document, ou import massif — on prend un instantané
   complet. Dix sont conservés, dans IndexedDB, indépendants du contenu
   courant : même une suppression totale reste réversible.
   ========================================================= */
const MAX_INSTANTANES = 10;

async function instantane(motif){
  try{
    const liste = (await idbLire("sauvegardes")) || [];
    liste.unshift({
      date: new Date().toISOString(), motif: motif || "automatique",
      matieres: state.matieres, chapitres: state.chapitres, items: state.items,
      compte: { m: state.matieres.length, c: state.chapitres.length, d: state.items.length }
    });
    await idbEcrire("sauvegardes", liste.slice(0, MAX_INSTANTANES));
    return true;
  }catch(e){ return false; }
}

/* Ratisse TOUS les emplacements possibles, et rend compte de chacun — y
   compris vide ou en erreur. Un écran qui répond « rien trouvé » sans dire
   où il a cherché ne permet ni de conclure ni de chercher ailleurs. */
async function fouillerStockages(){
  const trouvailles = [], journal = [];

  async function sonder(nom, lire){
    try{
      const d = await lire();
      const n = d && (d.items||[]).length;
      journal.push({ ou:nom, etat: n ? n + " document(s)" : (d ? "présent mais vide" : "absent") });
      return d && n ? d : null;
    }catch(e){
      journal.push({ ou:nom, etat:"illisible — " + ((e && e.message) || "erreur") });
      return null;
    }
  }

  const c = await sonder("IndexedDB — contenu courant", ()=>idbLire("contenu"));
  if(c) trouvailles.push({ ou:"IndexedDB — contenu courant", d:c });

  // Le compte Claude : la version artifact y range tout, et ce stockage
  // survit au navigateur, à l'appareil, et à un vidage de cache.
  if(db){
    try{
      const snap = await db.doc("espace/structure").get();
      const q = await db.collection("items").limit(1000).get();
      const items = q.docs.map(x=>({ id:x.id, ...x.data() }));
      const st = snap.exists ? (snap.data()||{}) : {};
      journal.push({ ou:"Compte Claude (synchronisé)", etat: items.length ? items.length + " document(s)" : "vide" });
      if(items.length) trouvailles.push({ ou:"Compte Claude (synchronisé)",
        d:{ matieres:st.matieres||[], chapitres:st.chapitres||[], items } });
    }catch(e){ journal.push({ ou:"Compte Claude (synchronisé)", etat:"illisible — " + ((e&&e.message)||"erreur") }); }
  }else{
    journal.push({ ou:"Compte Claude (synchronisé)", etat:"indisponible dans cette version" });
  }

  try{
    const l = (await idbLire("sauvegardes")) || [];
    journal.push({ ou:"Instantanés automatiques", etat: l.length ? l.length + " état(s) conservé(s)" : "aucun — le filet a été posé après ta perte" });
    l.forEach(x=>trouvailles.push({ ou:"Instantané du " + new Date(x.date).toLocaleString("fr-FR") + " (" + x.motif + ")", d:x }));
  }catch(e){ journal.push({ ou:"Instantanés automatiques", etat:"illisibles" }); }

  for(const k of [LS_KEY, "cahier-bba", "cahier-bba-v0", "cahier"]){
    const d = await sonder("Ancien stockage « "+k+" »", async ()=>{
      const brut = localStorage.getItem(k);
      return brut ? JSON.parse(brut) : null;
    });
    if(d) trouvailles.push({ ou:"Ancien stockage « "+k+" »", d });
  }
  return { trouvailles, journal };
}

const SQL_SUPA = [
"-- À coller dans Supabase → SQL Editor → Run",
"drop table if exists cahier cascade;",
"create table cahier (",
"  code text primary key,",
"  contenu jsonb not null default '{}'::jsonb,",
"  maj timestamptz not null default now()",
");",
"alter table cahier enable row level security;",
"-- Aucun accès direct : tout passe par les deux fonctions ci-dessous,",
"-- qui exigent le code secret du cahier.",
"create or replace function cahier_lire(c text)",
"returns jsonb language sql security definer set search_path = public as $$",
"  select contenu from cahier where code = c;",
"$$;",
"create or replace function cahier_ecrire(c text, j jsonb)",
"returns void language sql security definer set search_path = public as $$",
"  insert into cahier(code, contenu, maj) values (c, j, now())",
"  on conflict (code) do update set contenu = excluded.contenu, maj = now();",
"$$;",
"grant execute on function cahier_lire(text)  to anon, authenticated;",
"grant execute on function cahier_ecrire(text, jsonb) to anon, authenticated;"
].join("\n");

/* Reconnaît l'adresse du projet et la clé publique dans n'importe quel
   copier-coller. Deux formats de clé coexistent chez Supabase : l'ancien
   JWT « eyJ… » et le nouveau « sb_publishable_… ». */
function extraireSupa(txt){
  const t = String(txt || "");
  let url = (t.match(/https?:\/\/[a-z0-9-]+\.supabase\.(?:co|in)/i) || [])[0] || "";
  // L'adresse du projet se déduit de celle du tableau de bord : coller
  // n'importe quelle page de son projet suffit, inutile de la chercher.
  if(!url){
    const ref = (t.match(/dashboard\/project\/([a-z0-9]{16,})/i) || [])[1];
    if(ref) url = "https://" + ref + ".supabase.co";
  }
  let cle = (t.match(/sb_publishable_[A-Za-z0-9_-]{10,}/) || [])[0] || "";
  if(!cle){
    const jwts = t.match(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g) || [];
    for(const k of jwts){
      try{
        const r = JSON.parse(atob(k.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role;
        if(r === "anon"){ cle = k; break; }        // jamais « service_role »
      }catch(e){}
    }
  }
  return { url, cle };
}

/* Contenu complet du cahier. « supprimes » garde la trace des éléments effacés,
   pour qu'une fusion entre appareils ne les fasse pas réapparaître. */
function contenuCahier(){
  return { matieres:state.matieres, chapitres:state.chapitres, items:state.items,
           supprimes: state.supprimes || { items:[], chapitres:[], matieres:[] } };
}
function appliquer(c){
  state.matieres = c.matieres || []; state.chapitres = c.chapitres || []; state.items = c.items || [];
  state.supprimes = c.supprimes || { items:[], chapitres:[], matieres:[] };
}
function enterrer(genre, id){
  state.supprimes = state.supprimes || { items:[], chapitres:[], matieres:[] };
  const l = state.supprimes[genre] = state.supprimes[genre] || [];
  if(id && l.indexOf(id) < 0){ l.push(id); if(l.length > 3000) l.splice(0, l.length - 3000); }
}

/* FUSION de deux états du cahier — le cœur de la synchronisation.
   Aucune écriture en ligne n'écrase plus ce qui s'y trouve : on lit, on fusionne,
   puis on écrit le résultat. C'est ce qui manquait quand un navigateur neuf a
   remplacé les 364 documents du semestre par ses onze matières vides.
   Règles : union par identifiant ; la version la plus récente (maj, sinon date)
   l'emporte, l'appareil local à égalité ; un élément enterré ne revient jamais ;
   un même fichier importé sous deux identifiants n'est gardé qu'une fois ; les
   matières vides en double (même nom) sont écartées. */
function fusionnerCahiers(loc, dist){
  loc = loc || {}; dist = dist || {};
  const V = { items:[], chapitres:[], matieres:[] };
  const tL = loc.supprimes || V, tD = dist.supprimes || V;
  const supprimes = {};
  for(const k of ["items","chapitres","matieres"]){
    supprimes[k] = [...new Set([...(tD[k]||[]), ...(tL[k]||[])])].slice(-3000);
  }
  const quand = x => String(x.maj || x.date || "");
  function union(k){
    const mort = new Set(supprimes[k]), res = new Map();
    for(const x of (dist[k]||[])) if(x && x.id && !mort.has(x.id)) res.set(x.id, x);
    for(const x of (loc[k]||[])){
      if(!x || !x.id || mort.has(x.id)) continue;
      const y = res.get(x.id);
      if(!y || quand(x) >= quand(y)) res.set(x.id, x);
    }
    return [...res.values()];
  }
  let items = union("items");
  const parChemin = new Map(), libres = [];
  const valeur = z => (z.scan ? 0 : 1e8) + String(z.contenu||"").length;
  for(const it of items){
    if(!it.chemin){ libres.push(it); continue; }
    const y = parChemin.get(it.chemin);
    if(!y || valeur(it) > valeur(y) || (valeur(it) === valeur(y) && quand(it) > quand(y))) parChemin.set(it.chemin, it);
  }
  items = libres.concat([...parChemin.values()]);
  const chapitres = union("chapitres");
  let matieres = union("matieres");
  const occupee = id => items.some(i=>i.matiereId===id) || chapitres.some(c=>c.matiereId===id);
  const enLigne = new Set((dist.matieres||[]).map(x=>x.id));
  const nom = x => String(x.nom||"").trim().toLowerCase();
  const garde = matieres.filter(x => occupee(x.id) || enLigne.has(x.id) || !(dist.matieres||[]).length);
  const noms = new Set(garde.map(nom));
  for(const x of matieres) if(garde.indexOf(x) < 0 && !noms.has(nom(x))){ garde.push(x); noms.add(nom(x)); }
  matieres = garde.sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  return { matieres, chapitres, items, supprimes };
}

/* Empreinte légère : sert à savoir s'il faut écrire, sans comparer 2 Mo de texte. */
function empreinte(c){
  c = c || {};
  const it = (c.items||[]).map(i=>i.id+":"+(i.chapitreId||"")+":"+(i.ordre==null?"":i.ordre)+":"+(i.maj||i.date||"")
    +":"+String(i.contenu||"").length+":"+(i.titre||"")+":"+(i.scan?1:0)).sort().join("|");
  const ch = (c.chapitres||[]).map(x=>x.id+":"+x.titre+":"+x.numero+":"+x.statut+":"+x.matiereId).sort().join("|");
  const ma = (c.matieres||[]).map(x=>x.id+":"+x.nom+":"+(x.code||"")+":"+(x.prof||"")).sort().join("|");
  const t = c.supprimes || {};
  return [it, ch, ma, (t.items||[]).length, (t.chapitres||[]).length, (t.matieres||[]).length].join("#");
}

let quotaSignale = false;
function localSave(){
  // Le cahier part en ligne à chaque changement ; le stockage de l'appareil
  // n'est plus qu'un cache pour travailler hors connexion.
  if(supaActif()) supaEcrire();
  const paquet = contenuCahier();
  idbEcrire("contenu", paquet).catch(e=>{
    // Repli : seulement si le cahier est assez petit pour y tenir. Sinon on
    // préfère ne rien écrire plutôt que de saturer la place de la clé API.
    try{
      const txt = JSON.stringify(paquet);
      if(txt.length < 1500000) localStorage.setItem(LS_KEY, txt);
      else throw new Error("trop volumineux pour le stockage de secours");
    }catch(e2){
      if(!quotaSignale){
        quotaSignale = true;
        toast("Sauvegarde locale impossible sur cet appareil — exporte ton cahier en JSON pour ne rien perdre.", 6000);
      }
    }
  });
}

/* Le contenu a longtemps vécu dans localStorage : on le déménage une fois,
   puis on libère la place — c'est elle qui manquait à la clé API. */
async function migrerDepuisLocalStorage(){
  let brut = null;
  try{ brut = localStorage.getItem(LS_KEY); }catch(e){ return null; }
  if(!brut) return null;
  let d = null;
  try{ d = JSON.parse(brut); }catch(e){ return null; }
  try{
    await idbEcrire("contenu", { matieres:d.matieres||[], chapitres:d.chapitres||[], items:d.items||[] });
    localStorage.removeItem(LS_KEY);      // la place ainsi rendue est celle de la configuration
  }catch(e){ /* IndexedDB refusée : on garde l'ancien emplacement */ }
  return d;
}

async function saveStructure(){
  localSave();
  if(!db) return;
  try{
    await db.doc("espace/structure").set({ matieres: state.matieres, chapitres: state.chapitres });
  }catch(e){ toast("Sauvegarde en ligne indisponible — gardé sur cet appareil."); }
}

async function saveItem(it){
  it.maj = new Date().toISOString();
  localSave();
  if(!db) return;
  try{
    const {id, ...body} = it;
    await db.doc("items/" + id).set(body);
  }catch(e){ toast("Sauvegarde en ligne indisponible — gardé sur cet appareil."); }
}

async function deleteItem(id){
  enterrer("items", id);
  state.items = state.items.filter(x=>x.id!==id);
  localSave();
  if(db){ try{ await db.doc("items/"+id).delete(); }catch(e){} }
}

async function loadAll(){
  let loadedRemote = false;
  if(db){
    try{
      const snap = await db.doc("espace/structure").get();
      if(snap.exists){
        const d = snap.data() || {};
        state.matieres = Array.isArray(d.matieres) ? d.matieres.map(o=>({...o})) : [];
        state.chapitres = Array.isArray(d.chapitres) ? d.chapitres.map(o=>({...o})) : [];
        loadedRemote = true;
      }
      const q = await db.collection("items").limit(1000).get();
      state.items = q.docs.map(d=>({ id:d.id, ...d.data() }));
      if(q.size) loadedRemote = true;
    }catch(e){ loadedRemote = false; }
  }
  if(!loadedRemote){
    let d = null;
    try{ d = await idbLire("contenu"); }catch(e){}
    if(!d) d = await migrerDepuisLocalStorage();
    if(d){
      appliquer(d);
      // Plus d'envoi ici : on n'écrit jamais en ligne avant d'avoir lu et fusionné.
    }
  }
  state.loaded = true;
}

/* Le cahier en ligne est rapatrié APRÈS le premier affichage : la page doit
   apparaître instantanément, avec ce que l'appareil connaît déjà, puis se
   mettre à jour. Aucune panne réseau ne peut plus laisser un écran vide. */
let relanceSync = null;
async function rejoindreEnLigne(){
  if(!supaActif()) return false;
  try{
    const dist = (await supaLire()) || { matieres:[], chapitres:[], items:[] };
    const loc = contenuCahier();
    const f = fusionnerCahiers(loc, dist);
    // Filet ultime : une fusion ne doit jamais vider un cahier qui contient des documents.
    if(dist.items.length && !f.items.length) throw new Error("synchronisation refusée : elle aurait vidé le cahier en ligne");
    const e = empreinte(f);
    if(e !== empreinte(loc)){
      appliquer(f);
      idbEcrire("contenu", contenuCahier()).catch(()=>{});
      render();
    }
    if(e !== empreinte(dist) && (f.items.length || f.matieres.length)) await ecrireEnLigne(f);
    SUPA.etat = "en ligne";
    majBandeau();
    return true;
  }catch(e){
    SUPA.etat = "hors ligne";
    majBandeau(e && e.message);
    if(!relanceSync) relanceSync = setTimeout(()=>{ relanceSync = null; synchroniser(); }, 30000);
    return false;
  }
}

/* ---------- sélecteurs ---------- */
const matById  = id => state.matieres.find(m=>m.id===id);
const chapById = id => state.chapitres.find(c=>c.id===id);
const chapsOf  = mid => state.chapitres.filter(c=>c.matiereId===mid)
                        .sort((a,b)=>(a.numero||0)-(b.numero||0) || String(a.titre).localeCompare(String(b.titre)));
/* Un cours suit l'ordre de la matière, pas celui où les fichiers ont été
   déposés. « ordre » est fixé par l'étudiant et l'emporte ; à défaut on
   retombe sur la date d'ajout. */
const rang = i => (i.ordre === undefined || i.ordre === null) ? 1e9 : Number(i.ordre);
const itemsOf  = cid => state.items.filter(i=>i.chapitreId===cid)
                        .sort((a,b)=> rang(a) - rang(b)
                              || String(a.date||"").localeCompare(String(b.date||"")));

/* Renumérote un thème d'après l'ordre affiché, puis enregistre. */
async function reordonner(cid, id, sens){
  const l = itemsOf(cid);
  const i = l.findIndex(x=>x.id===id);
  const j = i + sens;
  if(i < 0 || j < 0 || j >= l.length) return;
  l.splice(j, 0, l.splice(i, 1)[0]);
  for(let n = 0; n < l.length; n++){
    if(l[n].ordre !== n){ l[n].ordre = n; await saveItem(l[n]); }
  }
  render();
}
const itemsOfMat = mid => state.items.filter(i=>i.matiereId===mid);

/* =========================================================
   2. MARKDOWN (rendu minimal, sûr)
   ========================================================= */
/* Formules : KaTeX (chargé depuis cdnjs) les dessine comme dans un manuel.
   Sans lui — hors ligne, ou formule mal écrite — on montre le LaTeX brut
   plutôt que rien. */
function rendreMaths(tex, bloc){
  tex = String(tex || "").trim();
  if(!tex) return "";
  if(window.katex){
    try{
      return katex.renderToString(tex, { displayMode: !!bloc, throwOnError: true, strict: "ignore", output: "html" });
    }catch(e){ /* formule invalide : on retombe sur le texte brut */ }
  }
  return bloc ? '<span class="maths-bloc"><code>'+esc(tex)+"</code></span>" : "<code>"+esc(tex)+"</code>";
}

function md(src){
  if(!src) return "";
  const lines = String(src).replace(/\r/g,"").split("\n");
  let out = [], i = 0, listType = null;

  // Formules et code sont mis de côté AVANT l'échappement et la mise en forme :
  // sinon « ** » ou « == » autour d'une formule, ou un « * » du LaTeX, cassent
  // tout et l'étudiant ne lit plus qu'une suite de symboles.
  const inline = t => { const gardes = [], garder = h => "\u0001" + (gardes.push(h) - 1) + "\u0002";
    return esc(String(t == null ? "" : t)
      // Surlignage ou gras posé autour d'une formule centrée : la formule suffit.
      .replace(/(==|\*\*)\s*(\$\$[^$]+?\$\$)\s*\1/g, "$2")
      .replace(/`([^`]+)`/g, (m,x)=>garder("<code>"+esc(x)+"</code>"))
      .replace(/\$\$([^$]+?)\$\$/g, (m,x)=>garder(rendreMaths(x, true)))
      .replace(/\\\[([\s\S]+?)\\\]/g, (m,x)=>garder(rendreMaths(x, true)))
      .replace(/\\\(([\s\S]+?)\\\)/g, (m,x)=>garder(rendreMaths(x, false)))
      // Formule mal délimitée par l'IA (« $ \geqslant x$ ») : une commande LaTeX suffit à la reconnaître.
      .replace(/\$\s+(\\[A-Za-z][^$\n]*?)\s*\$(?!\d)/g, (m,x)=>garder(rendreMaths(x, false)))
      .replace(/\$(?![\s$])([^$\n]*?[^\s$\\])\$(?!\d)/g, (m,x)=>garder(rendreMaths(x, false))))
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (m,txt,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+txt+"</a>")
    // Marques relevées sur une page manuscrite : elles doivent se distinguer
    // du texte du cours, sinon l'information qu'elles portent se perd.
    .replace(/\[(sch[ée]ma|figure|graphique)\s*:\s*([^\]]+)\]/gi,
      (m,quoi,desc)=>'<span class="vu-schema"><b>'+quoi+'</b> '+desc+"</span>")
    .replace(/\[(fl[èe]che\s*:\s*[^\]]+)\]/gi, (m,x)=>'<span class="vu-lien">'+x+"</span>")
    .replace(/\[(encadr[ée]|entour[ée]|soulign[ée]|signal[ée]|surlign[ée][^\]]*|[ée]crit en [^\]]+|marge)\]/gi,
      (m,x)=>'<span class="vu-marque">'+x+"</span>")
    .replace(/\[illisible\]/gi, '<span class="vu-doute">illisible</span>')
    .replace(/(\S+)\[\?\]/g, (m,mot)=>'<span class="vu-doute" title="lecture incertaine">'+mot+"</span>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/==([^=]+)==/g, "<mark>$1</mark>")
    .replace(/\u0001(\d+)\u0002/g, (m,n)=>gardes[+n]); };

  const closeList = ()=>{ if(listType){ out.push("</"+listType+">"); listType=null; } };

  while(i < lines.length){
    const l = lines[i];

    // Formule sur plusieurs lignes : $$ (ou \[) ouvert sans être refermé sur la même ligne.
    const ouvre = l.trim().match(/^(\$\$|\\\[)(.*)$/);
    if(ouvre && (ouvre[1] === "$$" ? ouvre[2].indexOf("$$") < 0 : ouvre[2].indexOf("\\]") < 0)){
      const ferme = ouvre[1] === "$$" ? "$$" : "\\]";
      const buf = [ouvre[2]]; let j = i + 1;
      while(j < lines.length && lines[j].indexOf(ferme) < 0) buf.push(lines[j++]);
      if(j < lines.length){
        closeList();
        const k = lines[j].indexOf(ferme);
        buf.push(lines[j].slice(0, k));
        out.push('<div class="maths-bloc">' + rendreMaths(buf.join("\n"), true) + "</div>");
        const reste = lines[j].slice(k + ferme.length).trim();
        if(reste) out.push("<p>" + inline(reste) + "</p>");
        i = j + 1; continue;
      }
    }

    if(/^```/.test(l)){
      closeList(); const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(l); i += 2;
      let html = '<div class="tablewrap"><table><thead><tr>'+head.map(h=>"<th>"+inline(h)+"</th>").join("")+"</tr></thead><tbody>";
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        html += "<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++;
      }
      out.push(html+"</tbody></table></div>"); continue;
    }
    let m;
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); const n = Math.min(m[1].length+1, 4);
      out.push("<h"+n+">"+inline(m[2])+"</h"+n+">"); i++; continue;
    }
    if(/^\s*([-*_])\s*\1\s*\1[\s-*_]*$/.test(l)){ closeList(); out.push("<hr>"); i++; continue; }
    if((m = l.match(/^\s*>\s?(.*)$/))){ closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); i++; continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)$/))){
      if(listType!=="ul"){ closeList(); out.push("<ul>"); listType="ul"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(listType!=="ol"){ closeList(); out.push("<ol>"); listType="ol"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if(!l.trim()){ closeList(); i++; continue; }
    closeList();
    const buf=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(\s*[-*•\d>#`]|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>"+inline(buf.join(" "))+"</p>");
  }
  closeList();
  return out.join("\n");
}
/* =========================================================
   5. COUCHE IA — deux moteurs, une seule interface
   -----------------------------------------------------
   mode "artifact" : page ouverte depuis Claude → capacité `sample`.
                     Pas d'accès réseau (CSP) ; images selon la vue.
   mode "api"      : page hébergée ou servie en local → appel direct
                     à l'API Anthropic avec la clé de l'étudiant.
                     Vision disponible : l'OCR tourne dans l'outil.
   ========================================================= */
const FOURNISSEURS = {
  anthropic: {
    nom: "Claude (Anthropic)",
    modeleDefaut: "claude-opus-5",
    note: "Qualité de référence. Payant à l'usage, pas de palier gratuit.",
    lienCle: "console.anthropic.com → API Keys"
  },
  gemini: {
    nom: "Gemini (Google)",
    modeleDefaut: "gemini-2.5-flash",
    note: "Palier gratuit disponible. Sur ce palier, Google peut utiliser les contenus envoyés pour améliorer ses services.",
    lienCle: "aistudio.google.com → Get API key"
  }
};

const IA = {
  mode: "off",            // "artifact" | "api" | "off"
  fournisseur: "gemini",  // "anthropic" | "gemini"
  modele: "",
  vision: false,          // l'OCR photo est-il réellement disponible ?
  cles: { anthropic:"", gemini:"" },
  detail: ""
};

const S_FOURN = LS_KEY + "-fournisseur", S_MODELE = LS_KEY + "-modele";
const S_CLE = { anthropic: LS_KEY + "-key", gemini: LS_KEY + "-key-gemini" };

function cleActive(){ return IA.cles[IA.fournisseur] || ""; }

/* Qualité d'envoi des photos : « fine » préserve les traits ténus au prix
   de quelques jetons de plus. Utile sur du crayon pâle ou une écriture serrée. */
const S_QUALITE = LS_KEY + "-qualite-photo";
function qualiteFine(){
  try{ return localStorage.getItem(S_QUALITE) === "fine"; }catch(e){ return false; }
}
function reglerQualite(v){
  try{ localStorage.setItem(S_QUALITE, v); }catch(e){}
}

function chargerConfig(){
  try{
    IA.fournisseur = localStorage.getItem(S_FOURN) || "gemini";
    if(!FOURNISSEURS[IA.fournisseur]) IA.fournisseur = "gemini";
    IA.modele = localStorage.getItem(S_MODELE) || "";
    IA.cles.anthropic = localStorage.getItem(S_CLE.anthropic) || "";
    IA.cles.gemini    = localStorage.getItem(S_CLE.gemini) || "";
  }catch(e){}
  if(!IA.modele) IA.modele = FOURNISSEURS[IA.fournisseur].modeleDefaut;
}

function enregistrerConfig({ fournisseur, cle, modele }){
  let echec = null;
  try{
    if(fournisseur && FOURNISSEURS[fournisseur]){
      IA.fournisseur = fournisseur;
      localStorage.setItem(S_FOURN, fournisseur);
      // On n'impose le modèle par défaut que s'il n'y en a aucun d'enregistré :
      // écraser un modèle déjà validé par une valeur codée en dur relançait
      // toute la recherche, et le nom figé finit toujours par disparaître du
      // catalogue du fournisseur.
      if(modele === undefined && !localStorage.getItem(S_MODELE)){
        IA.modele = FOURNISSEURS[fournisseur].modeleDefaut;
        localStorage.setItem(S_MODELE, IA.modele);
      }
    }
    if(cle !== undefined){
      IA.cles[IA.fournisseur] = (cle||"").trim();
      const k = S_CLE[IA.fournisseur];
      IA.cles[IA.fournisseur] ? localStorage.setItem(k, IA.cles[IA.fournisseur]) : localStorage.removeItem(k);
    }
    if(modele !== undefined && modele){
      IA.modele = modele; localStorage.setItem(S_MODELE, modele);
      reintegrerModele(modele);   // un choix explicite lève une exclusion passée
    }
  }catch(e){
    // Une écriture de configuration qui échoue sans rien dire est pire qu'une
    // erreur : l'étudiant croit sa clé enregistrée et la retrouve absente au
    // rechargement suivant. C'était le cas quand le contenu du cahier saturait
    // localStorage — d'où le déplacement du contenu vers IndexedDB.
    echec = e;
    const plein = e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014);
    toast(plein
      ? "Stockage du navigateur saturé : la clé n'a pas pu être enregistrée. Va dans Réglages → Stockage pour libérer de la place."
      : "Enregistrement impossible : " + ((e && e.message) || "stockage refusé par le navigateur"), 6500);
  }
  majMode();
  return !echec;
}

/* La page peut-elle joindre le réseau ? Un artifact publié ne le peut pas. */
const RESEAU_POSSIBLE = !(typeof claude !== "undefined" && claude && claude.use);

function majMode(){
  if(RESEAU_POSSIBLE && cleActive()){
    IA.mode = "api"; IA.vision = true;
    IA.detail = "l'outil parle directement à " + FOURNISSEURS[IA.fournisseur].nom + " ("+IA.modele+") avec ta clé. Tout tourne ici, OCR compris.";
  }else if(aiOn){
    IA.mode = "artifact"; IA.vision = !!imgLim && !imagesKO;
    IA.detail = IA.vision ? "l'assistant de Claude répond et lit les images."
      : "l'assistant de Claude répond, mais cette vue ne lui transmet pas les images. Pour l'OCR, ouvre la version hébergée du fichier avec ta clé API.";
  }else if(RESEAU_POSSIBLE){
    IA.mode = "off"; IA.vision = false;
    IA.detail = "aucune clé API enregistrée. Le classeur fonctionne ; l'IA et l'OCR sont éteints.";
  }else{
    IA.mode = "off"; IA.vision = false;
    IA.detail = "assistant indisponible dans cette vue.";
  }
}

/* ---------- préparation des images ----------
   Sur une page manuscrite, ce sont les traits fins — une accolade, un
   soulignement, la limite d'un surlignage pâle — qui disparaissent en
   premier. On préserve donc la définition et on compresse peu : le coût
   d'un jeton de plus est sans commune mesure avec celui d'une notion
   perdue. Le lissage du navigateur est désactivé pour ne pas noyer les
   traits d'un stylo fin. */
const MAX_COTE_STD  = 2400;   // suffisant pour une page A4 dense
const MAX_COTE_FIN  = 3000;   // écriture serrée, crayon pâle, annotations fines
const QUALITE_STD   = 0.92;
const QUALITE_FINE  = 0.96;

function imageEnBase64(file, opts){
  opts = opts || {};
  const cote = opts.fin ? MAX_COTE_FIN : MAX_COTE_STD;
  const qualite = opts.fin ? QUALITE_FINE : QUALITE_STD;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      // On n'agrandit jamais : une photo déjà petite ne gagne rien à être étirée.
      const ratio = Math.min(1, cote / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width  = Math.max(1, Math.round(img.width  * ratio));
      c.height = Math.max(1, Math.round(img.height * ratio));
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = ratio < 1;
      if(ratio < 1) g.imageSmoothingQuality = "high";
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL("image/jpeg", qualite);
      resolve({ media: "image/jpeg", b64: data.slice(data.indexOf(",")+1) });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("image illisible")); };
    img.src = url;
  });
}

/* =========================================================
   LECTURE D'UNE PAGE MANUSCRITE
   Une page de cours n'est pas du texte : c'est du texte annoté. Ce qui
   est encadré, souligné trois fois ou écrit en rouge porte l'information
   la plus dense de la page — c'est ce que le professeur a jugé décisif.
   Transcrire en oubliant ces marques revient à jeter le tri déjà fait.
   Ces consignes demandent donc de restituer le sens de chaque marque,
   pas seulement les mots.
   ========================================================= */
/* =========================================================
   RÈGLE DE CLASSEMENT — par thème, jamais par étiquette
   « Séance 4 », « TD 2 », « Chapitre 1 » disent où le professeur en était
   dans son calendrier, pas de quoi le document parle. Deux séances peuvent
   traiter la même notion, une même séance en aborder deux. Classer sur ces
   étiquettes fabrique un classeur qui suit un emploi du temps au lieu de
   suivre le savoir — et qui devient inutilisable pour réviser.
   La numérotation des chapitres appartient à l'étudiant : elle vient du
   programme qu'il colle, jamais d'un nom de fichier.
   ========================================================= */
const REGLE_THEME =
  "RÈGLE DE CLASSEMENT — impérative :\n"
  + "Classe toujours par THÈME, c'est-à-dire par la notion réellement traitée.\n"
  + "Ignore complètement, pour décider du classement et pour nommer un thème, toute étiquette "
  + "administrative : « Séance 3 », « TD 2 », « Cours n°5 », « Chapitre 1 », « Partie II », "
  + "« Semaine 4 », « Fiche 7 », une date, un numéro de salle ou de groupe. Ces mentions "
  + "renseignent le calendrier du professeur, pas le contenu.\n"
  + "Un thème se nomme par son objet : « La fonction de consommation », « Les amortissements », "
  + "« L'élasticité de la demande » — jamais « Séance 4 » ni « Chapitre 2 ».\n"
  + "Deux documents étiquetés différemment mais traitant la même notion vont dans le MÊME thème. "
  + "Un document couvrant deux notions distinctes se scinde en deux entrées.\n"
  + "Les titres et intertitres du document sont au contraire précieux : c'est là que se lit le thème.\n"
  + "Conserve l'étiquette administrative uniquement dans le TITRE DU DOCUMENT, où elle aide "
  + "l'étudiant à retrouver sa séance — jamais dans le nom du thème.\n"
  + "Ne propose aucun numéro de chapitre : la numérotation appartient à l'étudiant.";

/* Une seule règle d'écriture des formules, partagée par la lecture des photos
   et la mise au propre : un cours de maths ou de macro doit se relire comme
   dans un manuel, pas comme du code. md() dessine le LaTeX avec KaTeX. */
const REGLES_MATHS = "\nFORMULES, CHIFFRES ET CALCULS — le rendu doit se lire comme dans un manuel\n"
  + "- Toute expression mathématique s'écrit en LaTeX : $…$ à l'intérieur d'une phrase, $$…$$ SEULE sur sa ligne pour une formule posée à part.\n"
  + "- Jamais de mise en forme autour ou à l'intérieur d'une formule : ni ==$…$==, ni **$…$**, ni formule $$…$$ dans une liste à puces. "
  + "Si la formule est surlignée ou encadrée sur la page, mets la marque sur la ligne juste avant (« **Formule à retenir** [encadré] »), puis la formule seule sur la ligne suivante.\n"
  + "- Les nombres ordinaires restent du texte, avec une espace pour les milliers : 1 000 000 ; 125 000 € ; 3,5 %. Pas de LaTeX pour un simple nombre, jamais de \\, pour séparer les milliers.\n"
  + "- LaTeX standard et simple : \\frac{a}{b}, x^{2}, u_{n}, \\times, \\cdot, \\leq, \\geq, \\neq, \\approx, \\sqrt{x}, \\sum, \\Delta, \\alpha, \\to. "
  + "Pas d'environnement (align, array, cases), pas de macro personnelle : une équation par ligne.\n"
  + "- Un calcul en plusieurs étapes : une étape par ligne, chacune entre $$…$$, dans l'ordre de la page.\n"
  + "- Chaque accolade ouverte se referme : relis chaque formule avant de répondre.\n"
  + "- Recopie chaque chiffre, signe, indice et exposant exactement comme sur la page. Ne calcule rien, ne corrige aucun résultat, n'ajoute aucune étape. "
  + "Un symbole douteux est suivi de [?].\n";

function consigneVision(contexte){

    + "photo d'un tableau ou d'une diapositive.\n"

    + "Si l'image contient deux pages côte à côte — cas courant d'un scan de livret — traite d'abord la page de "

    + "\nRESTITUE LES ANNOTATIONS — c'est le plus important\n"

    + "\nSCHÉMAS ET DESSINS\n"

    + "Transcris tout texte figurant dans le schéma.\n"
    + "\nHONNÊTETÉ\n"
    + "N'invente jamais un mot pour combler un trou. Un mot douteux s'écrit mot[?], un passage illisible [illisible]. "
    + "Un mot rendu incertain par l'écriture vaut mieux qu'un mot inventé qui sera révisé comme vrai.\n"
    + "\nRENDU\n"
    + "Réponds uniquement par le contenu de la page en markdown, prêt à s'insérer dans un cours. "
    + "Aucune introduction, aucun commentaire, aucune conclusion de ta part.";
}

/* ---------- découverte des modèles : ne jamais dépendre d'un nom figé ---------- */
async function listerModeles(cle){
  cle = cle || cleActive();
  if(IA.fournisseur === "gemini"){
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models", { headers:{ "x-goog-api-key": cle } });
    if(!r.ok){
      let msg = ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
      throw Object.assign(new Error(msg || ("HTTP "+r.status)),
        { code: (r.status===403||r.status===400) ? "cle_invalide" : "api_error" });
    }
    const j = await r.json();
    return (j.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).indexOf("generateContent") >= 0)
      .map(m=>String(m.name).replace(/^models\//,""));
  }
  const r = await fetch("https://api.anthropic.com/v1/models?limit=100", {
    headers:{ "x-api-key": cle, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" } });
  if(!r.ok) throw Object.assign(new Error("HTTP "+r.status), { code: r.status===401?"cle_invalide":"api_error" });
  const j = await r.json();
  return (j.data||[]).map(m=>m.id);
}

/* Modèles écartés parce qu'ils ont réellement échoué à l'usage — le catalogue
   d'un fournisseur annonce parfois des modèles qui refusent ensuite l'appel. */
const S_EXCLUS = LS_KEY + "-modeles-exclus";
function lireExclus(){
  try{ return new Set(JSON.parse(localStorage.getItem(S_EXCLUS) || "[]")); }catch(e){ return new Set(); }
}
function exclureModele(n){
  if(!n) return;
  const s = lireExclus(); s.add(n);
  try{ localStorage.setItem(S_EXCLUS, JSON.stringify([...s])); }catch(e){}
}
function reintegrerModele(n){
  const s = lireExclus(); if(!s.delete(n)) return;
  try{ localStorage.setItem(S_EXCLUS, JSON.stringify([...s])); }catch(e){}
}

/* Classe les modèles disponibles : rapide, multimodal, récent — en écartant
   ceux qui se sont déjà montrés inutilisables. Renvoie la liste ordonnée. */
function classerModeles(noms){
  const exclus = lireExclus();
  // « deep-research » et consorts sont des modèles à API dédiée : ils figurent au
  // catalogue mais refusent l'appel standard. Écartés d'emblée.
  const horsSujet = /embed|aqa|imagen|veo|tts|audio|live|-image|gemma|deep-research|robotics|computer-use|guard/i;
  const utiles = (noms||[]).filter(n=>!horsSujet.test(n) && !exclus.has(n));
  if(!utiles.length) return [];
  // « gemini-3-flash » → 3 ; « gemini-2.5-flash » → 2.5 ; « claude-opus-4-8 » → 4.8
  // Les suffixes de date (« -12-2025 ») sont retirés avant lecture : sans ça un
  // modèle daté passait pour une version 12 et raflait la première place.
  const version = n=>{
    const sansDate = n.replace(/[-_](?:0?[1-9]|1[0-2])[-_]20\d\d\b/g, "").replace(/[-_]20\d{2,6}\b/g, "");
    const m = sansDate.match(/(\d+)(?:[.\-](\d+))?/);
    if(!m) return 0;
    const maj = parseInt(m[1], 10);
    if(maj > 30) return 0;                                  // encore une date déguisée
    const min = (m[2] && m[2].length <= 2) ? m[2] : "0";
    return parseFloat(maj + "." + min);
  };
  const score = n=>{
    let s = version(n) * 10;
    if(/flash/i.test(n)) s += 30;          // rapide et économique : idéal pour l'OCR au quotidien
    else if(/sonnet|pro/i.test(n)) s += 20;
    if(/opus/i.test(n)) s += 25;
    if(/lite/i.test(n)) s -= 15;
    if(/preview|exp|latest/i.test(n)) s -= 5;   // on préfère les versions stables
    return s;
  };
  return utiles.slice().sort((a,b)=>score(b)-score(a));
}
function choisirModele(noms){ return classerModeles(noms)[0] || ""; }

/* Réparation quand le modèle enregistré n'existe pas, ou refuse cette API :
   on écarte le fautif et on prend le suivant du classement. */
async function reparerModele(){
  try{
    exclureModele(IA.modele);
    const choix = choisirModele(await listerModeles());
    if(!choix || choix === IA.modele) return false;
    enregistrerConfig({ modele: choix });
    return true;
  }catch(e){ return false; }
}

/* Rapport de diagnostic partageable. Ne contient jamais la clé : seulement
   sa longueur, pour distinguer « absente » de « tronquée à la copie ». */
async function diagnostic(progres){
  const L = [], dire = t=>{ L.push(t); if(progres) progres(L.join("\n")); };
  const cle = cleActive();

  dire("=== Diagnostic — Cahier BBA ===");
  dire("Fournisseur : " + FOURNISSEURS[IA.fournisseur].nom);
  dire("Clé : " + (cle ? "présente, " + cle.length + " caractères" : "ABSENTE"));
  dire("Modèle enregistré : " + (IA.modele || "aucun"));
  const ex = [...lireExclus()];
  dire("Modèles déjà écartés : " + (ex.length ? ex.join(", ") : "aucun"));
  dire("");

  if(!cle){ dire("→ Rien à tester sans clé."); return L.join("\n"); }

  let noms = [];
  try{
    noms = await listerModeles();
    dire("Catalogue : " + noms.length + " modèle(s) annoncés compatibles.");
  }catch(e){
    dire("Catalogue : ÉCHEC — " + (e.message || e.code));
    dire("");
    dire("→ La clé est refusée avant même le choix d'un modèle.");
    return L.join("\n");
  }

  const candidats = classerModeles(noms).slice(0, 6);
  dire("Essais réels (le catalogue ne suffit pas) :");
  let bon = "";
  for(const n of candidats){
    const avant = IA.modele;
    IA.modele = n;
    try{
      // Budget large : les modèles qui réfléchissent avant d'écrire épuisent un
      // petit quota en réflexion et rendraient une réponse vide à tort.
      await appelAPI({ messages:[{ role:"user", content:"Réponds exactement : OK" }], maxTokens:1024, effort:"low" }, true);
      dire("  [OK] " + n + " — répond");
      if(!bon) bon = n;
    }catch(e){
      dire("  [X] " + n + " — " + (e.message || e.code));
    }
    IA.modele = avant;
  }
  dire("");

  if(!bon){ dire("→ Aucun modèle ne répond avec cette clé."); return L.join("\n"); }

  const avant = IA.modele;
  IA.modele = bon;
  try{
    const c = document.createElement("canvas");
    c.width = 420; c.height = 140;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
    g.fillStyle = "#000"; g.font = "bold 64px Georgia, serif";
    g.fillText("ESSEC 2026", 20, 92);
    const d = c.toDataURL("image/jpeg", 0.9);
    const t = await appelAPI({
      messages:[{ role:"user", content:"Quel texte est écrit sur cette image ? Réponds uniquement par ce texte." }],
      images:[{ media:"image/jpeg", b64: d.slice(d.indexOf(",")+1) }],
      maxTokens:200, effort:"low"
    }, true);
    dire(/ESSEC/i.test(t) ? "Lecture d'image : [OK] réussie (« " + t.trim().slice(0,40) + " »)"
                          : "Lecture d'image : réponse inattendue — « " + t.trim().slice(0,80) + " »");
    dire("");
    dire("→ Modèle opérationnel : " + bon);
    enregistrerConfig({ modele: bon });
  }catch(e){
    dire("Lecture d'image : ÉCHEC — " + (e.message || e.code));
    dire("");
    dire("→ Le texte fonctionne, mais pas les images sur ce modèle.");
    IA.modele = avant;
  }
  return L.join("\n");
}

  g.fillStyle = "#1b2a4a";

  // note de marge, autre couleur
  g.fillStyle = "#1d7a4c"; g.font = "600 23px 'Bradley Hand','Segoe Script',cursive";

  g.strokeStyle = "#1d7a4c"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(610, 310); g.lineTo(500, 268); g.stroke();

  // souligne trois fois
  g.fillStyle = "#1b2a4a"; g.font = plume;
  g.fillText("methode lineaire", 140, 400);
  g.strokeStyle = "#1b2a4a"; g.lineWidth = 2;
  [410, 417, 424].forEach(y=>{ g.beginPath(); g.moveTo(140,y); g.lineTo(400,y); g.stroke(); });

  // petit schema

  g.fillText("t", 830, 626);

  return c;
}
