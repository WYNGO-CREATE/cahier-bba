    +     '<option value="auto">Déduire des annales</option><option value="midterm">Partiel / mi-parcours</option>'
    +     '<option value="final">Examen final</option><option value="oral">Oral</option><option value="qcm">QCM</option>'
    +   "</select></div>"
    + "</div>"
    + '<div><label class="lab">Thèmes à couvrir (facultatif)</label><div id="evThemes">'+listeThemes(mid, cidPre)+"</div></div>"
    + '<div><label class="lab" for="evD">Échéance (facultatif)</label>'
    +   '<input class="field" id="evD" placeholder="ex. jeudi prochain, dans 3 jours"></div>'
    + '<div id="evEtat"></div>'
    + "</div></div>"
    + '<div class="modal-foot"><div style="flex:1"></div><button class="btn" data-x>Annuler</button>'
    + '<button class="btn pri" id="evGo">Préparer</button></div>', {wide:true, sticky:true});

  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  $("#evSujet").focus();
  $("#evM").onchange = ()=>{ $("#evThemes").innerHTML = listeThemes($("#evM").value, ""); };
  $("#evGo").onclick = ()=>{
    const themes = [...document.querySelectorAll("#evThemes [data-th]")].filter(b=>b.checked).map(b=>b.dataset.th);
    preparerEvaluation($("#evM").value, themes, {
      sujet: $("#evSujet").value.trim(), type: $("#evT").value, delai: $("#evD").value.trim() });
  };
}

async function preparerEvaluation(mid, themes, opt){
  opt = opt || {}; themes = themes || [];
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
  if(!opt.sujet && !themes.length){
    toast("Dis au moins sur quoi porte l'épreuve, ou coche un thème.", 4000); return;
  }
  const m = mid ? matById(mid) : null;

  closeModal();
  showPanel(); state.tab = "analyse";
  const corps = $("#panelBody");
  if(!corps) return;
  corps.innerHTML = '<div class="card"><div id="evEtat2"></div>'
    + '<div id="evSel" style="margin-top:8px"></div>'
    + '<div class="prose" id="liveOut" style="margin-top:10px"></div></div>';
  const ch = chantier($("#evEtat2"), "Recherche dans tes documents", { delai: 300000 });

  const titresThemes = {};
  state.chapitres.forEach(c=>{ titresThemes[c.id] = c.titre; });
  const mots = motsUtiles(opt.sujet + " " + themes.map(t=>titresThemes[t]||"").join(" "));

  // Sélection : d'abord les thèmes cochés, sinon toute la matière, classés par
  // pertinence face à ce que l'étudiant a décrit.
  let candidats = state.items.filter(i=>{
    if(i.type === "annale" || sansTexte(i)) return false;
    if(themes.length) return themes.indexOf(i.chapitreId) >= 0;
    return !mid || i.matiereId === mid;
  });
  candidats = candidats.map(i=>({ i, s: scorePertinence(i, mots, titresThemes) }))
                       .sort((a,b)=>b.s - a.s || String(a.i.titre).localeCompare(String(b.i.titre)));
  const retenus = [];
  let budget = 26000;
  // Un thème coché rend ses documents pertinents par construction : on les garde
  // quel que soit leur score. Sur une recherche par description seule, en
  // revanche, un document qui ne répond à aucun mot n'a rien à faire là — sauf
  // à n'en avoir trouvé aucun, où mieux vaut trois documents faibles que rien.
  const filtrerParScore = mots.length > 0 && themes.length === 0;
  for(const { i, s } of candidats){
    if(budget <= 0 || retenus.length >= 22) break;
    if(filtrerParScore && s === 0 && retenus.length >= 3) break;
    const part = Math.min(2400, Math.max(700, Math.floor(budget / 8)));
    const c = String(i.contenu||"");
    retenus.push({ it:i, extrait: c.length > part ? c.slice(0, part) + "\n[…]" : c, s });
    budget -= Math.min(c.length, part);
  }
  const an = annalesDe(mid, mots, titresThemes);

  // On montre ce qui a été retenu : l'étudiant doit pouvoir juger la sélection.
  const sel = $("#evSel");
  if(sel) sel.innerHTML = '<p class="note"><b>' + retenus.length + " document(s)</b> retenus"
    + (an.nb ? " et <b>" + an.nb + "</b> annale(s)" : ", aucune annale trouvée")
    + " :</p><div class=\"chap-meta\" style=\"margin-top:6px\">"
    + retenus.slice(0,14).map(r=>'<span class="pill type">'+esc(r.it.titre.slice(0,42))+"</span>").join("")
    + (retenus.length>14 ? '<span class="pill type">+'+(retenus.length-14)+"</span>" : "") + "</div>";

  const fond = retenus.map(r=>"--- " + (TYPES[r.it.type]||r.it.type) + " · "
      + (titresThemes[r.it.chapitreId] || "sans thème") + " : " + (r.it.titre||"") + " ---\n" + r.extrait
    ).join("\n\n");

  const nomEpreuve = { auto:"", midterm:"un partiel de mi-parcours", final:"un examen final",
                       oral:"un oral", qcm:"un QCM" }[opt.type] || "";

  try{
    const texte = await iaTexte({
      system: NIVEAU + "\n\nTu prépares un étudiant à une épreuve précise. Tu ne fais pas de révision "
        + "générique : tu pars de la forme réelle des sujets déjà tombés et du contenu réellement enseigné.",
      messages:[{ role:"user", content:
        "MATIÈRE : " + (m ? m.nom : "toutes matières confondues") + "\n"
        + (opt.sujet ? "CE QUE L'ÉTUDIANT SAIT DE L'ÉPREUVE — c'est la consigne à suivre :\n« " + opt.sujet + " »\n" : "")
        + (themes.length ? "THÈMES CIBLÉS : " + themes.map(t=>titresThemes[t]||"?").join(" · ") + "\n" : "")
        + (nomEpreuve ? "TYPE D'ÉPREUVE : " + nomEpreuve + "\n" : "")
        + (opt.delai ? "ÉCHÉANCE : " + opt.delai + "\n" : "")
        + "\n" + (an.nb
            ? "ANNALES (" + an.nb + " sujet(s) du cahier) — c'est de LÀ que tu déduis la FORME de l'épreuve :\n" + an.texte + "\n"
            : "AUCUNE ANNALE dans le cahier pour cette matière : dis-le explicitement en tête de ta réponse, "
              + "et présente la forme que tu proposes comme une hypothèse.\n")
        + "\nDOCUMENTS RETENUS (" + retenus.length + ") — c'est de LÀ que vient le CONTENU :\n" + fond + "\n\n"
        + "Rédige une préparation en markdown, structurée ainsi :\n"
        + "## Ce qui t'attend\nLa forme de l'épreuve telle que les annales la révèlent : structure, nombre et "
        + "type de questions, durée et barème s'ils figurent, part du calcul face à la rédaction. Cite les sujets "
        + "sur lesquels tu t'appuies. Si les annales divergent, dis-le.\n"
        + "## Ce qui revient le plus souvent\nLes notions présentes dans plusieurs sujets, de la plus à la moins "
        + "récurrente, avec la forme sous laquelle elles sont interrogées.\n"
        + "## Fiche ciblée\nUniquement ce qui sert pour CETTE épreuve, au vu de ce que l'étudiant a décrit : "
        + "définitions exactes, formules, méthodes pas à pas, dans les notations des documents.\n"
        + "## Sujet blanc\nUn sujet inédit calqué sur la forme des annales, avec son barème. Ne recopie aucun "
        + "exercice existant.\n"
        + "## Corrigé du sujet blanc\nLa correction détaillée, étape par étape.\n"
        + "## Pièges et erreurs fréquentes\nD'après les corrigés présents dans les annales.\n"
        + "## Ce qui te manque\nSi la description de l'épreuve mentionne une notion absente des documents "
        + "fournis, dis-le franchement au lieu de l'inventer.\n\n"
        + "RÈGLES D'EXACTITUDE — impératives, l'étudiant révise sur ce que tu écris :\n"
        + "- Chaque affirmation sur la forme de l'épreuve cite entre crochets le sujet d'où elle vient : [Midterm 2021]. "
        + "Sans source, ne l'affirme pas.\n"
        + "- Distingue ce qui est CERTAIN (présent dans plusieurs annales), PROBABLE (une seule) et HYPOTHÈSE (aucune).\n"
        + "- N'avance aucune définition, formule ou valeur absente des documents fournis ; si un complément est "
        + "indispensable, marque-le « (complément hors cours) ».\n"
        + "- Refais chaque calcul toi-même, y compris ceux des corrigés fournis. Si un corrigé du professeur contient "
        + "une erreur, signale-la avec la valeur juste et le détail du calcul, au lieu de la reproduire.\n"
        + "- Si les documents ne permettent pas de répondre, dis-le. Une préparation courte et juste vaut mieux "
        + "qu'une préparation longue qui oriente mal.\n\n"
        + "Formules en LaTeX entre $…$, tableaux en markdown." }],
      effort:"high", maxTokens: 20000, signal: ch.signal,
      onText: t=>{ const el = $("#liveOut"); if(el) el.textContent = t; }
    });

    const chapCible = themes[0] || (retenus[0] && retenus[0].it.chapitreId) || null;
    const it = { id:uid(), matiereId: mid || (retenus[0] && retenus[0].it.matiereId) || null,
      chapitreId: chapCible, type:"evaluation",
      titre:"Préparation — " + (opt.sujet ? opt.sujet.slice(0,60) : (m ? m.nom : "épreuve")),
      contenu: texte, source:"ia", ancre: an.nb>0, date:new Date().toISOString() };
    ch.fini();
    state.items.push(it); await saveItem(it);
    state.openDocs.add(it.id);
    if(chapCible) aller("chapitre", { chap: chapCible, mat: it.matiereId });
    else if(it.matiereId) aller("matiere", { mat: it.matiereId });
    toast(an.nb ? "Préparation créée à partir de " + an.nb + " annale(s) et " + retenus.length + " document(s)"
                : "Préparation créée — aucune annale trouvée");
  }catch(e){
    ch.fini();
    // L'erreur reste affichée dans le panneau : la remplacer par l'écran d'accueil
    // faisait disparaître la cause en même temps que le message.
    const el = $("#evEtat2");
    if(el) el.innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>"
      + '<p class="note" style="margin-top:8px">Rien n\'a été enregistré. Tu peux relancer, '
      + "ou réduire le nombre de thèmes cochés si le service a manqué de souffle.</p>";
    else iaError(e);
  }
}

/* =========================================================
   RANGEMENT D'UNE MATIÈRE
   Le classement fait à l'import est aveugle au reste : il ne voit que ce
   qu'on lui donne. Après plusieurs imports, des chapitres se dédoublent et
   des documents se retrouvent au mauvais endroit. Cette passe relit toute
   la matière et propose un plan — jamais appliqué sans validation.

   Deux temps, pour que la charge reste bornée quel que soit le volume :
   d'abord consolider les chapitres (charge faible, vue d'ensemble), puis
   replacer les documents par lots contre cette structure assainie.
   ========================================================= */
const SCHEMA_TRI_CHAP = {
  type:"object",
  properties:{
    fusions:{ type:"array", items:{
      type:"object",
      properties:{ garder:{type:"string"}, absorber:{type:"array", items:{type:"string"}},
                   titre:{type:"string"}, pourquoi:{type:"string"} },
      required:["garder","absorber","titre","pourquoi"], additionalProperties:false }},
    renommages:{ type:"array", items:{
      type:"object",
      properties:{ id:{type:"string"}, titre:{type:"string"}, pourquoi:{type:"string"} },
      required:["id","titre","pourquoi"], additionalProperties:false }},
    ordre:{ type:"array", items:{type:"string"} }
  },
  required:["fusions","renommages","ordre"], additionalProperties:false
};

const SCHEMA_TRI_DOCS = {
  type:"object",
  properties:{
    deplacements:{ type:"array", items:{
      type:"object",
      properties:{ docId:{type:"string"}, versId:{type:"string"}, pourquoi:{type:"string"} },
      required:["docId","versId","pourquoi"], additionalProperties:false }},
    doublons:{ type:"array", items:{
      type:"object",
      properties:{ garder:{type:"string"}, supprimer:{type:"array", items:{type:"string"}}, pourquoi:{type:"string"} },
      required:["garder","supprimer","pourquoi"], additionalProperties:false }}
  },
  required:["deplacements","doublons"], additionalProperties:false
};

const extraitDe = (it, n) => String(it.contenu||"")
  .replace(/[#*=`>|\-]/g," ").replace(/\s+/g," ").trim().slice(0, n || 260);

/* Déplacement manuel d'un document : pour le cas isolé, sans mobiliser l'IA. */
function deplacerDoc(itemId){
  const it = state.items.find(x=>x.id===itemId);
  if(!it) return;
  const cs = chapsOf(it.matiereId);
  modal('<div class="modal-head"><h2>Déplacer le document</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><p class="note" style="margin-bottom:12px">« '+esc(it.titre||"sans titre")+' »</p>'
    + '<div class="creation-liste">'
    + cs.map(c=>'<button class="creation" data-vers="'+c.id+'"'+(c.id===it.chapitreId?' style="border-color:var(--accent)"':'')+'>'
        + '<span class="creation-ic">'+esc(c.numero!=null?String(c.numero).padStart(2,"0"):"··")+"</span>"
        + "<span><b>"+esc(c.titre)+"</b><em>"+itemsOf(c.id).length+" document"+(itemsOf(c.id).length>1?"s":"")
        + (c.id===it.chapitreId?" · emplacement actuel":"")+"</em></span></button>").join("")
    + "</div></div>");
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  document.querySelectorAll("[data-vers]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.vers !== it.chapitreId){
      it.chapitreId = b.dataset.vers;
      it.maj = new Date().toISOString();
      await saveItem(it);
      toast("Déplacé vers « " + (chapById(b.dataset.vers)||{}).titre + " »");
    }
    closeModal();
    aller("chapitre", { chap: it.chapitreId, mat: it.matiereId });
  });
}

async function rangerMatiere(mid){
  const m = matById(mid);
  if(!m) return;
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir Réglages."); return; }
  const cs = chapsOf(mid), its = itemsOfMat(mid);
  if(!cs.length && !its.length){ toast("Rien à ranger dans cette matière."); return; }

  modal('<div class="modal-head"><h2>Ranger « '+esc(m.nom)+' »</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><div id="trEtat"></div><div id="trOut"></div></div>'
    + '<div class="modal-foot"><button class="btn" data-x>Fermer</button>'
    + '<button class="btn pri hide" id="trGo">Appliquer</button></div>', {wide:true, sticky:true});
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);

  const ch = chantier($("#trEtat"), "Relecture de la matière", { delai: 300000 });
  const plan = { fusions:[], renommages:[], ordre:[], deplacements:[], doublons:[] };

  try{
    /* ----- temps 1 : consolider les chapitres ----- */
    if(cs.length > 1){
      const inventaire = cs.map(c=>{
        const titres = itemsOf(c.id).slice(0,6).map(i=>i.titre).join(" | ");
        return '- id "'+c.id+'" · n°'+(c.numero||"?")+' · "'+c.titre+'"'
          + " · " + itemsOf(c.id).length + " doc"
          + (titres ? " · contient : " + titres : " · vide");
      }).join("\n");

      const r1 = await iaJson({
        system: NIVEAU,
        messages:[{ role:"user", content:
          "Voici les thèmes de la matière « " + m.nom + " » d'un classeur de cours.\n\n" + inventaire + "\n\n"
          + REGLE_THEME + "\n\n"
          + "Repère les défauts de structure et propose un plan de rangement :\n"
          + "1. FUSIONS : deux entrées qui désignent manifestement la même notion — « Amortissements » et "
          + "« Les amortissements », un thème créé en double lors d'un import découpé, ou surtout deux étiquettes "
          + "de calendrier différentes portant sur le même sujet (« Séance 4 » et « Séance 5 » qui traitent toutes "
          + "deux de la fonction de consommation). Indique lequel garder, lesquels absorber, et le titre final, "
          + "qui doit nommer la notion. Ne fusionne JAMAIS deux notions distinctes, même proches.\n"
          + "2. RENOMMAGES : renomme impérativement tout titre qui n'est qu'une étiquette administrative "
          + "(« Séance 3 », « TD 2 », « Chapitre 1 », « Partie 3 », une date) — remplace-le par la notion que "
          + "révèlent les documents qu'il contient. Renomme aussi un titre tronqué ou mal orthographié. "
          + "Sinon laisse le titre tel quel.\n"
          + "3. ORDRE : la liste complète des id de chapitres, dans l'ordre pédagogique logique. Conserve l'ordre existant "
          + "s'il est cohérent ; ne réordonne que si un chapitre est visiblement mal placé.\n\n"
          + "Sois conservateur : en cas de doute, ne propose rien. Un classeur mal fusionné est pire qu'un classeur imparfait." }],
        schema: SCHEMA_TRI_CHAP, effort:"high", maxTokens: 8000, signal: ch.signal
      });
      plan.fusions    = (r1 && r1.fusions) || [];
      plan.renommages = (r1 && r1.renommages) || [];
      plan.ordre      = (r1 && r1.ordre) || [];
    }

    /* ----- temps 2 : replacer les documents, par lots ----- */
    if(its.length){
      // Structure cible : après fusions et renommages proposés.
      const absorbes = new Set();
      plan.fusions.forEach(f=>(f.absorber||[]).forEach(a=>absorbes.add(a)));
      const titreFinal = id => {
        const f = plan.fusions.find(x=>x.garder === id);
        if(f && f.titre) return f.titre;
        const r = plan.renommages.find(x=>x.id === id);
        if(r && r.titre) return r.titre;
        const c = chapById(id); return c ? c.titre : "";
      };
      const cible = cs.filter(c=>!absorbes.has(c.id));
      const listeCible = cible.map(c=>'- id "'+c.id+'" · "'+titreFinal(c.id)+'"').join("\n");

      const LOT = 30;
      for(let i = 0; i < its.length; i += LOT){
        const lot = its.slice(i, i + LOT);
        if($("#trEtat")) {
          const t = $("#trEtat").querySelector(".thinking");
          if(t) t.innerHTML = "<i></i>Placement des documents — " + Math.min(i+LOT, its.length) + "/" + its.length;
        }
        const desc = lot.map(it=>{
          const actuel = absorbes.has(it.chapitreId) ? (plan.fusions.find(f=>(f.absorber||[]).includes(it.chapitreId))||{}).garder : it.chapitreId;
          return '- doc "'+it.id+'" · type '+(TYPES[it.type]||it.type)+' · titre "'+(it.titre||"")+'"'
            + ' · actuellement dans "'+(actuel||"aucun")+'" · extrait : ' + extraitDe(it);
        }).join("\n");

        const r2 = await iaJson({
          system: NIVEAU,
          messages:[{ role:"user", content:
            "Thèmes disponibles dans la matière « " + m.nom + " » :\n" + listeCible + "\n\n"
            + REGLE_THEME + "\n\n"
            + "Documents à vérifier :\n" + desc + "\n\n"
            + "1. DÉPLACEMENTS : pour chaque document manifestement rangé sous le mauvais thème, indique son id "
            + "et l'id du thème qui lui convient — d'après la notion qu'il traite, jamais d'après l'étiquette de "
            + "séance figurant dans son titre. N'utilise que les id de la liste ci-dessus. "
            + "Ne propose RIEN pour un document déjà bien placé — la liste doit être courte.\n"
            + "2. DOUBLONS : deux documents dont le contenu se recouvre presque entièrement (même page importée deux fois). "
            + "Indique lequel garder et lesquels supprimer. Un cours et son exercice ne sont PAS des doublons ; "
            + "deux séances distinctes non plus. En cas de doute, ne signale rien." }],
          schema: SCHEMA_TRI_DOCS, effort:"high", maxTokens: 8000, signal: ch.signal
        });
        plan.deplacements = plan.deplacements.concat((r2 && r2.deplacements) || []);
        plan.doublons     = plan.doublons.concat((r2 && r2.doublons) || []);
      }
    }

    ch.fini();
    ecranRangement(plan, mid);
  }catch(e){
    ch.fini();
    $("#trEtat").innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>";
  }
}

function ecranRangement(plan, mid){
  const nom = id => { const c = chapById(id); return c ? (c.numero!=null?"Ch. "+c.numero+" — ":"") + c.titre : "(chapitre inconnu)"; };
  const doc = id => { const i = state.items.find(x=>x.id===id); return i ? (i.titre||"sans titre") : "(document inconnu)"; };
  const valides = c => chapById(c);

  const fusions = (plan.fusions||[]).filter(f=>valides(f.garder) && (f.absorber||[]).some(valides));
  const renom   = (plan.renommages||[]).filter(r=>valides(r.id) && r.titre && chapById(r.id).titre !== r.titre);
  const depl    = (plan.deplacements||[]).filter(d=>{
    const it = state.items.find(x=>x.id===d.docId);
    return it && valides(d.versId) && it.chapitreId !== d.versId;
  });
  const doubl   = (plan.doublons||[]).filter(d=>state.items.some(x=>x.id===d.garder) && (d.supprimer||[]).some(id=>state.items.some(x=>x.id===id)));
  const ordreUtile = (plan.ordre||[]).filter(valides);
  const ordreChange = ordreUtile.length > 1 &&
    ordreUtile.join("|") !== chapsOf(mid).map(c=>c.id).join("|");

  const total = fusions.length + renom.length + depl.length + doubl.length + (ordreChange?1:0);
  $("#trEtat").innerHTML = total
    ? "<b>" + total + " proposition" + (total>1?"s":"") + "</b> — décoche ce que tu refuses."
    : "<b>Rien à redresser.</b> La matière est déjà bien rangée.";

  if(!total){ $("#trOut").innerHTML = ""; return; }

  const ligne = (cle, titre, detail, pourquoi) =>
    '<label class="prop"><input type="checkbox" checked data-act="'+cle+'">'
    + "<span><b>"+titre+"</b>"
    + (detail ? "<em>"+detail+"</em>" : "")
    + (pourquoi ? '<span class="note">'+esc(pourquoi)+"</span>" : "")
    + "</span></label>";

  let html = "";
  if(fusions.length){
    html += '<div class="titre-section"><h2>Chapitres en double</h2></div>';
    fusions.forEach((f,i)=>{
      const abs = (f.absorber||[]).filter(valides);
      html += ligne("fus:"+i, "Fusionner en « "+esc(f.titre||chapById(f.garder).titre)+" »",
        esc(abs.map(nom).join(" + ")) + " → " + esc(nom(f.garder)), f.pourquoi);
    });
  }
  if(renom.length){
    html += '<div class="titre-section"><h2>Titres à corriger</h2></div>';
    renom.forEach((r,i)=>html += ligne("ren:"+i, esc(chapById(r.id).titre)+" → "+esc(r.titre), "", r.pourquoi));
  }
  if(depl.length){
    html += '<div class="titre-section"><h2>Documents mal rangés</h2></div>';
    depl.forEach((d,i)=>html += ligne("dep:"+i, esc(doc(d.docId)),
      esc(nom(state.items.find(x=>x.id===d.docId).chapitreId)) + " → " + esc(nom(d.versId)), d.pourquoi));
  }
  if(doubl.length){
    html += '<div class="titre-section"><h2>Doublons</h2></div>';
    doubl.forEach((d,i)=>{
      const sup = (d.supprimer||[]).filter(id=>state.items.some(x=>x.id===id));
      html += ligne("dbl:"+i, "Supprimer " + sup.length + " copie" + (sup.length>1?"s":""),
        esc(sup.map(doc).join(", ")) + " · garde « " + esc(doc(d.garder)) + " »", d.pourquoi);
    });
  }
  if(ordreChange){
    html += '<div class="titre-section"><h2>Ordre des chapitres</h2></div>';
    html += ligne("ord:0", "Renuméroter les chapitres",
      esc(ordreUtile.map(id=>chapById(id).titre).join(" → ")), "");
  }

  $("#trOut").innerHTML = html;
  $("#trGo").classList.remove("hide");
  $("#trGo").onclick = async ()=>{
    const coche = c => { const e = document.querySelector('[data-act="'+c+'"]'); return e && e.checked; };
    let n = 0;

    for(let i=0;i<fusions.length;i++){
      if(!coche("fus:"+i)) continue;
      const f = fusions[i], abs = (f.absorber||[]).filter(valides);
      for(const a of abs){
        for(const it of itemsOf(a)){ it.chapitreId = f.garder; await saveItem(it); }
        enterrer("chapitres", a);
        state.chapitres = state.chapitres.filter(c=>c.id !== a);
      }
      const g = chapById(f.garder); if(g && f.titre) g.titre = f.titre;
      n++;
    }
    for(let i=0;i<renom.length;i++){
      if(!coche("ren:"+i)) continue;
      const c = chapById(renom[i].id); if(c){ c.titre = renom[i].titre; n++; }
    }
    for(let i=0;i<depl.length;i++){
      if(!coche("dep:"+i)) continue;
      const it = state.items.find(x=>x.id===depl[i].docId);
      if(it && chapById(depl[i].versId)){ it.chapitreId = depl[i].versId; await saveItem(it); n++; }
    }
    for(let i=0;i<doubl.length;i++){
      if(!coche("dbl:"+i)) continue;
      for(const id of (doubl[i].supprimer||[])) if(state.items.some(x=>x.id===id)){ await deleteItem(id); n++; }
    }
    if(ordreChange && coche("ord:0")){
      ordreUtile.forEach((id,k)=>{ const c = chapById(id); if(c) c.numero = k+1; });
      n++;
    }

    await saveStructure();
    closeModal();
    aller("matiere", { mat: mid });
    toast(n ? n + " changement(s) appliqué(s)" : "Aucun changement");
  };
}

        const d = JSON.parse(await f.text());
        if(!confirm("Fusionner ce fichier avec ton classeur actuel ?")) return;
        const has = (arr,id)=>arr.some(x=>x.id===id);
        (d.matieres||[]).forEach(m=>{ if(!has(state.matieres,m.id)) state.matieres.push(m); });
        (d.chapitres||[]).forEach(c=>{ if(!has(state.chapitres,c.id)) state.chapitres.push(c); });

        await saveStructure(); closeModal(); render(); toast("Import terminé");
      }catch(e){ toast("Fichier illisible"); }
    };

/* =========================================================
   NAVIGATION & VUES
   Un empilement simple : la barre d'onglets fixe la destination,
   les cartes creusent (matière → chapitre), le retour dépile.
   ========================================================= */
const PREF_KEY = LS_KEY + "-pref";
function savePref(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({ vue:state.vue, mat:state.selMat, chap:state.selChap })); }catch(e){}
}
function loadPref(){
  try{
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    if(p.mat && matById(p.mat)) state.selMat = p.mat;
    if(p.chap && chapById(p.chap)) state.selChap = p.chap;
    if(p.vue) state.vue = p.vue;
  }catch(e){}
  if(state.vue === "chapitre" && !chapById(state.selChap)) state.vue = "cahier";
  if(state.vue === "matiere" && !matById(state.selMat)) state.vue = "cahier";
  if(!state.selMat && state.matieres.length) state.selMat = state.matieres[0].id;
}

state.vue = "cahier";

function aller(vue, opts){
  opts = opts || {};
  if(opts.mat !== undefined) state.selMat = opts.mat;
  if(opts.chap !== undefined) state.selChap = opts.chap;
  state.vue = vue;
  render();
  window.scrollTo({ top:0, behavior: opts.doux ? "smooth" : "auto" });
}
function retour(){
  if(state.vue === "chapitre") return aller("matiere");
  aller("cahier");
}

/* Le « + » ouvre un menu : toutes les façons de nourrir le cahier sont
   à un geste, depuis n'importe quelle vue. */
function openCreation(){
  if(!state.matieres.length){ openMatieresModal(); return; }
  const m = matById(state.selMat);
  const ligne = (cle, ic, titre, sous) =>
    '<button class="creation" data-faire="'+cle+'">'
    + '<span class="creation-ic">'+ic+"</span>"
    + "<span><b>"+titre+"</b><em>"+esc(sous)+"</em></span>"
    + "<span class='chevron'>›</span></button>";

  modal('<div class="modal-head"><h2>Ajouter au cahier</h2><button class="btn fantome sm" data-x>Fermer</button></div>'
    + '<div class="modal-body"><div class="creation-liste">'
    + ligne("evaluation","◎","Préparer une épreuve","À partir des annales de la matière et de tes cours")
    + ligne("entrainer","✎","M\'entraîner sur un thème","Exercices et corrigés bâtis sur tes documents")
    + ligne("photo","▣","Importer photos et PDF","Polys, scans, photos de notes — lus, triés et rangés")
    + ligne("texte","✎","Écrire un cours","Saisir ou coller, avec mise au propre")
    + ligne("programme","☰","Coller le programme", m ? "Le semestre de « "+m.nom+" » en chapitres" : "Le semestre en chapitres")
    + ligne("chapitre","§","Nouveau chapitre", m ? "Dans « "+m.nom+" »" : "Dans une matière")
    + ligne("matiere","◍","Nouvelle matière","Ajouter ou renommer tes matières")
    + "</div></div>");

  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  document.querySelectorAll("[data-faire]").forEach(b=>b.onclick=()=>{
    const quoi = b.dataset.faire;
    closeModal();
    if(quoi === "evaluation") return openEvaluation(state.selMat, state.vue === "chapitre" ? state.selChap : "");
    if(quoi === "entrainer")  return openEntrainement(state.selMat, state.vue === "chapitre" ? state.selChap : "");
    if(quoi === "photo")     return openImport();
    if(quoi === "texte")     return openEditor(state.vue === "chapitre" && state.selChap ? { chapitreId: state.selChap } : {});
    if(quoi === "programme") return openProgramme(state.selMat);
    if(quoi === "chapitre")  return openChapModal(null);
    if(quoi === "matiere")   return openMatieresModal();
  });
}

/* ---------- éléments réutilisés ---------- */
const initiales = nom => nom.split(/[\s'’-]+/).filter(Boolean).slice(0,2).map(m=>m[0]).join("").toUpperCase();

function avancement(mid){
  const cs = chapsOf(mid);
  if(!cs.length) return 0;
  return Math.round(cs.filter(c=>c.statut==="maitrise").length / cs.length * 100);
}

/* Horodatage : chaque note porte son jour ET son heure de prise. */
const HEURE = { hour:"2-digit", minute:"2-digit" };

const heureDe = iso => {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleTimeString("fr-FR", HEURE);
};
const dateHeure = iso => {
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" })
    + " à " + d.toLocaleTimeString("fr-FR", HEURE);
};
const ilYA = iso => {
  const d = new Date(iso); if(isNaN(d)) return "";
  const auj = new Date(), hier = new Date(auj.getTime() - 86400000);
  const memeJour = (a,b) => a.toDateString() === b.toDateString();
  if(memeJour(d, auj))  return "aujourd'hui à " + d.toLocaleTimeString("fr-FR", HEURE);
  if(memeJour(d, hier)) return "hier à " + d.toLocaleTimeString("fr-FR", HEURE);
  const j = Math.floor((auj - d) / 86400000);
  if(j < 7) return "il y a " + j + " j";
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"short" });
};

function carteDoc(it){
  const m = matById(it.matiereId), c = chapById(it.chapitreId);
  const extrait = String(it.contenu||"").replace(/[#*=`>|-]/g," ").replace(/\s+/g," ").trim().slice(0,220);
  return '<button class="carte carte-cliquable" data-ouvrir="'+it.id+'">'

    +   '<span class="etiq type">'+esc(TYPES[it.type]||it.type||"doc")+"</span>"

    return;
  }

  const log = state.chats[c.id] || [];
  body.innerHTML = '<div class="chat" id="chatLog">'
    + (log.length
        ? log.map(t=>'<div class="msg '+(t.role==="user"?"me":"ia")+'">'
            + (t.role==="user" ? esc(t.content) : '<div class="prose">'+md(t.content)+"</div>") + "</div>").join("")
        : '<div class="card"><h4>'+esc(c.titre)+"</h4><p class=\"note\">Pose ta question. L'agent répond à partir de <b>tes</b> documents, à ton niveau, et te dit franchement quand la réponse n'y est pas.</p></div>")
    + "</div>";
  window.scrollTo({ top: document.body.scrollHeight });
}

/* =========================================================
   VUE — RÉGLAGES
   ========================================================= */
function vueReglages(){
  const scene = $("#scene");
  const nb = state.items.length, poids = Math.round(JSON.stringify(state.items).length/1024);
  scene.innerHTML = entete("Réglages")
    + '<div class="colonne" style="padding-top:14px">'
    + '<div class="card"><h4>Mon cahier en ligne</h4>'
    +   '<p class="note" id="rSyncEtat">…</p>'
    +   '<div class="doc-actions"><button class="btn pri sm" id="rSync">'
    +     (supaActif() ? "Voir mon lien" : "Mettre mon cahier en ligne") + "</button></div></div>"
    + '<div class="card"><h4>Moteur IA</h4>'
    +   '<p class="note"><b>'+(IA.mode==="api"?"Clé directe":IA.mode==="artifact"?"Assistant Claude":"Éteint")+"</b> — "+esc(IA.detail)+"</p>"
    +   '<p class="note" style="margin-top:6px">Lecture des photos : <b style="color:'+(IA.vision?"var(--ok)":"var(--attention)")+'">'
    +     (IA.vision?"active":"inactive")+"</b></p>"
    +   '<div class="doc-actions"><button class="btn pri sm" id="rIA">Configurer</button></div></div>'
    + '<div class="card"><h4>Lecture des photos</h4>'
    +   '<p class="note">Vérifie sur une page manuscrite fabriquée pour l\'occasion — surlignage, mot entouré, '
    +   "note de marge, schéma — ce que ton modèle restitue vraiment. Score sur 7.</p>"
    +   '<div class="seg" style="margin-top:10px" id="rQual">'
    +     '<button data-q="std" aria-pressed="'+(!qualiteFine())+'">Définition standard</button>'
    +     '<button data-q="fine" aria-pressed="'+qualiteFine()+'">Maximale</button>'
    +   "</div>"
    +   '<div class="doc-actions"><button class="btn pri sm" id="rEpreuve">Lancer l\'épreuve</button></div>'
    +   '<div id="rEpOut"></div></div>'
    + '<div class="card"><h4>Gros PDF</h4>'
    +   '<p class="note">Un PDF numérique est lu par sa couche de texte, sans limite de pages. Ce plafond ne '
    +   "concerne que les pages <b>scannées ou annotées à la main</b>, qui doivent être regardées une par une.</p>"
    +   '<div class="seg" style="margin-top:10px" id="rPlaf">'
    +     PLAFONDS.map(v=>'<button data-p="'+v+'" aria-pressed="'+(plafondPages()===v)+'">'+v+" pages</button>").join("")
    +   "</div>"
    +   '<p class="note" style="margin-top:8px">Au-delà, le texte imprimé reste repris — seules les annotations '
    +   "manuscrites de ces pages sont perdues.</p></div>"
    + '<div class="card"><h4>Matières</h4><p class="note">'+state.matieres.length+" matière"+(state.matieres.length>1?"s":"")+" · modifie la liste, les codes et les profs.</p>"
    +   '<div class="doc-actions"><button class="btn sm" id="rMat">Gérer mes matières</button></div></div>'
    + '<div class="card"><h4>Apparence</h4><p class="note">Le cahier suit ton système. Tu peux forcer un mode.</p>'
    +   '<div class="seg" style="margin-top:10px" id="rTheme">'
    +     ['auto','light','dark'].map(t=>'<button data-theme="'+t+'">'+({auto:"Système",light:"Clair",dark:"Sombre"})[t]+"</button>").join("")
    +   "</div></div>"
    + '<div class="card"><h4>Sauvegarde</h4><p class="note">'
    +   (db ? "Tes cours sont enregistrés sur ton compte et suivent cette page d'un appareil à l'autre."
          : "Sauvegarde locale à ce navigateur. Exporte de temps en temps.")
    +   "</p><p class=\"note\" style=\"margin-top:6px\">"+nb+" document"+(nb>1?"s":"")+" · ~"+poids+" Ko"
    +   " · <span id=\"rStock\">…</span></p>"
    +   '<p class="note" style="margin-top:6px">Un état complet est conservé avant chaque suppression. '
    +   "Rien ne se perd sans qu'on puisse revenir dessus.</p>"
    +   '<div class="doc-actions"><button class="btn sm" id="rExp">Exporter en JSON</button>'
    +   '<button class="btn sm" id="rImp">Importer un JSON</button>'
    +   '<button class="btn sm fantome" id="rRecup">Retrouver du contenu</button></div></div>'
    + "</div>";

  $("#rIA").onclick = openSettings;
  const eSync = $("#rSyncEtat");
  if(eSync){
    eSync.innerHTML = db && !supaActif()
      ? "Cette version enregistre déjà sur ton compte Claude : tes cours suivent d'un appareil à l'autre."
      : !SUPA.url || !SUPA.cle
      ? "Tes cours ne vivent que sur cet appareil. Mets-les en ligne pour les retrouver partout, "
        + "et ne plus rien perdre si tu changes de navigateur."
      : (supaActif()
          ? "Tout ce que tu écris part en ligne automatiquement. Ouvre ton lien depuis n'importe quel appareil."
          : '<b style="color:var(--attention)">Lien absent sur cet appareil.</b> Ouvre ton lien de cahier pour le retrouver.');
  }
  const bSync = $("#rSync");
  if(bSync) bSync.onclick = ecranSynchronisation;
  const bRecup = $("#rRecup");
  if(bRecup) bRecup.onclick = ecranRecuperation;

  // Le stockage se gère seul ; on n'en dit qu'un mot, et seulement s'il coince.
  (async ()=>{
    const el = $("#rStock"); if(!el) return;
    let ls = 0;
    try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); ls += k.length + (localStorage.getItem(k)||"").length; } }catch(e){}
    el.innerHTML = ls*2 > 4000000
      ? '<b style="color:var(--alerte)">stockage saturé</b>'
      : "enregistré sur cet appareil";
  })();

  $("#rEpreuve").onclick = async ()=>{
    const btn = $("#rEpreuve"), out = $("#rEpOut");
    if(IA.mode === "off" || !IA.vision){
      out.innerHTML = '<p class="note" style="margin-top:10px;color:var(--attention)">'
        + "La lecture des photos n'est pas active. Configure le moteur IA au-dessus.</p>";
      return;
    }
    btn.disabled = true;
    out.innerHTML = '<div id="rEpEtat" style="margin-top:10px"></div>'
      + '<pre id="rEpTexte" style="margin-top:10px;background:var(--surface-3);border-radius:10px;'
      + 'padding:10px 12px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;max-height:220px;overflow:auto"></pre>';
    const ch = chantier($("#rEpEtat"), "Lecture de la page d'épreuve", { delai: 150000 });
    try{
      const r = await epreuveVision(t=>{ const e = $("#rEpTexte"); if(e) e.textContent = t; });
      ch.fini();
      const couleur = r.reussis >= 6 ? "var(--ok)" : r.reussis >= 4 ? "var(--attention)" : "var(--alerte)";
      const verdict = r.reussis >= 6 ? "ton modèle lit correctement les annotations."
        : r.reussis >= 4 ? "lecture partielle — essaie la définition maximale, ou un autre modèle."
        : "ce modèle lit mal les annotations — changes-en dans Configurer.";
      $("#rEpEtat").innerHTML = '<b style="color:'+couleur+'">' + r.reussis + "/7 — " + verdict + "</b>"
        + '<div style="margin-top:10px">'
        + r.criteres.map(c=>'<div class="note" style="padding:3px 0">'
            + '<span style="color:'+(c.ok?"var(--ok)":"var(--alerte)")+';font-weight:700">'
            + (c.ok?"✓":"✗") + "</span> " + esc(c.nom) + "</div>").join("")
        + "</div>";
    }catch(e){
      ch.fini();
      $("#rEpEtat").innerHTML = '<b style="color:var(--alerte)">' + esc(msgErreur(e)) + "</b>";
    }
    btn.disabled = false;
  };
  $("#rMat").onclick = openMatieresModal;
  $("#rExp").onclick = exporterJSON;
  $("#rImp").onclick = importerJSON;
  // Lecture protégée comme partout ailleurs : un navigateur qui refuse le
  // stockage (navigation privée stricte) faisait autrement échouer tout le
  // câblage de cet écran à partir d'ici.
  let th = "auto";
  try{ th = localStorage.getItem(LS_KEY+"-theme") || "auto"; }catch(e){}
  $("#rTheme").querySelectorAll("[data-theme]").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.theme === th));
    b.onclick = ()=>{ appliquerTheme(b.dataset.theme); vueReglages(); };
  });
}

function appliquerTheme(t){
  try{ localStorage.setItem(LS_KEY+"-theme", t); }catch(e){}
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

function exporterJSON(){
  const blob = new Blob([JSON.stringify({matieres:state.matieres, chapitres:state.chapitres, items:state.items}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "cahier-bba.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importerJSON(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!confirm("Fusionner ce fichier avec ton cahier actuel ?")) return;
      await instantane("avant import d'un JSON");
      const a = (arr,id)=>arr.some(x=>x.id===id);
      (d.matieres||[]).forEach(m=>{ if(!a(state.matieres,m.id)) state.matieres.push(m); });
      (d.chapitres||[]).forEach(c=>{ if(!a(state.chapitres,c.id)) state.chapitres.push(c); });
      for(const i of (d.items||[])) if(!a(state.items,i.id)){ state.items.push(i); await saveItem(i); }
      await saveStructure(); render(); toast("Import terminé");
    }catch(e){ toast("Fichier illisible"); }
  };
  inp.click();
}

/* =========================================================
   CÂBLAGE COMMUN
   ========================================================= */
function câbler(scene){
  const q = s => scene.querySelectorAll(s);
  q("[data-retour]").forEach(b=>b.onclick=retour);
  q("[data-vue-aller]").forEach(b=>b.onclick=()=>aller(b.dataset.vueAller));
  q("[data-creation]").forEach(b=>b.onclick=openCreation);
  q("[data-mat]").forEach(b=>b.onclick=()=>aller("matiere",{mat:b.dataset.mat}));
  q("[data-ajout]").forEach(b=>b.onclick=openMatieresModal);
  q("[data-chap]").forEach(b=>b.onclick=()=>{
    const c = chapById(b.dataset.chap);
    aller("chapitre",{ chap:b.dataset.chap, mat: c ? c.matiereId : state.selMat });
  });
  q("[data-ouvrir]").forEach(b=>b.onclick=()=>{
    const it = state.items.find(x=>x.id===b.dataset.ouvrir); if(!it) return;
    state.openDocs.add(it.id);
    aller("chapitre",{ chap:it.chapitreId, mat:it.matiereId });
  });
  q("[data-doc]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.doc;
    state.openDocs.has(id) ? state.openDocs.delete(id) : state.openDocs.add(id);
    render();
  });
  q("[data-import]").forEach(b=>b.onclick=()=>openImport());
  q("[data-ecrire]").forEach(b=>b.onclick=()=>{
    const cid = b.dataset.ecrire;
    openEditor(cid && chapById(cid) ? { chapitreId: cid } : {});
  });
  q("[data-newchap]").forEach(b=>b.onclick=()=>openChapModal(null));
  q("[data-programme]").forEach(b=>b.onclick=()=>openProgramme(state.selMat));
  q("[data-ranger]").forEach(b=>b.onclick=()=>rangerMatiere(state.selMat));
  q("[data-deplacer]").forEach(b=>b.onclick=()=>deplacerDoc(b.dataset.deplacer));
  q("[data-preparer]").forEach(b=>b.onclick=()=>preparerChapitre(b.dataset.preparer));
  q("[data-exos]").forEach(b=>b.onclick=()=>entrainerChapitre(b.dataset.exos));
  q("[data-eval]").forEach(b=>b.onclick=()=>{ const c=chapById(b.dataset.eval); openEvaluation(c?c.matiereId:state.selMat, b.dataset.eval); });
  q("[data-evalmat]").forEach(b=>b.onclick=()=>openEvaluation(state.selMat, ""));
  q("[data-editmat]").forEach(b=>b.onclick=openMatieresModal);
  q("[data-editchap]").forEach(b=>b.onclick=()=>openChapModal(b.dataset.editchap));
  q("[data-delchap]").forEach(b=>b.onclick=()=>delChapitre(b.dataset.delchap));
  q("[data-edit]").forEach(b=>b.onclick=()=>openEditor({itemId:b.dataset.edit}));
  q("[data-monter]").forEach(b=>b.onclick=()=>{
    const it = state.items.find(x=>x.id===b.dataset.monter);
    if(it) reordonner(it.chapitreId, it.id, -1);
  });
  q("[data-descendre]").forEach(b=>b.onclick=()=>{
    const it = state.items.find(x=>x.id===b.dataset.descendre);
    if(it) reordonner(it.chapitreId, it.id, +1);
  });
  q("[data-expliquer]").forEach(b=>b.onclick=()=>expliquer(b.dataset.expliquer));
  q("[data-fiche]").forEach(b=>b.onclick=()=>genererFiche(b.dataset.fiche));
  q("[data-del]").forEach(b=>b.onclick=async()=>{
    const it = state.items.find(x=>x.id===b.dataset.del);
    if(!it || !confirm("Supprimer « "+(it.titre||"ce document")+" » ?"
      + "\n\nUne sauvegarde est conservée : Réglages → Récupérer du contenu.")) return;
    await instantane("avant suppression de " + (it.titre||"un document"));
    await deleteItem(b.dataset.del); render(); toast("Document supprimé");
  });
  q("[data-analyse]").forEach(b=>b.onclick=()=>{ state.tab="analyse"; analyseChapitre(b.dataset.analyse); });
  q("[data-question]").forEach(b=>b.onclick=()=>{ state.selChap = b.dataset.question; state.tab="chat"; aller("agent"); });
  q("[data-voiranalyse]").forEach(b=>b.onclick=()=>{ state.tab="analyse"; aller("agent"); });
  q("[data-statut]").forEach(b=>b.onclick=async()=>{
    const c = chapById(state.selChap); if(!c) return;
    c.statut = b.dataset.statut; await saveStructure(); render();
  });
}

/* =========================================================
   RENDU PRINCIPAL
   ========================================================= */
function render(){
  savePref();
  renderOnglets();
  $("#composer").classList.add("hide");
  switch(state.vue){
    case "matiere":   vueMatiere(); break;
    case "chapitre":  vueChapitre(); break;
    case "recherche": vueRecherche(); break;
    case "agent":     vueAgent(); break;
    case "reglages":  vueReglages(); break;
    default:          vueCahier();
  }
}

/* =========================================================
   ÉVÉNEMENTS & DÉMARRAGE
   ========================================================= */
$("#chatSend").onclick = ()=>envoyerChat(false);
$("#chatInput").addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); envoyerChat(false); }
});
$("#chatInput").addEventListener("input", e=>{
  e.target.style.height = "auto";
  e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});

async function amorcer(){
  state.matieres = MATIERES_DEFAUT.map((nom,i)=>({
    id: uid(), nom, code:"", prof:"", couleur: COULEURS[i % COULEURS.length], ordre: i
  }));
  state.selMat = state.matieres[0].id;
  await saveStructure();
}

// KaTeX arrive après le premier affichage (script différé) : on redessine une fois.
window.addEventListener("load", ()=>{ if(window.katex){ try{ render(); }catch(e){} } });

(async function boot(){
  const th = (()=>{ try{ return localStorage.getItem(LS_KEY+"-theme") || "auto"; }catch(e){ return "auto"; } })();
  if(th !== "auto") document.documentElement.setAttribute("data-theme", th);

  chargerConfig();
  chargerSupa();
  await loadAll(); loadPref(); majMode(); render();
  const premiereSync = synchroniser();   // sans await : l'écran est déjà là

  if(typeof claude !== "undefined" && claude && claude.use){
    try{ db = await claude.use("db"); }catch(e){}
    try{ sample = await claude.use("sample"); }catch(e){}
    if(sample){
      aiOn = true;
      try{
        const l = await sample.limits();
        imgLim = l && l.images ? l.images : null;
        if(!imgLim) imgLimErr = "limites sans volet images";
      }catch(e){ imgLim = null; imgLimErr = (e && e.code) || "limits() a échoué"; }
    }
    if(db){ await loadAll(); loadPref(); }
    majMode(); render();
  }

  if(!state.matieres.length && supaActif()) await premiereSync;
  if(!state.matieres.length){ await amorcer(); render(); }
})();

})();
</script>
