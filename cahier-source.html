    + (IA.vision
        ? '<div class="drop" id="drop" tabindex="0" role="button">'
          +   '<div style="font-family:var(--serif);font-size:17px">Dépose tes photos ici</div>'
          +   '<p class="note" style="margin-top:6px">ou <u>clique pour choisir</u> — jusqu\'à '+maxN+' images par analyse. '
          +   'Fichiers texte (.txt, .md, .csv) acceptés aussi.</p>'
          +   '<input type="file" id="files" multiple accept="'+esc(accept)+'" class="sr">'
          + "</div>"
        : '<div class="card" style="border-color:var(--warn)"><h4 style="color:var(--warn)">Lecture des photos inactive</h4>'
          + '<p class="note">'+esc(IA.detail)+' Enregistre une clé API dans ⚙ Réglages pour lire tes photos directement ici, '
          + 'ou colle le texte ci-dessous.</p></div>')
    + '<div class="thumbs" id="thumbs"></div>'
    + '<div><label class="lab" for="iPaste">Ou colle du texte — poly, PDF copié-collé, transcription</label>'
    +   '<textarea class="field" id="iPaste" rows="7" placeholder="Colle ici le contenu brut. Plusieurs chapitres ou plusieurs documents à la suite : ils seront séparés et classés."></textarea></div>'
    + '<div><label class="lab" for="iHint">Précision facultative</label>'
    +   '<input class="field" id="iHint" placeholder="Ex. « TD du 3 octobre, suite du chapitre 2 »"></div>'
    + '<p class="note">Les pages qui se suivent sont regroupées en un seul document ; cours, exercices et corrigés sont séparés automatiquement.</p>'
    + '<div id="iOut"></div>'
    + "</div></div>"
    + '<div class="modal-foot"><span class="note" id="iState"></span><div style="flex:1"></div>'
    + '<button class="btn" data-x>Fermer</button><button class="btn pri" id="iGo" disabled>Analyser</button></div>', {wide:true, sticky:true});

  const files = [], drop = $("#drop"), input = $("#files");
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  if(drop && input){
    drop.onclick = ()=>input.click();
    drop.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("hot"); }));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("hot"); }));
    drop.addEventListener("drop", e=>add(e.dataTransfer.files));
    input.onchange = ()=>add(input.files);
  }
  $("#iPaste").oninput = paint;
  $("#iPaste").focus();

  function add(list){
    for(const f of list){
      if(files.length >= (maxN||8)+6){ toast("Trop de fichiers d'un coup"); break; }
      files.push(f);
    }
    paint();
  }
  function paint(){
    const host = $("#thumbs");
    host.innerHTML = files.map((f,idx)=>'<div class="thumb">'
      + (f.type.startsWith("image/") ? '<img alt="" src="'+URL.createObjectURL(f)+'">' : '<div class="doc-ic">'+esc(f.name.slice(0,24))+"</div>")
      + '<button class="x" data-rm="'+idx+'" aria-label="Retirer">✕</button></div>').join("");
    host.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ files.splice(Number(b.dataset.rm),1); paint(); });
    const imgs = files.filter(f=>f.type.startsWith("image/")).length;
    const colle = $("#iPaste").value.trim();
    $("#iGo").disabled = !files.length && !colle;
    $("#iState").textContent = files.length ? files.length+" fichier(s)"+(imgs>maxN?" — "+imgs+" images, max "+maxN+" par analyse":"")
                             : (colle ? (colle.length<1000 ? colle.length+" caractères collés"
                                                           : (colle.length/1000).toFixed(1).replace(".",",")+" k caractères collés") : "");
  }
  paint();

  $("#iGo").onclick = ()=>lancerImport(files, $("#iM").value, $("#iHint").value.trim(), maxN, $("#iPaste").value.trim());
}

const SCHEMA_IMPORT = {
  type:"object",
  properties:{
    documents:{ type:"array", items:{
      type:"object",
      properties:{
        titre:{type:"string"},
        type:{type:"string", enum:["cours","td","exercice","fiche","annale","note"]},
        chapitreId:{type:"string"},
        chapitreTitre:{type:"string"},
        chapitreNumero:{type:"integer"},
        pages:{type:"string"},
        transcription:{type:"string"},
        concepts:{type:"array", items:{type:"string"}},
        incertitudes:{type:"array", items:{type:"string"}}
      },
      required:["titre","type","chapitreId","chapitreTitre","chapitreNumero","pages","transcription","concepts","incertitudes"],
      additionalProperties:false }}
  },
  required:["documents"],
  additionalProperties:false
};

async function lancerImport(files, mid, hint, maxN, colle){
  if(IA.mode === "off"){ toast("L'agent IA n'est pas configuré — voir ⚙ Réglages."); return; }
  const imgs = files.filter(f=>f.type.startsWith("image/"));
  const txts = files.filter(f=>!f.type.startsWith("image/"));
  if(imgs.length && !IA.vision && !colle){
    toast("La lecture des photos n'est pas active ici — voir ⚙ Réglages.", 4500); return;
  }
  if(imgs.length > maxN){ toast("Maximum "+maxN+" images par analyse — retires-en quelques-unes."); return; }

  let annexes = "";
  for(const f of txts){
    if(!TXT_EXT.test(f.name) && !f.type.startsWith("text/")){ toast("Format non lisible : "+f.name+" — exporte-le en images."); continue; }
    try{ annexes += "\n\n=== FICHIER JOINT : "+f.name+" ===\n" + (await f.text()).slice(0,18000); }catch(e){}
  }

  const btn = $("#iGo"); btn.disabled = true;
  $("#iState").innerHTML = '<span class="thinking"><i></i>Lecture des documents…</span>';
  $("#iOut").innerHTML = '<div class="card"><p class="note">L\'agent lit chaque page, retranscrit intégralement et identifie de quel chapitre il s\'agit. 30 à 90 secondes.</p></div>';

  const m = matById(mid), cs = chapsOf(mid);
  const liste = cs.length ? cs.map(c=>'- id "'+c.id+'" · Ch. '+(c.numero||"?")+" — "+c.titre).join("\n") : "(aucun chapitre existant)";

  const avecImages = imgs.length > 0 && IA.vision;

  const prompt = "Tu retranscris et classes des documents de cours de la matière « " + (m?m.nom:"?") + " ».\n"
    + (avecImages ? "Les "+imgs.length+" image(s) jointes sont des photos de notes manuscrites, de polycopiés, de tableaux ou de slides, dans l'ordre où elles ont été prises.\n" : "")
    + (hint ? "Précision donnée par l'étudiant : « "+hint+" ».\n" : "")
    + "\nCHAPITRES DÉJÀ EXISTANTS dans cette matière :\n" + liste + "\n"
    + (colle ? "\nTEXTE FOURNI PAR L'ÉTUDIANT :\n" + colle.slice(0,34000) + "\n" : "")
    + (annexes ? "\nCONTENU DES FICHIERS JOINTS :" + annexes + "\n" : "")
    + "\nTravail à faire :\n"
    + "1. RETRANSCRIS intégralement chaque document : tout le texte, titres, numérotation, définitions, formules (en LaTeX entre $…$), tableaux (markdown), schémas (décris-les en une phrase entre crochets). Ne résume pas, ne saute rien, n'invente rien. Marque `[illisible]` là où tu n'es pas sûr.\n"
    + "2. REGROUPE les pages qui se suivent et appartiennent au même document en une seule entrée ; SÉPARE en entrées distinctes ce qui est de nature différente (cours / exercices / corrigé) ou d'un chapitre différent.\n"
    + "3. CLASSE chaque entrée : réutilise l'id d'un chapitre existant si le contenu y correspond, sinon propose un nouveau chapitre.\n\n"
    + 'Réponds UNIQUEMENT avec ce JSON :\n'
    + '{"documents":[{"titre":"titre court et explicite","type":"cours|td|exercice|fiche|annale|note",'
    + '"chapitreId":"id d\'un chapitre existant, ou chaîne vide pour un nouveau chapitre",'
    + '"chapitreTitre":"titre du chapitre (existant ou proposé)","chapitreNumero":3,'
    + '"pages":"1-2","transcription":"le document complet en markdown","concepts":["notion 1"],"incertitudes":["passage illisible ou douteux"]}]}';

  const appeler = withImages => iaJson({
    system: NIVEAU,
    messages: [{ role:"user", content: prompt }],
    images: withImages ? imgs : null,
    schema: SCHEMA_IMPORT,
    effort: "medium",
    maxTokens: 32000
  });

  try{
    let res;
    try{
      res = await appeler(avecImages);
    }catch(e){
      if(e && e.code === "images_unavailable" && avecImages){
        imagesKO = true; majMode();
        if(colle || annexes){
          $("#iState").innerHTML = '<span class="thinking"><i></i>Photos refusées — reprise sur le texte seul…</span>';
          res = await appeler(false);
        }else{
          throw e;
        }
      }else throw e;
    }
    const docs = (res && res.documents) || [];
    if(!docs.length){ $("#iState").textContent = "Rien n'a pu être lu."; btn.disabled=false; return; }
    $("#iState").textContent = docs.length + " document(s) reconnu(s)" + (!avecImages && imgs.length ? " — photos ignorées" : "");
    afficherResultats(docs, mid);
  }catch(e){
    $("#iState").textContent = msgErreur(e);
    $("#iOut").innerHTML = (e && (e.code === "images_unavailable" || e.code === "not_granted"))
      ? '<div class="card" style="border-color:var(--warn)"><h4 style="color:var(--warn)">Activer la lecture des photos</h4>'
        + '<p class="note">Ouvre ⚙ Réglages et enregistre ta clé API : l\'OCR tourne alors directement dans l\'outil, sans intermédiaire. '
        + 'En attendant, colle le texte dans le champ ci-dessus — le tri et le classement fonctionnent normalement.</p></div>'
      : "";
    btn.disabled = false;
  }
}

function afficherResultats(docs, mid){
  const cs = chapsOf(mid);
  $("#iOut").innerHTML = '<h3 style="font-family:var(--serif);font-size:16px;margin:16px 0 10px">Vérifie avant d\'enregistrer</h3>'
    + docs.map((d,idx)=>{
      const chapOpts = cs.map(c=>'<option value="'+c.id+'"'+(c.id===d.chapitreId?" selected":"")+">Ch. "+esc(c.numero||"?")+" — "+esc(c.titre)+"</option>").join("")
        + '<option value="__new"'+(!d.chapitreId?" selected":"")+">+ Nouveau : "+esc(d.chapitreTitre||"sans titre")+"</option>";
      return '<div class="result" data-r="'+idx+'">'
        + '<div class="result-head"><input value="'+esc(d.titre||"Document")+'" data-f="titre" aria-label="Titre"></div>'
        + '<div class="result-body"><div class="grid2" style="margin-bottom:10px">'
        +   '<div><label class="lab">Chapitre</label><select class="field" data-f="chap">'+chapOpts+"</select></div>"
        +   '<div><label class="lab">Type</label><select class="field" data-f="type">'
        +     Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(d.type===k?" selected":"")+">"+TYPES[k]+"</option>").join("")+"</select></div>"
        + "</div>"
        + '<div class="hide" data-newchap><label class="lab">Titre du nouveau chapitre</label>'
        +   '<input class="field" data-f="newtitre" value="'+esc(d.chapitreTitre||"")+'" style="margin-bottom:10px"></div>'
        + (d.concepts && d.concepts.length ? '<div class="chap-meta" style="margin-bottom:8px">'+d.concepts.slice(0,8).map(c=>'<span class="pill type">'+esc(c)+"</span>").join("")+"</div>" : "")
        + (d.incertitudes && d.incertitudes.length ? '<p class="note" style="color:var(--warn);margin-bottom:8px">À vérifier : '+esc(d.incertitudes.join(" · "))+"</p>" : "")
        + '<label class="lab">Retranscription '+(d.pages?"(pages "+esc(d.pages)+")":"")+"</label>"
        + '<textarea class="field" data-f="contenu" rows="9" style="font-family:var(--mono);font-size:12.5px">'+esc(d.transcription||"")+"</textarea>"
        + '<div class="doc-actions"><button class="btn sm ghost danger" data-drop="'+idx+'">Écarter ce document</button></div>'
        + "</div></div>";
    }).join("")
    + '<button class="btn pri" id="iSave" style="width:100%;justify-content:center;margin-top:6px">Enregistrer dans le classeur</button>';

  const host = $("#iOut");
  function sync(){
    host.querySelectorAll(".result").forEach(r=>{
      const sel = r.querySelector('[data-f="chap"]');
      r.querySelector("[data-newchap]").classList.toggle("hide", sel.value!=="__new");
    });
  }
  host.querySelectorAll('[data-f="chap"]').forEach(s=>s.onchange=sync); sync();
  host.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{ b.closest(".result").remove(); });

  $("#iSave").onclick = async ()=>{
    const cards = Array.from(host.querySelectorAll(".result"));
    if(!cards.length){ toast("Plus rien à enregistrer"); return; }
    let n = 0;
    for(const r of cards){
      const g = f => r.querySelector('[data-f="'+f+'"]');
      let chapId = g("chap").value;
      if(chapId==="__new"){
        const t = g("newtitre").value.trim() || "Chapitre sans titre";
        const exist = chapsOf(mid).find(c=>c.titre.toLowerCase()===t.toLowerCase());
        if(exist) chapId = exist.id;
        else{
          const num = chapsOf(mid).reduce((x,c)=>Math.max(x,Number(c.numero)||0),0)+1;
          const nc = { id:uid(), matiereId:mid, titre:t, numero:num, statut:"encours", note:"" };
          state.chapitres.push(nc); chapId = nc.id;
        }
      }
      const it = { id:uid(), matiereId:mid, chapitreId:chapId, type:g("type").value,
        titre:g("titre").value.trim()||"Document", contenu:g("contenu").value, source:"photo", date:new Date().toISOString() };
      state.items.push(it); await saveItem(it); state.openChaps.add(chapId); n++;
    }
    await saveStructure();
    state.selMat = mid; closeModal(); render();
    toast(n + " document(s) classé(s)");
  };
}

/* ---------- réglages ---------- */
function openSettings(){
  const nb = state.items.length, poids = Math.round(JSON.stringify(state.items).length/1024);
  modal('<div class="modal-head"><h2>Réglages</h2><button class="btn ghost sm" data-x>✕</button></div>'
    + '<div class="modal-body"><div class="stack">'
    + '<div class="card"><h4>Sauvegarde</h4><p class="note">'
    +   (db ? "Tes cours sont enregistrés en ligne sur ton compte et suivent cette page d'un appareil à l'autre."
          : "Sauvegarde locale à ce navigateur uniquement — la synchronisation en ligne n'est pas disponible ici.")
    + '</p><p class="note" style="margin-top:6px">'+nb+" document(s) · ~"+poids+' Ko</p>'
    + '<div class="doc-actions"><button class="btn sm" id="sExport">Exporter en JSON</button>'
    + '<button class="btn sm" id="sImport">Importer un JSON</button></div></div>'
    + '<div class="card"><h4>Moteur IA</h4>'
    + '<p class="note"><b>'+(IA.mode==="api"?"Clé API directe":IA.mode==="artifact"?"Assistant Claude intégré":"Éteint")+'</b> — '+esc(IA.detail)+"</p>"
    + '<p class="note" style="margin-top:6px">Lecture des photos : <b style="color:'+(IA.vision?"var(--ok)":"var(--warn)")+'">'
    +   (IA.vision ? "active" : "inactive") + "</b></p>"
    + (RESEAU_POSSIBLE
        ? '<div style="margin-top:14px"><label class="lab">Fournisseur</label><div class="seg" id="sFourn">'
          + Object.keys(FOURNISSEURS).map(k=>'<button type="button" data-f="'+k+'" aria-pressed="'+(IA.fournisseur===k)+'">'+esc(FOURNISSEURS[k].nom)+"</button>").join("")
          + "</div>"
          + '<p class="note" style="margin-top:6px">'+esc(FOURNISSEURS[IA.fournisseur].note)+"</p></div>"
          + '<div style="margin-top:12px"><label class="lab" for="sKey">Clé API — '+esc(FOURNISSEURS[IA.fournisseur].lienCle)+'</label>'
          + '<input class="field" id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="colle ta clé ici" value="'+esc(cleActive())+'">'
          + '<p class="note" style="margin-top:6px">Elle reste sur cet appareil (stockage local du navigateur) et n\'est envoyée qu\'au fournisseur choisi. '
          + 'C\'est elle qui débloque l\'OCR de tes photos dans l\'outil.</p></div>'
          + '<div style="margin-top:12px"><label class="lab" for="sModele">Modèle</label>'
          + '<div style="display:flex;gap:8px"><input class="field" id="sModele" value="'+esc(IA.modele)+'" spellcheck="false">'
          + '<button class="btn sm" id="sModList" style="white-space:nowrap">Lister</button></div>'
          + '<p class="note" id="sModOut" style="margin-top:6px">« Lister » interroge le fournisseur pour afficher les modèles réellement disponibles avec ta clé.</p></div>'
          + '<div class="doc-actions" style="margin-top:12px"><button class="btn sm pri" id="sKeySave">Enregistrer</button>'
          + '<button class="btn sm" id="sKeyTest">Tester la lecture d\'une photo</button></div>'
          + '<p class="note" id="sKeyOut" style="margin-top:8px"></p>'
        : '<p class="note" style="margin-top:10px">Cette page est servie par Claude : elle n\'a pas accès au réseau, donc aucune clé API ne peut être utilisée ici. '
          + 'Pour l\'OCR photo, ouvre la version hébergée du fichier.</p>')
    + "</div>"
    + '<div class="card"><h4>Matières</h4><p class="note">Modifie la liste, les codes et les profs.</p>'
    + '<div class="doc-actions"><button class="btn sm" id="sMat">Gérer mes matières</button></div></div>'
    + "</div></div>"
    + '<div class="modal-foot"><button class="btn" data-x>Fermer</button></div>');

  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  $("#sMat").onclick = ()=>{ closeModal(); openMatieresModal(); };

  if($("#sKeySave")){
    document.querySelectorAll("#sFourn [data-f]").forEach(b=>b.onclick=()=>{
      enregistrerConfig({ fournisseur: b.dataset.f });
      closeModal(); openSettings();
    });

    $("#sKeySave").onclick = async ()=>{
      const btn = $("#sKeySave"), out = $("#sKeyOut");
      enregistrerConfig({ cle: $("#sKey").value, modele: $("#sModele").value.trim() });
      if(!cleActive()){ closeModal(); openSettings(); return; }
      btn.disabled = true;
      out.innerHTML = '<span class="thinking"><i></i>Vérification de la clé et choix du modèle…</span>';
      try{
        const noms = await listerModeles();
        const choix = choisirModele(noms);
        if(choix && noms.indexOf(IA.modele) < 0) enregistrerConfig({ modele: choix });
        closeModal(); openSettings();
        const o2 = $("#sKeyOut");
        if(o2) o2.innerHTML = '<b style="color:var(--ok)">Clé valide.</b> Modèle retenu : <b>'+esc(IA.modele)+"</b> — "
          + noms.length + " modèle(s) accessibles avec ta clé.";
      }catch(e){
        out.innerHTML = '<b style="color:var(--alert)">'+esc(msgErreur(e))+"</b>";
        btn.disabled = false;
      }
    };

    $("#sModList").onclick = async ()=>{
      const out = $("#sModOut"), btn = $("#sModList");
      if(!$("#sKey").value.trim()){ out.textContent = "Colle d'abord ta clé, puis relance « Lister »."; return; }
      btn.disabled = true; out.innerHTML = '<span class="thinking"><i></i>Interrogation du fournisseur…</span>';
      try{
        const noms = await listerModeles($("#sKey").value.trim());
        if(!noms.length){ out.textContent = "Aucun modèle renvoyé pour cette clé."; btn.disabled=false; return; }
        out.innerHTML = '<span class="note">Clique un modèle pour le choisir :</span><span class="chap-meta" style="margin-top:6px">'
          + noms.slice(0,24).map(n=>'<button type="button" class="pill type" data-mod="'+esc(n)+'" style="cursor:pointer;border:1px solid var(--line-2)">'+esc(n)+"</button>").join("")
          + "</span>";
        out.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{ $("#sModele").value = b.dataset.mod; });
      }catch(e){ out.innerHTML = '<b style="color:var(--alert)">'+esc(msgErreur(e))+"</b>"; }
      btn.disabled = false;
    };

    $("#sKeyTest").onclick = async ()=>{
      const out = $("#sKeyOut"), btn = $("#sKeyTest");
      enregistrerConfig({ cle: $("#sKey").value, modele: $("#sModele").value.trim() });
      if(!cleActive()){ out.textContent = "Enregistre d'abord une clé."; return; }
      btn.disabled = true;
      out.innerHTML = '<span class="thinking"><i></i>Test en cours — une image est générée puis envoyée…</span>';
      try{
        // Image de test : le mot ESSEC dessiné dans un canvas, puis relu par l'IA.
        const c = document.createElement("canvas");
        c.width = 420; c.height = 140;
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
        g.fillStyle = "#000"; g.font = "bold 64px Georgia, serif";
        g.fillText("ESSEC 2026", 20, 92);
        const data = c.toDataURL("image/jpeg", 0.9);
        const t = await appelAPI({
          messages: [{ role:"user", content:"Quel texte est écrit sur cette image ? Réponds uniquement par ce texte." }],
          images: [{ media:"image/jpeg", b64: data.slice(data.indexOf(",")+1) }],
          effort: "low", maxTokens: 200
        });
        const ok = /ESSEC/i.test(t);
        out.innerHTML = ok
          ? '<b style="color:var(--ok)">Lecture des photos confirmée.</b> L\'IA a bien lu « '+esc(t.trim().slice(0,40))+' ». L\'import photo est opérationnel.'
          : '<b style="color:var(--warn)">Réponse inattendue :</b> '+esc(t.trim().slice(0,120));
      }catch(e){
        out.innerHTML = '<b style="color:var(--alert)">Échec :</b> '+esc(msgErreur(e));
      }
      btn.disabled = false;
    };
  }
  $("#sExport").onclick = ()=>{
    const blob = new Blob([JSON.stringify({matieres:state.matieres, chapitres:state.chapitres, items:state.items}, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "cahier-bba.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  $("#sImport").onclick = ()=>{
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      try{
        const d = JSON.parse(await f.text());
        if(!confirm("Fusionner ce fichier avec ton classeur actuel ?")) return;
        const has = (arr,id)=>arr.some(x=>x.id===id);
        (d.matieres||[]).forEach(m=>{ if(!has(state.matieres,m.id)) state.matieres.push(m); });
        (d.chapitres||[]).forEach(c=>{ if(!has(state.chapitres,c.id)) state.chapitres.push(c); });
        for(const i of (d.items||[])) if(!has(state.items,i.id)){ state.items.push(i); await saveItem(i); }
        await saveStructure(); closeModal(); render(); toast("Import terminé");
      }catch(e){ toast("Fichier illisible"); }
    };
    inp.click();
  };
}

    id: uid(), nom, code:"", prof:"", couleur: COULEURS[i % COULEURS.length], ordre: i
  }));

(async function boot(){
  chargerConfig();
  await loadAll(); loadPref(); majMode(); render();
  if(typeof claude !== "undefined" && claude && claude.use){
    try{ db = await claude.use("db"); }catch(e){}
    try{ sample = await claude.use("sample"); }catch(e){}
    if(sample){
      aiOn = true;
      try{
        const l = await sample.limits();
        imgLim = l && l.images ? l.images : null;
        if(!imgLim) imgLimErr = "limites sans volet images";
      }catch(e){ imgLim = null; imgLimErr = (e && e.code) || "limits() a échoué"; }
    }
    if(db){ await loadAll(); loadPref(); }
    majMode(); render();
  }
  if(!state.matieres.length){ await amorcer(); render(); }
})();

})();
