<title>Cahier — Global BBA</title>
<style>
  :root{
    --paper:#EEF0EC; --surface:#FFFFFF; --surface-2:#F5F7F3; --surface-3:#E9ECE6;
    --line:#D8DCD4; --line-2:#C3C9BE;
    --ink:#18211D; --ink-2:#4C5651; --ink-3:#7C8681;
    --encre:#1E4B87; --encre-2:#2E63A8; --encre-soft:#E3EBF6; --on-encre:#FFFFFF;
    --surligneur:#D7E04A;
    --ok:#2C7A52; --ok-soft:#E2F0E7;
    --warn:#9C6B14; --warn-soft:#F5EBD6;
    --alert:#A93E2E; --alert-soft:#F6E3DE;
    --neutre-soft:#E7EAE4;
    --shadow:0 1px 2px rgba(24,33,29,.06), 0 8px 24px -16px rgba(24,33,29,.35);
    --r:10px;
    --serif:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#101614; --surface:#171F1B; --surface-2:#1D2622; --surface-3:#232D28;
      --line:#2A3531; --line-2:#3A4741;
      --ink:#E9EEEA; --ink-2:#A6B1AC; --ink-3:#77837D;
      --encre:#84AEEC; --encre-2:#9CC0F3; --encre-soft:#19273A; --on-encre:#0D1512;
      --surligneur:#C6D247;
      --ok:#61C08D; --ok-soft:#15291F;
      --warn:#D6A44C; --warn-soft:#2B2317;
      --alert:#E28470; --alert-soft:#2E1B17;
      --neutre-soft:#222B27;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101614; --surface:#171F1B; --surface-2:#1D2622; --surface-3:#232D28;
    --line:#2A3531; --line-2:#3A4741;
    --ink:#E9EEEA; --ink-2:#A6B1AC; --ink-3:#77837D;
    --encre:#84AEEC; --encre-2:#9CC0F3; --encre-soft:#19273A; --on-encre:#0D1512;
    --surligneur:#C6D247;
    --ok:#61C08D; --ok-soft:#15291F;
    --warn:#D6A44C; --warn-soft:#2B2317;
    --alert:#E28470; --alert-soft:#2E1B17;
    --neutre-soft:#222B27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
  :root[data-theme="light"]{
    --paper:#EEF0EC; --surface:#FFFFFF; --surface-2:#F5F7F3; --surface-3:#E9ECE6;
    --line:#D8DCD4; --line-2:#C3C9BE;
    --ink:#18211D; --ink-2:#4C5651; --ink-3:#7C8681;
    --encre:#1E4B87; --encre-2:#2E63A8; --encre-soft:#E3EBF6; --on-encre:#FFFFFF;
    --surligneur:#D7E04A;
    --ok:#2C7A52; --ok-soft:#E2F0E7;
    --warn:#9C6B14; --warn-soft:#F5EBD6;
    --alert:#A93E2E; --alert-soft:#F6E3DE;
    --neutre-soft:#E7EAE4;
    --shadow:0 1px 2px rgba(24,33,29,.06), 0 8px 24px -16px rgba(24,33,29,.35);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--encre);outline-offset:2px;border-radius:4px}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  ::placeholder{color:var(--ink-3)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:260px minmax(0,1fr) 380px;height:100vh;height:100dvh;overflow:hidden}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .rail{background:var(--surface-2);border-right:1px solid var(--line)}
  .work{background:var(--paper)}
  .panel{background:var(--surface-2);border-left:1px solid var(--line)}

  .colhead{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line);min-height:56px}
  .colbody{flex:1;overflow-y:auto;overscroll-behavior:contain}

  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .wordmark{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
  .wordmark small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:1px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--surface-3);border-color:var(--ink-3)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--encre);border-color:var(--encre);color:var(--on-encre)}
  .btn.pri:hover{background:var(--encre-2);border-color:var(--encre-2)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  .btn.danger:hover{border-color:var(--alert);color:var(--alert)}

  .field{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px}
  .field:focus{outline:none;border-color:var(--encre);box-shadow:0 0 0 3px var(--encre-soft)}
  textarea.field{resize:vertical;line-height:1.6}
  label.lab{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}

  /* ---------- matières ---------- */
  .mat-list{padding:8px}
  .mat{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;transition:background .12s}
  .mat:hover{background:var(--surface-3)}
  .mat[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
  .mat .tab{width:6px;height:26px;border-radius:0 3px 3px 0;flex:none;margin-left:-4px}
  .mat .body{display:block;flex:1;min-width:0}
  .mat .nom{display:block;font-family:var(--serif);font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mat[aria-current="true"] .nom{font-weight:600}
  .mat .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
  .mat .sub{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;background:var(--ok)}

  /* ---------- travail ---------- */
  .work-head{padding:16px 24px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .work-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.015em}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .stat{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
  .stat b{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}
  .toolbar .grow{flex:1;min-width:120px}

  .chapters{padding:16px 24px 60px;display:flex;flex-direction:column;gap:10px;max-width:900px}
  .chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .chap.open{box-shadow:var(--shadow)}
  .chap-head{width:100%;display:flex;align-items:flex-start;gap:12px;padding:13px 14px;text-align:left}
  .chap-head:hover{background:var(--surface-2)}
  .chap-num{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-3);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums;flex:none;margin-top:1px}
  .chap-t{flex:1;min-width:0}
  .chap-t h3{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.3}
  .chap-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
  .pill.st-nouveau{background:var(--neutre-soft);color:var(--ink-2)}
  .pill.st-encours{background:var(--warn-soft);color:var(--warn)}
  .pill.st-arevoir{background:var(--alert-soft);color:var(--alert)}
  .pill.st-maitrise{background:var(--ok-soft);color:var(--ok)}
  .pill.type{background:var(--surface-3);color:var(--ink-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em}
  .pill.gap{background:var(--alert-soft);color:var(--alert)}
  .pill.ia{background:var(--encre-soft);color:var(--encre)}
  .chevron{color:var(--ink-3);flex:none;transition:transform .16s;margin-top:3px}
  .chap.open .chevron{transform:rotate(90deg)}
  .chap-body{border-top:1px solid var(--line);padding:4px 14px 14px}

  .doc{border-bottom:1px solid var(--line);padding:11px 0}
  .doc:last-child{border-bottom:none}
  .doc-head{width:100%;display:flex;align-items:center;gap:9px;text-align:left}
  .doc-head h4{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-date{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .doc-body{margin-top:10px;padding:12px 14px;background:var(--surface-2);border-radius:8px}
  .doc-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

  .prose{font-size:14px;line-height:1.65;color:var(--ink)}
  .prose>*:first-child{margin-top:0}
  .prose>*:last-child{margin-bottom:0}
  .prose h1,.prose h2,.prose h3{font-family:var(--serif);margin:1.2em 0 .4em;line-height:1.3}
  .prose h1{font-size:19px}.prose h2{font-size:17px}.prose h3{font-size:15px}
  .prose p{margin:.55em 0}
  .prose ul,.prose ol{margin:.5em 0;padding-left:1.35em}
  .prose li{margin:.25em 0}
  .prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-3);padding:1px 4px;border-radius:4px}
  .prose pre{background:var(--surface-3);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:.7em 0}
  .prose pre code{background:none;padding:0}
  .prose blockquote{margin:.7em 0;padding:2px 0 2px 12px;border-left:2px solid var(--line-2);color:var(--ink-2)}
  .prose hr{border:none;border-top:1px solid var(--line);margin:1.1em 0}
  .prose mark{background:color-mix(in srgb,var(--surligneur) 55%,transparent);color:inherit;padding:0 2px;border-radius:2px}
  .prose table{border-collapse:collapse;font-size:13px;margin:.7em 0}
  .prose th,.prose td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .prose th{background:var(--surface-3);font-weight:600}
  .tablewrap{overflow-x:auto}

  /* ---------- panneau agent ---------- */
  .tabs{display:flex;gap:2px;padding:6px;background:var(--surface-3);border-radius:9px;margin:12px 16px 0}
  .tabs button{flex:1;padding:6px 8px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .panel-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
  .card h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
  .notion{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .notion:last-child{border-bottom:none}
  .notion b{display:block;font-family:var(--serif);font-size:14px}
  .notion span{color:var(--ink-2)}
  .lacune{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lacune:last-child{border-bottom:none}
  .lacune .dot{width:6px;height:6px;border-radius:50%;background:var(--alert);flex:none;margin-top:6px}

  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.6;max-width:100%}
  .msg.me{background:var(--encre-soft);color:var(--ink);align-self:flex-end;border-bottom-right-radius:3px}
  .msg.ia{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
  .composer{display:flex;gap:8px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
  .composer textarea{flex:1;max-height:140px;min-height:38px}

  /* ---------- modale ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,22,20,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
  .modal.wide{max-width:900px}
  .modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h2{font-family:var(--serif);font-size:19px;font-weight:600;flex:1}
  .modal-body{padding:18px 20px;overflow-y:auto;flex:1}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--on-encre)}

  .drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:26px 20px;text-align:center;background:var(--surface-2);transition:border-color .15s,background .15s}
  .drop.hot{border-color:var(--encre);background:var(--encre-soft)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .thumb{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-3)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(16,22,20,.75);color:#fff;font-size:11px;line-height:18px;text-align:center}
  .thumb .doc-ic{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--mono);font-size:10px;color:var(--ink-2);padding:4px;text-align:center;word-break:break-all}

  .result{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .result-head{display:flex;gap:10px;align-items:center;padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .result-head input{flex:1;background:transparent;border:none;font-family:var(--serif);font-size:15.5px;font-weight:600;padding:2px 0}
  .result-head input:focus{outline:none;border-bottom:1px solid var(--encre)}
  .result-body{padding:13px}

  .empty{padding:56px 24px;text-align:center;color:var(--ink-3);max-width:420px;margin:0 auto}
  .empty h3{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin-bottom:8px}
  .thinking{display:inline-flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12.5px}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--encre);animation:pulse 1.1s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;box-shadow:var(--shadow)}
  .note{font-size:12px;color:var(--ink-3);line-height:1.5}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hide{display:none !important}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

  /* ---------- responsive ---------- */
  .mobile-only{display:none}
  @media (max-width:1180px){
    .app{grid-template-columns:236px minmax(0,1fr)}
    .panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:40;box-shadow:-14px 0 40px -20px rgba(0,0,0,.5);transform:translateX(101%);transition:transform .2s}
    .panel.show{transform:none}
  }
  @media (max-width:820px){
    .app{grid-template-columns:minmax(0,1fr)}
    .rail{position:fixed;top:0;left:0;bottom:0;width:min(300px,88vw);z-index:41;box-shadow:14px 0 40px -20px rgba(0,0,0,.5);transform:translateX(-101%);transition:transform .2s}
    .rail.show{transform:none}
    .mobile-only{display:inline-flex}
    .work-head,.toolbar,.chapters{padding-left:16px;padding-right:16px}
  }
</style>

<div class="app">
  <!-- ============ COLONNE 1 : MATIÈRES ============ -->
  <aside class="col rail" id="rail">
    <div class="colhead">
      <div class="wordmark" style="flex:1">Cahier<small>Global BBA · 1<sup>re</sup> année</small></div>
      <button class="btn ghost sm mobile-only" id="closeRail" aria-label="Fermer">✕</button>
    </div>
    <div class="colbody">
      <div class="mat-list" id="matList"></div>
    </div>
    <div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px">
      <button class="btn sm" id="addMat" style="flex:1">+ Matière</button>
      <button class="btn sm ghost" id="openSettings" title="Réglages" aria-label="Réglages">⚙</button>
    </div>
  </aside>

  <!-- ============ COLONNE 2 : CLASSEUR ============ -->
  <main class="col work">
    <div class="work-head">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn ghost sm mobile-only" id="openRail" aria-label="Matières">☰</button>
        <div style="flex:1;min-width:0">
          <div class="eyebrow" id="workEyebrow">Classeur</div>
          <h1 class="work-title" id="workTitle">—</h1>
        </div>
        <button class="btn sm" id="openPanel" style="display:none">Agent IA</button>
        <button class="btn sm" id="headSettings" title="Réglages" aria-label="Réglages">⚙</button>
      </div>
      <div class="stats" id="workStats"></div>
    </div>
    <div class="toolbar">
      <button class="btn pri" id="btnWrite">✎ Écrire un cours</button>
      <button class="btn" id="btnImport">⇪ Importer / coller un cours</button>
      <button class="btn" id="btnChapter">+ Chapitre</button>
      <div class="grow"></div>
      <input class="field" id="search" placeholder="Rechercher dans tous les cours…" style="max-width:260px" aria-label="Rechercher">
    </div>
    <div class="colbody" id="workBody"></div>
  </main>

  <!-- ============ COLONNE 3 : AGENT ============ -->
  <aside class="col panel" id="panel">
    <div class="colhead">
      <div style="flex:1">
        <div class="eyebrow">Aide de connaissance</div>
        <div style="font-family:var(--serif);font-size:15px;font-weight:600" id="panelSubject">Aucun chapitre ouvert</div>
      </div>
      <button class="btn ghost sm" id="closePanel" aria-label="Fermer le panneau">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="analyse">Analyse</button>
      <button role="tab" aria-selected="false" data-tab="chat">Questions</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="composer hide" id="composer">
      <textarea class="field" id="chatInput" rows="1" placeholder="Pose ta question sur ce chapitre…"></textarea>
      <button class="btn pri" id="chatSend">Envoyer</button>
    </div>
  </aside>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* =========================================================
   1. ÉTAT & PERSISTANCE
   ========================================================= */
const LS_KEY = "cahier-bba-v1";
let db = null, sample = null, imgLim = null, imgLimErr = null, aiOn = false;
let imagesKO = false;       // passe à true dès que la plateforme a refusé les images une fois
const MAX_IMG_DEFAUT = 6;   // borne prudente quand la vue ne communique pas sa limite

const state = {
  matieres: [], chapitres: [], items: [],

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $  = s => document.querySelector(s);

function toast(msg, ms){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("#toastHost").appendChild(t);
  setTimeout(()=>t.remove(), ms || 2600);
}

/* ---------- lecture / écriture ---------- */
function localSave(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      matieres: state.matieres, chapitres: state.chapitres, items: state.items
    }));
  }catch(e){ /* quota : le db reste la source de vérité */ }
}

async function saveStructure(){
  localSave();
  if(!db) return;
  try{
    await db.doc("espace/structure").set({ matieres: state.matieres, chapitres: state.chapitres });
  }catch(e){ toast("Sauvegarde en ligne indisponible — gardé sur cet appareil."); }
}

async function saveItem(it){
  localSave();
  if(!db) return;
  try{
    const {id, ...body} = it;
    await db.doc("items/" + id).set(body);
  }catch(e){ toast("Sauvegarde en ligne indisponible — gardé sur cet appareil."); }
}

async function deleteItem(id){
  state.items = state.items.filter(x=>x.id!==id);
  localSave();
  if(db){ try{ await db.doc("items/"+id).delete(); }catch(e){} }
}

async function loadAll(){
  let loadedRemote = false;
  if(db){
    try{
      const snap = await db.doc("espace/structure").get();
      if(snap.exists){
        const d = snap.data() || {};
        state.matieres = Array.isArray(d.matieres) ? d.matieres.map(o=>({...o})) : [];
        state.chapitres = Array.isArray(d.chapitres) ? d.chapitres.map(o=>({...o})) : [];
        loadedRemote = true;
      }
      const q = await db.collection("items").limit(1000).get();
      state.items = q.docs.map(d=>({ id:d.id, ...d.data() }));
      if(q.size) loadedRemote = true;
    }catch(e){ loadedRemote = false; }
  }
  if(!loadedRemote){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        const d = JSON.parse(raw);
        state.matieres = d.matieres || []; state.chapitres = d.chapitres || []; state.items = d.items || [];
      }
    }catch(e){}
  }
  state.loaded = true;
}

/* ---------- sélecteurs ---------- */
const matById  = id => state.matieres.find(m=>m.id===id);
const chapById = id => state.chapitres.find(c=>c.id===id);
const chapsOf  = mid => state.chapitres.filter(c=>c.matiereId===mid)
                        .sort((a,b)=>(a.numero||0)-(b.numero||0) || String(a.titre).localeCompare(String(b.titre)));
const itemsOf  = cid => state.items.filter(i=>i.chapitreId===cid)
                        .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
const itemsOfMat = mid => state.items.filter(i=>i.matiereId===mid);

/* =========================================================
   2. MARKDOWN (rendu minimal, sûr)
   ========================================================= */
function md(src){
  if(!src) return "";
  const lines = String(src).replace(/\r/g,"").split("\n");
  let out = [], i = 0, listType = null;

  const inline = t => esc(t)
    .replace(/\$\$([^$]+)\$\$/g, (m,x)=>"<code>"+x.trim()+"</code>")
    .replace(/\$([^$\n]+)\$/g, (m,x)=>"<code>"+x.trim()+"</code>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/==([^=]+)==/g, "<mark>$1</mark>");

  const closeList = ()=>{ if(listType){ out.push("</"+listType+">"); listType=null; } };

  while(i < lines.length){
    const l = lines[i];

    if(/^```/.test(l)){
      closeList(); const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(l); i += 2;
      let html = '<div class="tablewrap"><table><thead><tr>'+head.map(h=>"<th>"+inline(h)+"</th>").join("")+"</tr></thead><tbody>";
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        html += "<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++;
      }
      out.push(html+"</tbody></table></div>"); continue;
    }
    let m;
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); const n = Math.min(m[1].length+1, 4);
      out.push("<h"+n+">"+inline(m[2])+"</h"+n+">"); i++; continue;
    }
    if(/^\s*([-*_])\s*\1\s*\1[\s-*_]*$/.test(l)){ closeList(); out.push("<hr>"); i++; continue; }
    if((m = l.match(/^\s*>\s?(.*)$/))){ closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); i++; continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)$/))){
      if(listType!=="ul"){ closeList(); out.push("<ul>"); listType="ul"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(listType!=="ol"){ closeList(); out.push("<ol>"); listType="ol"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if(!l.trim()){ closeList(); i++; continue; }
    closeList();
    const buf=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(\s*[-*•\d>#`]|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>"+inline(buf.join(" "))+"</p>");
  }
  closeList();
  return out.join("\n");
}

/* =========================================================
   3. RENDU
   ========================================================= */
const PREF_KEY = LS_KEY + "-pref";
function savePref(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({ mat:state.selMat, chap:state.selChap, open:[...state.openChaps] })); }catch(e){}
}
function loadPref(){
  try{
    const p = JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
    if(p.mat && matById(p.mat)) state.selMat = p.mat;
    if(p.chap && chapById(p.chap)) state.selChap = p.chap;
    (p.open||[]).forEach(id=>{ if(chapById(id)) state.openChaps.add(id); });
  }catch(e){}
  if(!state.selMat && state.matieres.length) state.selMat = state.matieres[0].id;
}

function render(){ savePref(); renderRail(); renderWork(); renderPanel(); }

function renderRail(){
  const host = $("#matList");
  if(!state.matieres.length){
    host.innerHTML = '<p class="note" style="padding:14px">Aucune matière. Commence par en ajouter — une ligne par matière.</p>';
    return;
  }
  host.innerHTML = state.matieres.map(m=>{
    const cs = chapsOf(m.id);
    const done = cs.filter(c=>c.statut==="maitrise").length;
    const pct = cs.length ? Math.round(done/cs.length*100) : 0;
    const encours = cs.find(c=>c.statut==="encours");
    const sub = encours ? "Ch. "+(encours.numero||"?")+" · "+encours.titre
              : (cs.length ? cs.length+" chapitre"+(cs.length>1?"s":"") : "vide");
    return '<button class="mat" data-mat="'+m.id+'" aria-current="'+(state.selMat===m.id)+'" title="'+esc(m.nom+(m.prof?" · "+m.prof:""))+'">'
      + '<span class="tab" style="background:'+esc(m.couleur||"#1E4B87")+'"></span>'
      + '<span class="body">'
      +   '<span class="nom">'+esc(m.nom)+'</span>'
      +   '<span class="sub">'+esc(sub)+'</span>'
      +   (cs.length ? '<span class="meter"><i style="width:'+pct+'%"></i></span>' : "")
      + '</span>'
      + '<span class="cnt">'+itemsOfMat(m.id).length+'</span></button>';
  }).join("");
  host.querySelectorAll(".mat").forEach(b=>b.onclick=()=>{
    state.selMat = b.dataset.mat; state.selChap = null; state.query = ""; $("#search").value = "";
    $("#rail").classList.remove("show"); render();
  });
}

function renderWork(){
  const host = $("#workBody"), m = matById(state.selMat);

  if(!state.matieres.length){
    $("#workEyebrow").textContent = "Bienvenue";
    $("#workTitle").textContent = "Ton classeur est vide";
    $("#workStats").innerHTML = "";
    host.innerHTML = '<div class="empty"><h3>Commence par tes matières</h3>'
      + '<p>Ajoute la liste de tes matières de 1<sup>re</sup> année, puis remplis chaque matière chapitre par chapitre — en tapant tes cours ou en photographiant tes notes.</p>'
      + '<p style="margin-top:16px"><button class="btn pri" id="emptyAdd">Ajouter mes matières</button></p></div>';
    $("#emptyAdd").onclick = openMatieresModal;
    return;
  }

  if(state.query.trim()){ renderSearch(host); return; }

  if(!m){
    $("#workEyebrow").textContent = "Classeur";
    $("#workTitle").textContent = "Choisis une matière";
    $("#workStats").innerHTML = "";
    host.innerHTML = '<div class="empty"><h3>Rien d\'ouvert</h3><p>Sélectionne une matière à gauche.</p></div>';
    return;
  }

  const cs = chapsOf(m.id), its = itemsOfMat(m.id);
  const enCours = cs.find(c=>c.statut==="encours");
  const lacunes = cs.reduce((n,c)=>n+((c.analyse&&c.analyse.lacunes)?c.analyse.lacunes.length:0),0);

  $("#workEyebrow").textContent = m.code ? m.code + (m.prof ? " · "+m.prof : "") : (m.prof || "Matière");
  $("#workTitle").textContent = m.nom;
  $("#workStats").innerHTML =
      stat(cs.length, "chapitre")
    + stat(its.length, "document")
    + stat(cs.filter(c=>c.statut==="maitrise").length, "maîtrisé")
    + (enCours ? '<span class="stat">En cours : <b>Ch. '+esc(enCours.numero||"?")+"</b> "+esc(enCours.titre)+"</span>" : "")
    + (lacunes ? '<span class="stat" style="border-color:var(--alert);color:var(--alert)"><b>'+lacunes+"</b> points à compléter</span>" : "");

  if(!cs.length){
    host.innerHTML = '<div class="empty"><h3>'+esc(m.nom)+' n\'a pas encore de chapitre</h3>'
      + '<p>Écris un cours ou importe une photo : le chapitre sera créé automatiquement à partir de ce que contient le document.</p></div>';
    return;
  }

  host.innerHTML = '<div class="chapters">' + cs.map(c=>chapHTML(c)).join("") + "</div>";
  wireChapters(host);
}

const stat = (n,l) => '<span class="stat"><b>'+n+"</b> "+l+(n>1?"s":"")+"</span>";

function chapHTML(c){
  const its = itemsOf(c.id), open = state.openChaps.has(c.id);
  const lac = (c.analyse && c.analyse.lacunes) ? c.analyse.lacunes.length : 0;
  const byType = {};
  its.forEach(i=>{ byType[i.type] = (byType[i.type]||0)+1; });

  return '<article class="chap'+(open?" open":"")+'" data-chap="'+c.id+'">'
    + '<button class="chap-head" data-toggle="'+c.id+'" aria-expanded="'+open+'">'
    +   '<span class="chap-num">'+esc(c.numero!=null&&c.numero!==""?String(c.numero).padStart(2,"0"):"··")+'</span>'
    +   '<span class="chap-t"><h3>'+esc(c.titre)+"</h3>"
    +     '<span class="chap-meta">'
    +       '<span class="pill st-'+esc(c.statut||"nouveau")+'">'+esc(STATUTS[c.statut]||STATUTS.nouveau)+"</span>"
    +       Object.keys(byType).map(t=>'<span class="pill type">'+byType[t]+" "+esc(TYPES[t]||t)+"</span>").join("")
    +       (its.length ? "" : '<span class="pill type">vide</span>')
    +       (c.analyse ? '<span class="pill ia">Analysé</span>' : "")
    +       (lac ? '<span class="pill gap">'+lac+" à compléter</span>" : "")
    +     "</span></span>"
    +   '<span class="chevron">›</span>'
    + "</button>"
    + (open ? '<div class="chap-body">'
        + (its.length ? its.map(i=>docHTML(i)).join("")
                      : '<p class="note" style="padding:12px 0">Aucun document. Écris le cours ou importe une photo.</p>')
        + '<div class="doc-actions" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'
        +   '<button class="btn sm pri" data-ia="'+c.id+'">'+(c.analyse?"Relancer l\'analyse":"Analyser ce chapitre")+"</button>"
        +   '<button class="btn sm" data-ask="'+c.id+'">Poser une question</button>'
        +   '<button class="btn sm" data-write="'+c.id+'">+ Document</button>'
        +   '<button class="btn sm" data-editchap="'+c.id+'">Modifier</button>'
        +   '<button class="btn sm ghost danger" data-delchap="'+c.id+'">Supprimer</button>'
        + "</div></div>" : "")
    + "</article>";
}

function docHTML(i){
  const open = state.openDocs.has(i.id);
  const d = i.date ? new Date(i.date) : null;
  const dd = d && !isNaN(d) ? d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
  return '<div class="doc">'
    + '<button class="doc-head" data-doc="'+i.id+'" aria-expanded="'+open+'">'
    +   '<span class="pill type">'+esc(TYPES[i.type]||i.type||"doc")+"</span>"
    +   "<h4>"+esc(i.titre||"Sans titre")+"</h4>"
    +   (i.source==="photo" ? '<span class="pill type" title="Retranscrit depuis une photo">photo</span>' : "")
    +   '<span class="doc-date">'+dd+"</span>"
    +   '<span class="chevron" style="transform:rotate('+(open?90:0)+'deg)">›</span>'
    + "</button>"
    + (open ? '<div class="doc-body"><div class="prose">'+md(i.contenu)+"</div>"
        + '<div class="doc-actions">'
        +   '<button class="btn sm" data-edit="'+i.id+'">Modifier</button>'
        +   '<button class="btn sm" data-explain="'+i.id+'">Expliquer à mon niveau</button>'
        +   '<button class="btn sm" data-fiche="'+i.id+'">Fiche de révision</button>'
        +   '<button class="btn sm ghost danger" data-del="'+i.id+'">Supprimer</button>'
        + "</div></div>" : "")
    + "</div>";
}

function wireChapters(host){
  host.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.toggle;
    if(state.openChaps.has(id)) state.openChaps.delete(id);
    else { state.openChaps.add(id); state.selChap = id; }
    render();
  });
  host.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.doc;
    state.openDocs.has(id) ? state.openDocs.delete(id) : state.openDocs.add(id);
    render();
  });
  host.querySelectorAll("[data-ia]").forEach(b=>b.onclick=()=>{ state.selChap=b.dataset.ia; state.tab="analyse"; showPanel(); analyseChapitre(b.dataset.ia); });
  host.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{ state.selChap=b.dataset.ask; state.tab="chat"; showPanel(); renderPanel(); $("#chatInput").focus(); });
  host.querySelectorAll("[data-write]").forEach(b=>b.onclick=()=>openEditor({chapitreId:b.dataset.write}));
  host.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor({itemId:b.dataset.edit}));
  host.querySelectorAll("[data-editchap]").forEach(b=>b.onclick=()=>openChapModal(b.dataset.editchap));
  host.querySelectorAll("[data-delchap]").forEach(b=>b.onclick=()=>delChapitre(b.dataset.delchap));
  host.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const it = state.items.find(x=>x.id===b.dataset.del);
    if(!it || !confirm("Supprimer « "+(it.titre||"ce document")+" » ?")) return;
    await deleteItem(b.dataset.del); render(); toast("Document supprimé");
  });
  host.querySelectorAll("[data-explain]").forEach(b=>b.onclick=()=>expliquer(b.dataset.explain));
  host.querySelectorAll("[data-fiche]").forEach(b=>b.onclick=()=>genererFiche(b.dataset.fiche));
}

function renderSearch(host){
  const q = state.query.trim().toLowerCase();
  const hits = state.items.filter(i =>
    String(i.titre||"").toLowerCase().includes(q) || String(i.contenu||"").toLowerCase().includes(q)
  ).slice(0,60);
  $("#workEyebrow").textContent = "Recherche";
  $("#workTitle").textContent = '"'+state.query.trim()+'"';
  $("#workStats").innerHTML = '<span class="stat"><b>'+hits.length+"</b> document"+(hits.length>1?"s":"")+" trouvé"+(hits.length>1?"s":"")+"</span>";
  if(!hits.length){ host.innerHTML = '<div class="empty"><h3>Rien trouvé</h3><p>Essaie un autre mot-clé.</p></div>'; return; }
  host.innerHTML = '<div class="chapters">' + hits.map(i=>{
    const c = chapById(i.chapitreId), m = matById(i.matiereId);
    const idx = String(i.contenu||"").toLowerCase().indexOf(q);
    const extrait = idx>=0 ? String(i.contenu).slice(Math.max(0,idx-70), idx+150) : String(i.contenu||"").slice(0,180);
    return '<article class="chap"><div style="padding:13px 14px">'
      + '<div class="chap-meta" style="margin:0 0 6px">'
      +   '<span class="pill type">'+esc(m?m.nom:"?")+"</span>"
      +   '<span class="pill type">'+esc(c?("Ch. "+(c.numero||"?")+" "+c.titre):"—")+"</span>"
      +   '<span class="pill type">'+esc(TYPES[i.type]||i.type)+"</span></div>"
      + '<h3 style="font-family:var(--serif);font-size:16px">'+esc(i.titre)+"</h3>"
      + '<p class="note" style="margin-top:6px">…'+esc(extrait)+"…</p>"
      + '<div class="doc-actions"><button class="btn sm" data-goto="'+i.id+'">Ouvrir</button></div>'
      + "</div></article>";
  }).join("") + "</div>";
  host.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    const it = state.items.find(x=>x.id===b.dataset.goto);
    state.query=""; $("#search").value="";
    state.selMat = it.matiereId; state.selChap = it.chapitreId;
    state.openChaps.add(it.chapitreId); state.openDocs.add(it.id);
    render();
    setTimeout(()=>{ const el = document.querySelector('[data-chap="'+it.chapitreId+'"]'); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); }, 40);
  });
}

/* =========================================================
   4. PANNEAU AGENT
   ========================================================= */
function showPanel(){ $("#panel").classList.add("show"); }
function hidePanel(){ $("#panel").classList.remove("show"); }

function renderPanel(){
  const c = chapById(state.selChap), body = $("#panelBody");
  const m = c ? matById(c.matiereId) : null;
  $("#panelSubject").textContent = c ? ("Ch. "+(c.numero||"?")+" · "+c.titre) : "Aucun chapitre ouvert";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  $("#composer").classList.toggle("hide", state.tab!=="chat" || !c);

  if(IA.mode === "off"){
    body.innerHTML = '<div class="card"><h4>Agent éteint</h4><p class="note">'+esc(IA.detail)+'</p>'
      + '<div class="doc-actions"><button class="btn sm" id="pCfg">Ouvrir les réglages</button></div></div>';
    const b = $("#pCfg"); if(b) b.onclick = openSettings;
    return;
  }
  if(!c){
    body.innerHTML = '<div class="card"><h4>Aide de connaissance</h4><p class="note">Ouvre un chapitre, puis lance une analyse. L\'agent reste silencieux tant que tu ne l\'appelles pas : il ne commente rien tout seul.</p></div>';
    return;
  }

  if(state.tab==="analyse"){
    const a = c.analyse;
    if(!a){
      body.innerHTML = '<div class="card"><h4>Pas encore analysé</h4>'
        + '<p class="note">L\'agent lit tous les documents du chapitre, en fait une synthèse au niveau 1<sup>re</sup> année Global BBA, et te signale ce qui manque par rapport à un chapitre complet.</p>'
        + '<p style="margin-top:12px"><button class="btn pri sm" id="pAnalyse">Analyser le chapitre</button></p></div>';
      $("#pAnalyse").onclick = ()=>analyseChapitre(c.id);
      return;
    }
    body.innerHTML =
        (a.resume ? '<div class="card"><h4>Ce que dit ce chapitre</h4><div class="prose">'+md(a.resume)+"</div></div>" : "")
      + (a.plan && a.plan.length ? '<div class="card"><h4>Structure</h4><ol style="margin:0;padding-left:18px;font-size:13px">'+a.plan.map(p=>"<li>"+esc(p)+"</li>").join("")+"</ol></div>" : "")
      + (a.notions && a.notions.length ? '<div class="card"><h4>Notions clés</h4>'+a.notions.map(n=>'<div class="notion"><b>'+esc(n.terme)+"</b><span>"+esc(n.definition)+"</span></div>").join("")+"</div>" : "")
      + (a.lacunes && a.lacunes.length ? '<div class="card" style="border-color:var(--alert)"><h4 style="color:var(--alert)">Ce qui manque</h4>'
          + a.lacunes.map(l=>'<div class="lacune"><span class="dot"></span><span><b>'+esc(l.quoi)+"</b><br><span class=\"note\">"+esc(l.pourquoi||"")+"</span></span></div>").join("")

      : '<div class="card"><h4>Aide de connaissance</h4><p class="note">Pose une question sur ce chapitre. L\'agent répond à partir de <b>tes</b> documents, au niveau 1<sup>re</sup> année, et te dit franchement quand la réponse n\'est pas dans tes notes.</p></div>')
    + "</div>";

/* ---------- préparation des images : redimensionnement avant envoi ---------- */
const MAX_COTE = 2000;   // borne haute de la vision Claude, sans gaspiller d'octets

function imageEnBase64(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const ratio = Math.min(1, MAX_COTE / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL("image/jpeg", 0.9);
      resolve({ media: "image/jpeg", b64: data.slice(data.indexOf(",")+1) });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("image illisible")); };
    img.src = url;
  });
}

/* ---------- découverte des modèles : ne jamais dépendre d'un nom figé ---------- */
async function listerModeles(cle){
  cle = cle || cleActive();
  if(IA.fournisseur === "gemini"){
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models", { headers:{ "x-goog-api-key": cle } });
    if(!r.ok){
      let msg = ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
      throw Object.assign(new Error(msg || ("HTTP "+r.status)),
        { code: (r.status===403||r.status===400) ? "cle_invalide" : "api_error" });
    }
    const j = await r.json();
    return (j.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).indexOf("generateContent") >= 0)
      .map(m=>String(m.name).replace(/^models\//,""));
  }
  const r = await fetch("https://api.anthropic.com/v1/models?limit=100", {
    headers:{ "x-api-key": cle, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" } });
  if(!r.ok) throw Object.assign(new Error("HTTP "+r.status), { code: r.status===401?"cle_invalide":"api_error" });
  const j = await r.json();
  return (j.data||[]).map(m=>m.id);
}

/* Choisit le meilleur modèle disponible : rapide, multimodal, récent. */
function choisirModele(noms){
  const utiles = (noms||[]).filter(n=>!/embed|aqa|imagen|veo|tts|audio|live|-image|gemma/i.test(n));
  if(!utiles.length) return "";
  const version = n=>{ const m = n.match(/(\d+)[.\-](\d+)/); return m ? parseFloat(m[1]+"."+m[2]) : 0; };
  const score = n=>{
    let s = version(n) * 10;
    if(/flash/i.test(n)) s += 30;          // rapide et économique : idéal pour l'OCR au quotidien
    else if(/sonnet|pro/i.test(n)) s += 20;
    if(/opus/i.test(n)) s += 25;
    if(/lite/i.test(n)) s -= 15;
    if(/preview|exp|latest/i.test(n)) s -= 5;   // on préfère les versions stables
    return s;
  };
  return utiles.slice().sort((a,b)=>score(b)-score(a))[0];
}

/* Réparation silencieuse quand le modèle enregistré n'existe pas (ou plus). */
async function reparerModele(){
  try{
    const choix = choisirModele(await listerModeles());
    if(!choix || choix === IA.modele) return false;
    enregistrerConfig({ modele: choix });
    return true;
  }catch(e){ return false; }
}

/* ---------- Gemini : conversion du schéma JSON vers le format Google ---------- */
function versSchemaGemini(s){
  if(!s || typeof s !== "object") return s;
  const g = {};
  if(s.type) g.type = String(s.type).toUpperCase();
  if(s.description) g.description = s.description;
  if(s.enum) g.enum = s.enum;
  if(s.items) g.items = versSchemaGemini(s.items);
  if(s.properties){
    g.properties = {};
    for(const k of Object.keys(s.properties)) g.properties[k] = versSchemaGemini(s.properties[k]);
    g.propertyOrdering = Object.keys(s.properties);
  }
  if(s.required) g.required = s.required;
  return g;   // `additionalProperties` n'existe pas côté Gemini : volontairement omis
}

/* ---------- appel Gemini, en flux ---------- */
async function appelGemini(o, dejaRepare){
  try{
    return await appelGeminiBrut(o);
  }catch(e){
    if(e && e.code === "modele_inconnu" && !dejaRepare && await reparerModele()){
      return appelGemini(o, true);
    }
    throw e;
  }
}

async function appelGeminiBrut({ system, messages, images, maxTokens, schema, onText, signal }){
  const parts = [];
  for(const im of (images||[])) parts.push({ inline_data:{ mime_type: im.media, data: im.b64 } });

  const contents = messages.map((m, i)=>{
    const p = [{ text: m.content }];
    // les images accompagnent le dernier tour utilisateur
    if(i === messages.length - 1 && parts.length) return { role:"user", parts: parts.concat(p) };
    return { role: m.role === "assistant" ? "model" : "user", parts: p };
  });

  const body = {
    contents,
    generationConfig: { maxOutputTokens: maxTokens || 8192 }
  };
  if(system) body.systemInstruction = { parts:[{ text: system }] };
  if(schema){
    body.generationConfig.responseMimeType = "application/json";
    body.generationConfig.responseSchema = versSchemaGemini(schema);
  }

  const url = "https://generativelanguage.googleapis.com/v1beta/models/"
            + encodeURIComponent(IA.modele) + ":streamGenerateContent?alt=sse";

  const res = await fetch(url, {
    method:"POST", signal,
    headers:{ "content-type":"application/json", "x-goog-api-key": cleActive() },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    if(/denied access|CONSUMER_INVALID|PERMISSION_DENIED/i.test(msg))
      msg += " — le compte Google lui-même est bloqué, pas la clé. Causes habituelles : compte scolaire ou professionnel dont l'administrateur interdit AI Studio, "
           + "ou compte personnel sans date de naissance renseignée / déclaré mineur. Réessaie avec un compte Gmail personnel majeur, "
           + "ou bascule sur Claude ci-dessus.";
    else if(/API key not valid|API_KEY_INVALID/i.test(msg)) msg += " — clé mal copiée, ou copiée en partie.";
    else if(/has not been used|is disabled|SERVICE_DISABLED/i.test(msg)) msg += " — l'API Generative Language n'est pas activée sur ce projet Google.";
    else if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(msg)) msg += " — la clé est restreinte à certains sites ; retire la restriction, ou autorise wyngo-create.github.io.";
    const err = new Error(msg || ("HTTP "+res.status));
    err.code = res.status === 400 && /API key/i.test(msg) ? "cle_invalide"
             : res.status === 403 ? "cle_invalide"
             : res.status === 404 ? "modele_inconnu"
             : res.status === 429 ? "rate_limited"
             : res.status >= 500 ? "upstream_error" : "api_error";
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", fin = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut) continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      const cand = ev.candidates && ev.candidates[0];
      if(!cand) continue;
      if(cand.finishReason) fin = cand.finishReason;
      const ps = (cand.content && cand.content.parts) || [];
      for(const p of ps) if(typeof p.text === "string"){ texte += p.text; if(onText) onText(texte); }
    }
  }

  if(fin === "SAFETY" || fin === "PROHIBITED_CONTENT"){ const e=new Error("refus"); e.code="refused"; throw e; }
  if(!texte.trim()){ const e=new Error("réponse vide"); e.code="empty_completion"; throw e; }
  if(fin === "MAX_TOKENS") texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]";
  return texte;
}

/* ---------- appel Anthropic, en flux ---------- */
async function appelAPI(o, dejaRepare){
  if(IA.fournisseur === "gemini") return appelGemini(o);
  try{
    return await appelAnthropic(o);
  }catch(e){
    if(e && e.code === "modele_inconnu" && !dejaRepare && await reparerModele()){
      return appelAPI(o, true);
    }
    throw e;
  }
}

async function appelAnthropic({ system, messages, images, effort, maxTokens, schema, onText, signal }){
  const contenu = [];
  for(const im of (images||[])) contenu.push({ type:"image", source:{ type:"base64", media_type: im.media, data: im.b64 } });

  const msgs = messages.map(m=>({ role:m.role, content:m.content }));
  if(contenu.length){
    const dernier = msgs[msgs.length-1];
    dernier.content = contenu.concat([{ type:"text", text: dernier.content }]);
  }

  const body = {
    model: IA.modele,
    max_tokens: maxTokens || 16000,
    stream: true,
    messages: msgs,
    output_config: { effort: effort || "medium" }
  };
  if(system) body.system = system;
  if(schema) body.output_config.format = { type:"json_schema", schema };

  const res = await fetch(API_URL, {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cleActive(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    const err = new Error(detail || ("HTTP " + res.status));
    err.code = res.status === 401 ? "cle_invalide"
             : res.status === 404 ? "modele_inconnu"
             : res.status === 429 ? "rate_limited"
             : res.status === 400 && /model/i.test(detail) ? "modele_inconnu"
             : res.status === 400 ? "invalid_request"
             : res.status >= 500 ? "upstream_error" : "api_error";
    throw err;
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", texte = "", stop = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lignes = buf.split("\n");
    buf = lignes.pop();
    for(const l of lignes){
      if(!l.startsWith("data:")) continue;
      const brut = l.slice(5).trim();
      if(!brut || brut === "[DONE]") continue;
      let ev; try{ ev = JSON.parse(brut); }catch(e){ continue; }
      if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
        texte += ev.delta.text;
        if(onText) onText(texte);
      }else if(ev.type === "message_delta" && ev.delta && ev.delta.stop_reason){
        stop = ev.delta.stop_reason;
      }else if(ev.type === "error"){
        const err = new Error((ev.error && ev.error.message) || "erreur de flux");
        err.code = "upstream_error"; throw err;
      }
    }
  }

  if(stop === "refusal"){ const e = new Error("refus"); e.code = "refused"; throw e; }
  if(!texte.trim()){ const e = new Error("réponse vide"); e.code = "empty_completion"; throw e; }
  if(stop === "max_tokens"){ texte += "\n\n[…réponse coupée : document trop long, découpe-le en deux imports…]"; }
  return texte;
}

/* ---------- interface unique utilisée par tout le reste de l'app ---------- */
/* Les deux moteurs exigent que l'échange commence par un tour "user". */
function normaliser(messages){
  const m = (messages||[]).slice();
  while(m.length && m[0].role !== "user") m.shift();
  return m.length ? m : [{ role:"user", content:"(pas de message)" }];
}

async function iaTexte(opts){
  const { system, images, effort, maxTokens, onText } = opts;
  const messages = normaliser(opts.messages);
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (images||[])) imgs.push(await imageEnBase64(f));
    return appelAPI({ system, messages, images:imgs, effort, maxTokens, onText });
  }
  if(IA.mode === "artifact"){
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : (effort === "high" ? "complex" : "default"), cache:false };
    if(images && images.length) o.images = images;
    if(onText) o.onText = ({text})=>onText(text);
    const r = await sample(entree, o);
    return r.text;
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

async function iaJson(opts){
  opts = { ...opts, messages: normaliser(opts.messages) };
  if(IA.mode === "api"){
    const imgs = [];
    for(const f of (opts.images||[])) imgs.push(await imageEnBase64(f));
    const t = await appelAPI({ ...opts, images:imgs });
    try{ return JSON.parse(t); }
    catch(e){
      const m = t.match(/[\{\[][\s\S]*[\}\]]/);
      if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
      const err = new Error("JSON illisible"); err.code = "invalid_json"; err.text = t; throw err;
    }
  }
  if(IA.mode === "artifact"){
    const { system, messages, images, effort } = opts;
    const turns = system ? [{ role:"user", content:system }].concat(messages) : messages.slice();
    const entree = turns.length === 1 ? turns[0].content : turns;
    const o = { modelTier: effort === "low" ? "quick" : "complex", cache:false };
    if(images && images.length) o.images = images;
    return sample.json(entree, o);
  }
  const e = new Error("IA indisponible"); e.code = "not_granted"; throw e;
}

function ctxChapitre(c, maxChars){
  const its = itemsOf(c.id), m = matById(c.matiereId);
  let txt = "MATIÈRE : " + (m?m.nom:"?") + "\nCHAPITRE " + (c.numero||"?") + " : " + c.titre + "\n\n";
  const budget = maxChars || 26000, per = Math.max(1200, Math.floor(budget / Math.max(1,its.length)));
  its.forEach(i=>{
    const body = String(i.contenu||"");
    txt += "--- " + (TYPES[i.type]||i.type) + " : " + (i.titre||"") + " ---\n"
        + (body.length>per ? body.slice(0,per)+"\n[…document tronqué…]" : body) + "\n\n";
  });
  return txt.slice(0, budget + 500);
}

async function creerDocIA(prompt, mid, cid, type, titre, msg){
  if(IA.mode === "off"){ toast("Agent indisponible — voir ⚙ Réglages."); return; }
  showPanel(); state.tab="analyse";
  $("#panelBody").innerHTML = '<div class="card"><span class="thinking"><i></i>'+esc(msg)+'</span><div class="prose" id="liveOut" style="margin-top:10px"></div></div>';
  try{
    const texte = await iaTexte({
      system: NIVEAU,
      messages: [{ role:"user", content: prompt }],
      effort: "medium", maxTokens: 16000,
      onText: t=>{ const el=$("#liveOut"); if(el) el.textContent = t; }
    });
    const it = { id:uid(), matiereId:mid, chapitreId:cid, type, titre, contenu:texte, source:"ia", date:new Date().toISOString() };
    state.items.push(it); await saveItem(it);
    state.openChaps.add(cid); state.openDocs.add(it.id);
    render(); renderPanel(); toast("Fiche ajoutée au chapitre");
  }catch(e){ iaError(e); renderPanel(); }
}

async function expliquer(itemId){
  const it = state.items.find(x=>x.id===itemId); if(!it) return;
  if(IA.mode === "off"){ toast("Agent indisponible — voir ⚙ Réglages."); return; }
  state.selChap = it.chapitreId; state.tab = "chat"; showPanel();
  const log = state.chats[it.chapitreId] = state.chats[it.chapitreId] || [];
  log.push({ role:"user", content:"Explique-moi « "+(it.titre||"ce document")+" » à mon niveau, étape par étape." });
  renderPanel(); await envoyerChat(true);
}

async function envoyerChat(skipInput){
  const c = chapById(state.selChap); if(!c || IA.mode === "off") return;
  const input = $("#chatInput");
  const log = state.chats[c.id] = state.chats[c.id] || [];

  if(!skipInput){
    const q = input.value.trim(); if(!q) return;
    log.push({ role:"user", content:q }); input.value=""; input.style.height="auto";
    renderPanel();
  }
  const body = $("#panelBody");
  const holder = document.createElement("div");
  holder.className = "msg ia"; holder.innerHTML = '<span class="thinking"><i></i>Réflexion…</span>';
  ($("#chatLog")||body).appendChild(holder); body.scrollTop = body.scrollHeight;

  const rules = "Tu es l'aide de connaissance attachée au classeur de cours de l'étudiant. Tes règles :\n"
    + "1. Réponds à partir des documents ci-dessous en priorité ; ce sont SES notes de cours.\n"
    + "2. Si la réponse n'est pas dans ses notes, dis-le explicitement en une phrase, puis complète avec la connaissance standard du domaine.\n"
    + "3. Réponses courtes et structurées (markdown, listes). Pas de préambule, pas de flatterie.\n"
    + "4. Ne rajoute pas de remarques non demandées ; tu interviens sur ce qui est demandé.\n"
    + "5. Si une notion nécessaire au raisonnement manque dans ses notes, signale-le en une ligne à la fin, sous « À compléter : ».\n\n"
    + "SES DOCUMENTS :\n" + ctxChapitre(c, 20000);

  try{
    const texte = await iaTexte({
      system: NIVEAU + "\n\n" + rules,
      messages: log.slice(-10),
      effort: "medium", maxTokens: 8000,
      onText: t=>{ holder.innerHTML = md(t); body.scrollTop = body.scrollHeight; }
    });
    log.push({ role:"assistant", content:texte }); renderPanel();
  }catch(e){
    holder.innerHTML = '<span style="color:var(--alert)">'+esc(msgErreur(e))+"</span>";
    if(e && e.code!=="cancelled") log.pop();
  }
}

function msgErreur(e){
  const c = e && e.code;
  if(c==="cle_invalide") return "Clé refusée par " + FOURNISSEURS[IA.fournisseur].nom
    + (e.message ? ". Réponse exacte du fournisseur : « " + e.message + " »" : ".");
  if(c==="modele_inconnu") return "Aucun modèle utilisable trouvé pour cette clé. Vérifie qu'elle est bien active sur " + FOURNISSEURS[IA.fournisseur].lienCle + ".";
  if(c==="api_error") return "L'API a refusé la requête" + (e.message ? " : "+e.message : ".");
  if(c==="not_granted" || c==="sampling_disabled") return "L'assistant n'est pas configuré — voir ⚙ Réglages.";
  if(c==="rate_limited") return "Trop de demandes d'affilée — réessaie dans quelques minutes.";
  if(c==="prompt_too_large") return "Le chapitre est trop long à envoyer d'un coup. Analyse-le en deux chapitres.";
  if(c==="invalid_json") return "Réponse mal formée. Relance l'analyse.";
  if(c==="image_rejected") return "Image refusée : format non supporté ou fichier trop lourd.";
  if(c==="images_unavailable") return "Cette vue ne peut pas envoyer d'images. Ouvre le classeur depuis l'application Claude, ou colle le texte dans « Écrire un cours ».";
  if(c==="session_expired") return "Session expirée — reconnecte-toi puis réessaie.";
  if(c==="cancelled") return "Interrompu.";
  return "L'assistant n'a pas pu répondre. Réessaie.";
}
function iaError(e){ toast(msgErreur(e), 4200); }

let modalSticky = false;
function modal(html, opts){
  const host = $("#modalHost");
  modalSticky = !!(opts && opts.sticky);
  host.innerHTML = '<div class="scrim"><div class="modal'+((opts&&opts.wide)?" wide":"")+'" role="dialog" aria-modal="true">'+html+"</div></div>";
  const scrim = host.querySelector(".scrim");
  scrim.addEventListener("mousedown", e=>{ if(e.target===scrim && !modalSticky) closeModal(); });
  document.addEventListener("keydown", escClose);
  return host.querySelector(".modal");
}
function escClose(e){
  if(e.key!=="Escape") return;
  if(modalSticky && !confirm("Fermer sans enregistrer ?")) return;
  closeModal();
}
function closeModal(){ modalSticky=false; $("#modalHost").innerHTML=""; document.removeEventListener("keydown", escClose); }

      const [nom, code, prof] = l.split("|").map(s=>(s||"").trim());

                  : { id:uid(), nom, code:code||"", prof:prof||"", couleur:COULEURS[(anciens.length+idx)%COULEURS.length], ordre:idx };

function openImport(){
